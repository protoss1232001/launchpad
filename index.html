 e:`The first sentence gives the traditional view (white statues). The underlined sentence brings in new evidence (pigment) that complicates it, and the last sentence states the consequence.`},
].forEach(x=>item(Object.assign({sk:'rw_struct',stem:'struct'},x)));

// ---- Cross-text connections ----
[
{id:'crs01',d:1,q:'Based on the texts, how would the author of Text 2 most likely respond to the supporters described in Text 1?',
 p:`Many schools have replaced printed textbooks with tablets. Supporters point out that a single tablet can hold dozens of books, can be updated instantly, and weighs far less than a backpack full of printed texts.`,
 t2:`Tablets are convenient, but convenience is not the same as learning. Several studies have found that students reading long, complex passages tend to understand more when they read on paper than when they read the same passages on a screen. Schools should weigh that cost before discarding printed books.`,
 ch:[`By acknowledging the practical advantages of tablets while warning that they may reduce how well students understand long, complex texts`,`By agreeing that tablets should replace printed books as quickly as possible, since tablets can be updated instantly`,`By arguing that tablets cost schools more than printed textbooks once repairs and replacements are included`,`By claiming that students prefer printed books because printed books are lighter to carry than tablets`],
 e:`Text 2 grants that tablets are "convenient" but says paper can lead to better understanding, so schools should weigh that cost. Text 2 is about long, complex passages; it never discusses price, and Text 1 (not Text 2) says tablets are lighter.`},
{id:'crs02',d:1,q:'Based on the texts, how would the author of Text 2 most likely describe the image of dinosaurs presented in Text 1?',
 p:`In the early 1900s, museum displays and books showed dinosaurs as sluggish, cold-blooded reptiles that dragged their tails on the ground. This image shaped how the public imagined dinosaurs for decades.`,
 t2:`Beginning in the late 1960s, studies of fossils such as <i>Deinonychus</i>, a fast and agile predator, led paleontologists to rethink dinosaur biology. Later finds of feathered dinosaurs in China strengthened the view that birds descended from dinosaurs and that many dinosaurs were active animals.`,
 ch:[`As an outdated view that later fossil discoveries have challenged`,`As an accurate view that later discoveries have confirmed`,`As a view that only the public held and that scientists never shared`,`As a view that fits feathered dinosaurs but not <i>Deinonychus</i>`],
 e:`Text 2 says later discoveries made scientists "rethink" dinosaurs as active animals. That challenges the sluggish image in Text 1. Text 2 says paleontologists had to "rethink" dinosaur biology, so scientists, not just the public, had held the older view.`},
{id:'crs03',d:2,q:'Based on the texts, how would the researchers in Text 2 most likely respond to the planners\' argument in Text 1?',
 p:`Some urban planners argue that the best way to reduce traffic congestion is to add lanes to busy highways. More lanes, they say, let more cars move at once, so trips become faster.`,
 t2:`Researchers who study "induced demand" have found that adding highway lanes often eases congestion only briefly. Faster roads encourage people to drive more, and within a few years traffic can return to its earlier levels.`,
 ch:[`They would argue that the planners overlook how new lanes change people's driving habits over time.`,`They would agree that adding lanes to busy highways is the most lasting solution to traffic congestion.`,`They would argue that highways should have fewer lanes than they do now.`,`They would claim that new lanes make trips slower right away.`],
 e:`Text 2 accepts that new lanes help "briefly" but says more driving follows. The planners ignore that change in behavior. Text 2 never proposes removing lanes, and it says lanes help at first, not that they slow trips right away.`},
{id:'crs04',d:2,q:'Based on the texts, how would the author of Text 2 most likely respond to the teachers described in Text 1?',
 p:`Many educators have promoted "learning styles," the idea that each student learns best when material matches a preferred mode, such as visual or auditory. Teachers who adopt this view often survey students and tailor lessons to each one's style.`,
 t2:`The popularity of learning styles has far outpaced the evidence for them. When researchers have tested whether matching instruction to a student's preferred style improves results, most well-designed studies have found no such benefit. Students do have preferences, but a preference is not the same as the way a person actually learns best.`,
 ch:[`By suggesting that the teachers are acting on a belief that research has generally not supported`,`By agreeing that surveys are the most reliable way to find out how students learn`,`By arguing that students have no preferences about how material is presented`,`By claiming that visual instruction works better than auditory instruction for every student`],
 e:`Text 2 says well-designed studies found no benefit from matching lessons to styles, so the teachers are acting on an unsupported belief. Text 2 explicitly says students "do have preferences," which rules out that choice.`},
{id:'crs05',d:3,q:'Based on the texts, how would the author of Text 2 most likely respond to the products described in Text 1?',
 p:`The "Mozart effect" became famous in the 1990s after a study reported that college students who had just listened to a Mozart sonata scored higher on a spatial reasoning task. The finding inspired products promising that classical music would make babies smarter.`,
 t2:`Later researchers had trouble reproducing the original result, and those who did find an effect noted that it was small and lasted only minutes. Others found that listening to something enjoyable, such as a different piece of music or even a story, produced a similar short boost, most likely by improving mood and alertness.`,
 ch:[`By suggesting that the products promise far more than the research shows`,`By arguing that the products work only if babies listen to Mozart in particular`,`By claiming that the original study was never published`,`By agreeing that classical music produces lasting gains in intelligence`],
 e:`The original study tested college students, and Text 2 says any effect was small, brief, and not special to Mozart. Promises of smarter babies go far beyond that. Text 2 says other enjoyable sounds worked too, which rules out "Mozart in particular."`},
{id:'crs06',d:1,q:'Based on the texts, how would the author of Text 2 most likely respond to the view described in Text 1?',
 p:`Some readers see the ending of a mystery novel as its most important part. For them, the revelation of the culprit is the reward for hundreds of pages of suspense, and once the solution is known, the book has little left to offer.`,
 t2:`The best mysteries are worth rereading even when the solution is known. What keeps readers returning is the pleasure of noticing clues that were hidden in plain sight and of appreciating how carefully the author built the puzzle.`,
 ch:[`By arguing that the revelation of the culprit is not the only source of a mystery's appeal`,`By agreeing that a mystery has little value once its solution is known`,`By claiming that most mystery novels reveal the culprit too early for readers to enjoy the suspense`,`By recommending that readers skip ahead to the ending of a mystery`],
 e:`Text 2 says good mysteries are worth rereading for the clues and the construction, so the ending is not the only reward. That directly answers the view that a solved mystery has little left.`},
{id:'crs07',d:2,q:'Based on the texts, how would the author of Text 2 most likely respond to the recommendation in Text 1?',
 p:`Some ecologists recommend removing all non-native plant species from protected areas. They argue that such species crowd out native plants and disrupt the animals that depend on those plants.`,
 t2:`Not every introduced species causes harm. In some habitats, non-native plants now provide food or shelter for native animals whose original sources have declined, and removing those plants all at once could leave the animals worse off. Decisions about removal should be made case by case.`,
 ch:[`By cautioning that removing every non-native plant could sometimes harm the native animals it is meant to protect`,`By agreeing that all non-native plants should be removed from protected areas immediately and completely`,`By arguing that non-native plants never crowd out native plants and so should always be left in place`,`By claiming that native animals no longer need native plants now that non-native plants are available`],
 e:`Text 2 says some non-native plants now support native animals and asks for case-by-case decisions. It does not say non-native plants "never" cause harm; it says "not every" one does.`},
{id:'crs08',d:3,q:'Based on the texts, how would the author of Text 2 most likely respond to the conclusion in Text 1?',
 p:`At an inland site more than 100 kilometers from the sea, archaeologists found large numbers of seashells in the remains of an ancient settlement. They concluded that the people who lived there traveled regularly to the coast to gather food.`,
 t2:`Shells at inland sites need not mean that people made the journey themselves. Many ancient communities traded goods over long distances, and shells were often prized as ornaments or tools rather than eaten. Without evidence of how the shells were used or how they arrived, it is possible that the site's residents never saw the sea at all.`,
 ch:[`By arguing that the evidence is also consistent with explanations the archaeologists did not rule out`,`By agreeing that the residents traveled to the coast but disputing the distance`,`By arguing that the shells were most likely brought to the site by later residents`,`By claiming that seashells are rarely found at inland sites`],
 e:`Text 2 offers other explanations (trade, use as ornaments or tools) and says more evidence is needed. It does not accept the travel, does not mention later residents, and does not say inland shells are rare.`},
].forEach(x=>item(Object.assign({sk:'rw_cross'},x)));

// ---- Command of evidence: textual ----
[
{id:'evt01',d:1,q:Q_SUPPORT('the biologist\'s claim'),p:`A biologist claims that crows can recognize individual human faces and remember people who have threatened them.`,
 ch:[`Crows scolded and swooped at a person wearing a mask that had earlier been worn by someone who trapped crows, but ignored people wearing other masks.`,`Crows in the study area gathered in larger and noisier groups in winter than in summer, especially near places where people often left food.`,`Crows living in cities ate a wider variety of foods than crows living in forests, including many foods that people had thrown away.`,`Crows made more alarm calls in the early morning than at midday, whether or not any people were nearby.`],
 e:`Only the mask finding shows crows singling out one face linked to a threat. The other findings are about crows, but not about recognizing people.`},
{id:'evt02',d:1,q:Q_SUPPORT('the student\'s claim'),p:`A student claims that the city's new protected bike lanes have made cycling to work more popular.`,
 ch:[`The number of people biking to work in the city rose by 40 percent in the two years after the lanes opened, while it stayed flat in similar cities without new lanes.`,`The new bike lanes were painted bright green and separated from car traffic by low concrete barriers so that drivers and cyclists could see them easily.`,`Most residents surveyed in the year the lanes opened said that they own at least one car and drive it on most weekdays.`,`The city spent less building the new bike lanes than it spent repaving its main roads during the same two-year period.`],
 e:`The claim is about more people cycling to work. Only the ridership finding measures that, and the comparison with similar cities strengthens the link to the lanes.`},
{id:'evt03',d:2,q:Q_SUPPORT('the researchers\' hypothesis'),p:`Researchers hypothesized that a species of songbird sings at higher pitches in cities because low-pitched city noise, such as traffic, would otherwise drown out its songs.`,
 ch:[`Within the same city, birds of this species sang at higher pitches on noisy streets than in quiet parks.`,`Birds of this species sang more songs in spring than in autumn, when fewer of the birds were defending territories.`,`City birds of this species were slightly larger on average than rural birds of the same species.`,`Traffic in the city was heaviest during the morning and evening rush hours.`],
 e:`The hypothesis links higher pitch to noise. Comparing noisy and quiet places in the same city shows pitch rising with noise. The traffic finding mentions noise but says nothing about the birds.`},
{id:'evt04',d:3,q:Q_WEAKEN('the writer\'s claim'),p:`A nutrition writer claims that eating breakfast causes students to earn higher test scores, pointing out that students who eat breakfast tend to score higher than those who do not.`,
 ch:[`Students who eat breakfast are also more likely to get enough sleep, and once sleep is taken into account, breakfast is no longer linked to higher scores.`,`Among students who eat breakfast, those who choose cereal or toast score about the same as those who choose eggs or fruit.`,`Students who skip breakfast are more likely than other students to eat a large lunch and to snack in the afternoon.`,`Average test scores at the school rose slightly over the past five years, a period in which the school also added after-school tutoring.`],
 e:`The writer treats a link as a cause. If sleep explains the link, and breakfast stops mattering once sleep is counted, breakfast may not be the cause. The other findings do not touch the causal claim.`},
{id:'evt05',d:2,q:Q_QUOTE,p:`In Robert Frost's 1923 poem "Stopping by Woods on a Snowy Evening," the speaker is drawn to the quiet scene in front of him but also feels the pull of his responsibilities.`,
 ch:[`"The woods are lovely, dark and deep, / But I have promises to keep"`,`"Whose woods these are I think I know. / His house is in the village though"`,`"My little horse must think it queer / To stop without a farmhouse near"`,`"He gives his harness bells a shake / To ask if there is some mistake"`],
 e:`The claim has two parts: the scene's appeal and the pull of duty. "The woods are lovely" is the appeal; "But I have promises to keep" is the duty. The other lines describe the setting or the horse.`},
{id:'evt06',d:2,q:Q_QUOTE,p:`In William Wordsworth's poem "I Wandered Lonely as a Cloud," the speaker suggests that the memory of a natural scene can bring joy long after the scene itself has passed.`,
 ch:[`"For oft, when on my couch I lie / In vacant or in pensive mood, / They flash upon that inward eye / Which is the bliss of solitude"`,`"I wandered lonely as a cloud / That floats on high o'er vales and hills, / When all at once I saw a crowd, / A host, of golden daffodils"`,`"Continuous as the stars that shine / And twinkle on the milky way, / They stretched in never-ending line / Along the margin of a bay"`,`"Beside the lake, beneath the trees, / Fluttering and dancing in the breeze"`],
 e:`Only the first quotation happens later, at home on the couch: the daffodils "flash upon that inward eye," that is, in memory, and bring "bliss." The other quotations describe the original moment of seeing them.`},
{id:'evt07',d:3,q:Q_QUOTE,p:`In William Shakespeare's Sonnet 18, the speaker claims that, unlike a summer, the beauty of the person being addressed will not fade.`,
 ch:[`"But thy eternal summer shall not fade, / Nor lose possession of that fair thou ow'st"`,`"Shall I compare thee to a summer's day? / Thou art more lovely and more temperate"`,`"Rough winds do shake the darling buds of May, / And summer's lease hath all too short a date"`,`"Sometime too hot the eye of heaven shines, / And often is his gold complexion dimm'd"`],
 e:`The claim is that the person's beauty will last. "Thy eternal summer shall not fade" says exactly that. "Summer's lease hath all too short a date" is only about summer being short, and "more lovely" compares the person with summer without saying the beauty will last.`},
{id:'evt08',d:3,q:Q_SUPPORT('the economist\'s argument'),p:`After a city made its buses free, ridership rose. An economist argues that the increase came mainly from people who had previously driven, not simply from existing riders taking more trips.`,
 ch:[`Surveys found that most new riders after the change said they had previously made the same trips by car.`,`Total bus ridership rose by 25 percent in the first year after fares were eliminated.`,`Riders who used the bus before the change reported being more satisfied with the service afterward.`,`The city paid for the free fares by raising parking fees downtown.`],
 e:`The argument is about where the new riders came from. Only the survey of new riders shows they were former drivers. The 25 percent rise shows ridership grew, which the text already says, but not who the new riders were.`},
{id:'evt09',d:2,q:Q_WEAKEN('the archaeologists\' claim'),p:`A team of archaeologists claims that a set of stone tools found at a site was made by people who lived there about 12,000 years ago.`,
 ch:[`The layer of soil in which the tools were found also contains objects that are reliably dated to only about 2,000 years ago.`,`Tools similar in shape and size to the ones at this site have been found at several other sites in the same region.`,`The tools were made from a type of stone that is found only in a quarry about 20 kilometers from the site.`,`The edges of the tools show signs of having been sharpened many times, suggesting that they were used for years.`],
 e:`If the tools' layer holds objects only about 2,000 years old, the layer, and possibly the tools, may be far younger than 12,000 years. The other findings say nothing about the tools' age.`},
{id:'evt10',d:2,q:Q_SUPPORT('the psychologist\'s claim'),p:`A psychologist claims that people remember information they have tested themselves on better than information they have simply reread.`,
 ch:[`Students who studied a passage by taking practice quizzes recalled more of it a week later than students who spent the same amount of time rereading it.`,`Students who reread a passage said they felt more confident about remembering it than students who had quizzed themselves did.`,`Students who took practice quizzes spent more total time studying than students who reread.`,`Most students said that rereading was their favorite way to study.`],
 e:`The claim is about memory. Only the first finding measures recall, and it holds study time equal. Feeling confident is not the same as remembering, and extra study time would muddy the comparison.`},
].forEach(x=>item(Object.assign({sk:'rw_evidT'},x)));

// ---- Inferences ----
[
{id:'inf01',d:1,p:`A gardener planted two identical rows of tomato plants. Both rows received the same soil, water, and fertilizer, but a fence shaded one row for most of the day while the other received full sun. By late summer, the plants in the sunny row were much larger and had produced more fruit. The gardener concluded that ${BLANK}`,
 ch:[`the difference in sunlight most likely explains the difference in the plants' growth.`,`the fertilizer the gardener used was better suited to the plants in the shaded row than to those in the sunny row.`,`tomato plants grow best when they receive very little water, as long as they are also given fertilizer.`,`the fence added nutrients to the soil in the shaded row, which slowed the growth of the plants there.`],
 e:`Everything was the same except sunlight, so sunlight is the likely cause. Nothing in the text supports the other endings.`},
{id:'inf02',d:1,p:`Museum records show that a collector bought a certain painting in 1902. A letter the artist wrote in 1898 describes the painting as "finished and ready to be shown." The painting, therefore, must have been completed ${BLANK}`,
 ch:[`no later than 1898.`,`after the collector bought it in 1902.`,`sometime between 1902 and 1905.`,`by the collector rather than the artist.`],
 e:`In 1898 the artist already called it "finished," so it was done by 1898 at the latest.`},
{id:'inf03',d:2,p:`Bees are drawn to flowers partly by color. Researchers have found that bees can see ultraviolet light, which is invisible to humans, and that many flowers that look plain to people have striking ultraviolet patterns that guide bees toward nectar. These findings suggest that ${BLANK}`,
 ch:[`judging how appealing a flower is to bees by how it looks to human eyes can be misleading.`,`bees cannot see any of the colors that humans can see.`,`flowers with ultraviolet patterns produce more nectar than flowers that look plain to both bees and people.`,`humans could learn to see ultraviolet light with enough practice.`],
 e:`Flowers that look plain to us can look striking to bees, so our view is not a reliable guide to theirs. The text does not say bees see no human colors or compare nectar amounts.`},
{id:'inf04',d:1,p:`Unlike most metals, gallium melts at about 30°C (86°F), a temperature lower than that of the human body. A solid piece of gallium held in a person's hand for several minutes would therefore be expected to ${BLANK}`,
 ch:[`begin to melt.`,`feel much colder than the hand holding it.`,`stay solid until it is heated further.`,`become noticeably heavier.`],
 e:`A hand is warmer than gallium's melting point, so the metal would start to melt. No further heating is needed, and melting does not change how much something weighs.`},
{id:'inf05',d:2,p:`A company tested two versions of its website. Version A had a single large "Sign up" button. Version B had the same button plus three smaller links to other pages. Visitors to Version A signed up at nearly twice the rate of visitors to Version B, even though the pages were otherwise identical. One reasonable interpretation is that ${BLANK}`,
 ch:[`the extra links may have drawn visitors' attention away from signing up.`,`visitors to Version B could not see the "Sign up" button at all.`,`larger buttons always lead to more sign-ups than smaller ones.`,`most visitors prefer websites with many links.`],
 e:`The only difference was the extra links, so they may have distracted visitors. "Could not see" is too strong (people still signed up), and both versions had the same button.`},
{id:'inf06',d:2,p:`Before their nonstop autumn flight across the Pacific Ocean from Alaska to New Zealand, bar-tailed godwits nearly double their body weight, mostly by storing fat. At the same time, some of their digestive organs shrink substantially. Because the birds do not eat during the flight, researchers have suggested that shrinking these organs may help by ${BLANK}`,
 ch:[`reducing the weight the birds must carry on a journey during which those organs are not used.`,`allowing the birds to digest the food they catch during the flight more quickly and efficiently.`,`making the birds hungry enough that they stop to rest and eat on islands along the way.`,`helping the birds use the position of the sun to find their way across the open ocean.`],
 e:`The birds do not eat in flight, so digestive organs are not needed then; smaller organs mean less weight to carry. The flight is nonstop and without food, which rules out the second and third choices.`},
{id:'inf07',d:2,p:`Over five years, the population of a small fish in a lake declined sharply. During that time, the lake's water temperature, oxygen levels, and supply of the fish's food all stayed about the same. However, a larger predatory fish introduced to the lake six years earlier had greatly increased in number. Scientists concluded that ${BLANK}`,
 ch:[`the predator is a more likely cause of the decline than the lake's conditions or food supply.`,`the decline in the small fish was most likely caused by gradually rising water temperatures in the lake.`,`the predator eats only the small fish's food supply and never eats the small fish themselves.`,`the small fish will disappear from the lake entirely within the next year unless the predator is removed.`],
 e:`The text rules out temperature, oxygen, and food, which leaves the one thing that changed: the growing predator population. The prediction about disappearing within a year goes beyond the evidence.`},
{id:'inf08',d:3,p:`When printed books were expensive, most people who could read owned only a few titles. Historians have found that readers in that period often read the same books many times, sometimes aloud to their families, and filled the margins with notes. By the 1800s, cheaper printing had made books far more plentiful, and diaries from the time show readers moving quickly through many different titles. This change suggests that ${BLANK}`,
 ch:[`the way people read may have been shaped in part by how many books were available to them.`,`readers in the 1800s understood books better than earlier readers did.`,`earlier readers disliked reading aloud to their families.`,`books became more expensive during the 1800s, so readers could afford fewer of them.`],
 e:`As books became plentiful, reading shifted from rereading a few to moving through many. That pattern suggests availability affected reading habits. The text says nothing about understanding, and books became cheaper, not more expensive.`},
{id:'inf09',d:2,p:`A word's meaning can drift over centuries. The English word "nice," for example, once meant "foolish" or "ignorant," and only gradually came to mean "pleasant." Because of changes like this, a reader who comes across "nice" in a very old text ${BLANK}`,
 ch:[`should not assume that the word carries its modern meaning.`,`will find that the word had no meaning at the time.`,`can be certain that the author meant "pleasant."`,`should conclude that the text was written by a linguist.`],
 e:`Since "nice" once meant something very different, a reader cannot assume the modern sense in an old text. "Can be certain" is the opposite of what the text shows.`},
{id:'inf10',d:3,p:`In a study of decision-making, participants could draw from one of two jars and won a prize if they drew a red marble. One jar held 1 red marble among 10 marbles; the other held 9 red marbles among 100. Although the first jar offered the better chance (10 percent versus 9 percent), many participants chose the second jar. The researchers suggested that these participants were swayed by ${BLANK}`,
 ch:[`the larger number of red marbles in the second jar, even though its share of red marbles was smaller.`,`a careful calculation showing that the second jar offered them a better chance of drawing a red marble.`,`the colors of the other marbles in each jar, which made the red marbles easier or harder to see.`,`a mistaken belief that the first jar held more red marbles than the second jar held.`],
 e:`The second jar had more red marbles (9 versus 1) but a smaller share of them. Choosing it suggests people looked at the count, not the proportion. A careful calculation would have favored the first jar.`},
].forEach(x=>item(Object.assign({sk:'rw_infer',stem:'infer'},x)));

// ---- Rhetorical synthesis ----
[
{id:'syn01',d:1,q:SYN('emphasize the significance of one of Anning\'s discoveries'),p:NOTES([`Mary Anning (1799–1847) was a fossil collector in Lyme Regis, England.`,`She searched the sea cliffs near her home, often after storms had exposed new rock.`,`In 1823, she found the first complete skeleton of a plesiosaur, a large marine reptile.`,`As a woman, she was not allowed to join the Geological Society of London.`]),
 ch:[`In 1823, Anning found the first complete skeleton ever discovered of a plesiosaur, a large marine reptile.`,`Mary Anning, who lived from 1799 to 1847, collected fossils from the sea cliffs near her home in Lyme Regis, England.`,`Anning searched the sea cliffs near her home, often after storms had exposed new rock.`,`As a woman, Anning was not allowed to join the Geological Society of London.`],
 e:`The goal is the significance of a discovery. Only the first choice names a discovery and says why it mattered: it was the first complete plesiosaur skeleton.`},
{id:'syn02',d:1,q:SYN('introduce Wangari Maathai to an audience unfamiliar with her'),p:NOTES([`Wangari Maathai (1940–2011) was a Kenyan environmental activist.`,`In 1977, she founded the Green Belt Movement.`,`The movement has worked with communities, especially women, to plant tens of millions of trees in Kenya.`,`In 2004, Maathai became the first African woman to receive the Nobel Peace Prize.`]),
 ch:[`Wangari Maathai, a Kenyan environmental activist, founded the Green Belt Movement in 1977.`,`The Green Belt Movement, founded in 1977, has worked with communities to plant tens of millions of trees in Kenya.`,`In 2004, Maathai became the first African woman to receive the Nobel Peace Prize.`,`Tens of millions of trees have been planted in Kenya by communities working together, especially women.`],
 e:`An unfamiliar audience needs to know who she is. Only the first choice identifies her ("a Kenyan environmental activist") along with her work. The others name her without saying who she is, or leave her out.`},
{id:'syn03',d:2,q:SYN('emphasize the difference in length between the two bridges\' main spans'),p:NOTES([`The Golden Gate Bridge and the Akashi Kaikyō Bridge are both suspension bridges; a suspension bridge's main span is the distance between its two towers.`,`The Golden Gate Bridge in San Francisco opened in 1937.`,`Its main span is 1,280 meters long.`,`The Akashi Kaikyō Bridge in Japan opened in 1998.`,`Its main span is 1,991 meters long.`]),
 ch:[`At 1,991 meters, the main span of the Akashi Kaikyō Bridge is more than 700 meters longer than the Golden Gate Bridge's 1,280-meter span.`,`The Golden Gate Bridge in San Francisco opened in 1937, and the Akashi Kaikyō Bridge in Japan opened in 1998.`,`Both the Golden Gate Bridge and the Akashi Kaikyō Bridge are suspension bridges, each with a main span between two towers.`,`The main span of a suspension bridge such as the Golden Gate Bridge is the distance between its two towers.`],
 e:`Only the first choice compares the two span lengths and states the size of the difference (1,991 − 1,280 = 711 meters). The second compares dates, and the third states a similarity.`},
{id:'syn04',d:2,q:SYN('explain why the vault\'s location helps protect the seeds'),p:NOTES([`The Svalbard Global Seed Vault opened in 2008 on a remote Norwegian island in the Arctic.`,`It stores seeds of food crops sent by gene banks around the world.`,`It is a backup: if a gene bank's seeds are lost to war or disaster, copies are safe in the vault.`,`Seeds are kept at −18°C (about 0°F).`,`The permafrost around the vault would keep the seeds frozen even if the power failed.`]),
 ch:[`Because the vault is surrounded by permafrost, the seeds inside would stay frozen even if the power failed.`,`The Svalbard Global Seed Vault, which opened in 2008, stores seeds of food crops sent by gene banks around the world.`,`If a gene bank's seeds are lost to war or disaster, copies of those seeds are kept safe in the vault as a backup.`,`Seeds in the vault, on a remote Norwegian island in the Arctic, are kept at −18°C, which is about 0°F.`],
 e:`The goal asks how the location protects the seeds. Only the first choice links the place (permafrost) to protection (the seeds stay frozen without power). The last choice names the place and the temperature but does not say how the place helps.`},
{id:'syn05',d:1,q:SYN('emphasize tardigrades\' ability to survive extreme conditions'),p:NOTES([`Tardigrades are tiny animals; most are less than 1 millimeter long.`,`They live in many habitats, including moss, soil, and the ocean floor.`,`When their surroundings dry out, they can curl up into a state called a "tun," in which their body processes nearly stop.`,`In 2007, some tardigrades survived ten days of exposure to open space during a satellite mission.`]),
 ch:[`Tardigrades are remarkably hardy: some even survived ten days of exposure to open space during a 2007 satellite mission.`,`Tardigrades are tiny animals that live in many different habitats, from moss and soil to the ocean floor.`,`Tardigrades are tiny animals; most of them are less than 1 millimeter long.`,`In 2007, as part of a satellite mission, some tardigrades were exposed to open space for ten days.`],
 e:`Only the first choice stresses survival in an extreme condition. The last choice mentions the mission but not that they survived open space.`},
{id:'syn06',d:2,q:SYN('describe the premise of <i>Kindred</i>'),p:NOTES([`Octavia E. Butler (1947–2006) was an American science fiction writer.`,`Her novel <i>Kindred</i> (1979) follows a Black woman from the 1970s who is pulled back in time to a plantation in the early 1800s.`,`Her work often explores power, survival, and community.`,`In 1995, she became the first science fiction writer to receive a MacArthur Fellowship.`]),

// ---- loading and saving ----
// SAVE_OFF says why saving is switched off: 'newer' (the save came from a newer version of the app),
// 'blocked' (the browser will not let the app read storage), 'rescue' (an unreadable save could not
// be set aside), or 'stale' (another window saved newer progress).
let SAVE_OFF='',SAVE_FAIL=false,REV=0,BUSY_AT=0;
// Saves that cannot be read are kept aside, the three most recent under their own keys.
const rescueKeys=()=>{try{return Object.keys(localStorage).filter(k=>k.startsWith(KEY+'-rescue')).sort()}catch(e){return []}};
function rescue(raw){try{localStorage.setItem(KEY+'-rescue-'+Date.now(),raw);const ks=rescueKeys().filter(k=>k!==KEY+'-rescue');ks.slice(0,Math.max(0,ks.length-3)).forEach(k=>localStorage.removeItem(k));return true}catch(e){return false}}

 if(raw==null)return norm(fresh());let s=null;try{s=JSON.parse(raw)}catch(e){}
 if(plainObj(s)&&typeof s.v==='number'&&s.v>1){SAVE_OFF='newer';return norm(fresh())}
 if(plainObj(s)&&s.v===1&&(s.app==null||s.app==='sat')){try{return norm(s)}catch(e){}}
 if(!rescue(raw))SAVE_OFF='rescue';return norm(fresh())}

 try{const stored=+(localStorage.getItem(KEY+'-rev')||0);if(stored>REV){otherWindow(stored);return false}
  localStorage.setItem(KEY,JSON.stringify(S));REV=stored+1;localStorage.setItem(KEY+'-rev',String(REV));if(S.cur||(S.tst&&S.tst.active))BUSY_AT=Date.now();if(SAVE_FAIL){SAVE_FAIL=false;const b=document.getElementById('savewarn');if(b)b.remove()}return true}

const wordByW={};WORDS.forEach(x=>wordByW[x.w]=x);
const wClose=(a,b)=>a===b||(WGRP[a]&&WGRP[a].has(b));

// ---- review schedule (Leitner boxes) ----
const BOX_DAYS=[0,1,3,7,16,35];
const NEW_PER_DAY=5;
const wst=w=>S.vocab[w];
function dueWords(){const t=today();return WORDS.filter(x=>{const s=wst(x.w);return s&&s.due<=t}).sort((a,b)=>wst(a.w).due<wst(b.w).due?-1:wst(a.w).due>wst(b.w).due?1:0).map(x=>x.w)}
// New words come in a fixed mixed order (not alphabetical), so look-alikes are not introduced together.
const WORD_ORDER=WORDS.map((x,i)=>[((i*7919)%WORDS.length)*1000+i,x.w]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function newWords(n){const out=[];for(const w of WORD_ORDER){if(out.length>=n)break;if(!wst(w))out.push(w)}return out}
function wordsLearned(){return Object.keys(S.vocab).filter(w=>wordByW[w]&&S.vocab[w].box>=3).length}
function gradeWord(w,ok){const s=S.vocab[w]||(S.vocab[w]={box:0,due:today(),r:0,n:0});s.n++;s.last=today();
 if(ok){s.r++;s.box=Math.min(5,s.box+1);s.due=addDays(today(),BOX_DAYS[s.box])}else{s.box=0;s.due=addDays(today(),1)}}

// Three kinds of word questions: meaning to word, word to meaning, and meaning in context.
function wordChoices(key,n,field){const pool=shuf(WORDS.filter(x=>x.pos===key.pos&&!wClose(key.w,x.w)&&!(field==='w'&&x.m)));const out=[];
 for(const x of pool){if(out.length>=n)break;if(out.some(o=>wClose(o.w,x.w)))continue;out.push(x)}return out}
function wordQ(w,kind){const k=wordByW[w];if(!k)return null;kind=kind||(k.m?'ctx':pick(['def2w','w2def','ctx']));
 if(kind==='def2w'){const o=wordChoices(k,3,'w');const ch=shuf([k,...o]);return {type:'mc',kind,word:w,q:`Which word means <b>${esc(k.def)}</b>?`,ch:ch.map(x=>esc(x.w)),a:ch.indexOf(k),exp:`<b>${esc(k.w)}</b> (${k.pos}.): ${esc(k.def)}. ${esc(k.sent.replace('___',k.w))}`}}
 const sent=esc(k.sent).replace('___',`<b>${esc(k.w)}</b>`);
 let others=wordChoices(k,k.m?2:3,'def').map(x=>x.def);if(k.m)others=[k.m,...others];
 const defs=shuf([k.def,...others]);
 const q=kind==='ctx'?`<div class="ctx">${sent}</div>As used in the text, what does the word <b>${esc(k.w)}</b> most nearly mean?`:`What does <b>${esc(k.w)}</b> mean?`;
 return {type:'mc',kind,word:w,q,ch:defs.map(esc),a:defs.indexOf(k.def),exp:`<b>${esc(k.w)}</b> here means ${esc(k.def)}.${k.m?` It does not mean "${esc(k.m)}," its everyday sense.`:''} ${kind!=='ctx'?esc(k.sent.replace('___',k.w)):''}`}}

// ================= WHY-MISSED AND THE FOCUS LIST =================
const REASONS={concept:'Did not know how',misread:'Misread the question',trap:'Fell for a trap',careless:'Careless slip',time:'Rushed or out of time',desmos:'Should have used Desmos'};
const REASON_TIPS={concept:'Open the lesson for that skill, then practice it at the easiest level until it feels solid.',
 misread:'Before choosing, say what the question asks in your own words: which value, which text, which claim.',
 trap:'Before choosing, ask why each wrong answer is tempting. Traps usually match a half-finished step or a true detail that does not answer the question.',

const FOCUS_MAX=80;
function focusKey(q){if(q.fk)return q.fk;if(q.word)return 'v:'+q.word;if(q.rid)return 'r:'+q.rid;if(q.skill&&SK[q.skill])return `m:${q.skill}:${q.diff}`;return null}
function focusValid(k){const [t,a,b]=k.split(':');if(t==='v')return !!wordByW[a];if(t==='r')return !!itemById(a);if(t==='m')return !!SK[a]&&[1,2,3].includes(+b);return false}
// Served only while the skill is open (a skill can close again if the math course setting changes).
// Served only while the skill is open and not paused ("not taught yet").
function focusOpen(k){if(!focusValid(k))return false;const [t,a,b]=k.split(':');if(t==='v')return true;if(t==='r')return skActive(itemById(a).sk);return skActive(a)&&levelOK(a,+b)}
const focusSec=k=>k[0]==='m'?'math':k[0]==='r'?'rw':'words';
const focusCount=sec=>S.focus.filter(f=>focusOpen(f.k)&&(!sec||focusSec(f.k)===sec)).length;
function focusLabel(k){const [t,a,b]=k.split(':');if(t==='v')return `Word: ${a}`;if(t==='r'){const it=itemById(a);return it?`${SK[it.sk].t}`:a}
 if(t==='m')return `${SK[a]?SK[a].t:a} · ${['easy','medium','hard'][b-1]}`;return k}
// A miss adds the question to the focus list. It leaves after two correct answers,
// each in a later session than the last miss (so a quick retry does not count).
function afterAnswer(q,ok,sid){const k=focusKey(q);if(!k)return null;const i=S.focus.findIndex(x=>x.k===k);
 if(!ok){let f=S.focus[i];if(!f){f={k,n:0,ok:0,d:today()};S.focus.unshift(f)}f.n++;f.ok=0;f.sid=sid;f.last=today();
  if(S.focus.length>FOCUS_MAX)S.focus.length=FOCUS_MAX;const mid=newSid();S.missLog.push({d:today(),sec:q.sec||'rw',sk:q.skill||'',k,id:mid});if(S.missLog.length>500)S.missLog.splice(0,S.missLog.length-500);return mid}
 const f=S.focus[i];if(f&&f.sid!==sid&&(f.last||f.d)<today()&&f.okd!==today()){f.ok++;f.sid=sid;f.okd=today();if(f.ok>=2)S.focus.splice(i,1)}return null}
function setReason(mid,k,tag){const m=S.missLog.find(x=>x.id===mid);if(m)m.tag=tag;const f=S.focus.find(x=>x.k===k);if(f)f.tag=tag;save()}
function focusQ(k){const [t,a,b]=k.split(':');let q=null;
 if(t==='v')q=wordQ(a,'ctx');else if(t==='r'){const it=itemById(a);if(it){q=serveItem(it);q.skill=it.sk;q.sec='rw'}}else if(t==='m')q=genQ(a,+b);
 if(q)q.fk=k;return q}
function focusQs(n,sec){const out=[];for(const f of S.focus){if(out.length>=n)break;if(!focusOpen(f.k)||(sec&&focusSec(f.k)!==sec))continue;const q=focusQ(f.k);if(q)out.push(q)}return out}

// ================= DAILY PLAN =================
// Three separate daily pieces: words, a math session, and a reading and writing session.
// Each section moves at its own pace, so reading and writing never waits on math.
function openSkills(sec){return secSkills(sec).filter(skActive)}
// The skill to work on: open, not paused, not yet mastered, the one left alone longest.
// Never-practiced skills come first, phase 1 before phase 2 and easier courses first; after that, the
// skill left alone longest.
function nextSkill(sec){const c=openSkills(sec).filter(id=>!mastered(id));const pool=c.length?c:openSkills(sec);if(!pool.length)return null;
 const last=id=>S.sk[id]&&S.sk[id].last||'';return pool.slice().sort((a,b)=>last(a)<last(b)?-1:last(a)>last(b)?1:(SK[a].phase-SK[b].phase)||((SK[a].course||0)-(SK[b].course||0))||skAcc(a).acc-skAcc(b).acc)[0]}
const SESS={math:{n:7,review:3,per:1.5},rw:{n:7,review:3,per:1.2}};
function sectionPlan(sec){sec=sec==='rw'?'rw':'math';const rs=S.resumeSkill[sec];const id=rs&&SK[rs]&&skActive(rs)&&!mastered(rs)?rs:nextSkill(sec);const o=SESS[sec];return {sec,id,lesson:!!id&&!S.seenLesson[id],n:o.n,review:o.review,min:Math.round((id&&!S.seenLesson[id]?4:0)+(o.n+o.review)*o.per)}}
function wordPlan(){const due=dueWords().slice(0,15);const nw=newWords(Math.max(0,NEW_PER_DAY-Math.max(0,due.length-10)));return {due,nw,min:Math.max(2,Math.round((due.length+nw.length)*0.35+(nw.length?2:0)))}}
const doneToday=k=>S.lastDay[k]===today();
function reviewQs(n,sec,exclude){const out=focusQs(Math.min(2,n),sec);const used=new Set(out.map(q=>q.rid).filter(Boolean));const practiced=Object.keys(S.sk).filter(id=>SK[id]&&DOMS[SK[id].dom].sec===sec&&skActive(id)&&id!==exclude);
 for(const id of shuf(practiced)){if(out.length>=n)break;const q=skillQs(id,levelFor(id),1,used)[0];if(q)out.push(q)}
 for(const id of shuf(openSkills(sec).filter(id=>id!==exclude))){if(out.length>=n)break;const q=skillQs(id,1,1,used)[0];if(q)out.push(q)}return shuf(out)}

// ================= PRACTICE SESSIONS =================
// n questions on one skill with no passage or question wording repeated; fewer if the bank runs out.
function skillQs(id,d,n,used){used=used||new Set();const out=[];for(let i=0;i<n;i++){let q=null;

  let cands=sec==='math'?ids.filter(id=>want?sprRate(id,d)>0.2:sprRate(id,d)<0.8):ids;if(!cands.length)cands=ids;

let clockH=null,lastTick=0;
function startClock(){stopClock();lastTick=Date.now();clockH=setInterval(tickClock,250)}
function stopClock(){clearInterval(clockH);clockH=null}
// A gap of more than two minutes between ticks means the device slept or the app was suspended.
// That time is not charged to the clock (as if Save and exit had been pressed), and the result is marked paused.
function tickClock(){const T=S.tst;if(!T||!T.active){stopClock();return}const now=Date.now();let dt=(now-lastTick)/1000;lastTick=now;
 if(dt>120){dt=0;T.paused=true;toast('The device was asleep. The clock stopped meanwhile, and this test will be marked as paused.')}
 if(T.phase==='break'){T.breakLeft-=dt;const e=$('#brk');if(e)e.textContent=mmss(T.breakLeft);if(T.breakLeft<=0){T.phase='between';save();render()}else if(Math.floor(now/5000)!==Math.floor((now-dt*1000)/5000))save();return}
 if(T.phase!=='module')return;const m=T.mods[T.mi];m.left-=dt;if(!m.review)m.secs[m.i]+=dt;
 const e=$('#clock');if(e){e.textContent=mmss(m.left);e.classList.toggle('warn',m.left<=300)}
 if(m.left<=300&&!m.warned){m.warned=true;T.hideClock=false;const c=$('#clock');if(c)c.classList.remove('hid');const hb=$('#hideclk');if(hb)hb.textContent='Hide';toast('5 minutes remaining in this module.')}
 if(m.left<=0){m.left=0;toast('Time is up. The module was submitted.');submitModule();return}
 if(Math.floor(now/5000)!==Math.floor((now-dt*1000)/5000))save()}
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.className='show';clearTimeout(t._h);t._h=setTimeout(()=>t.className='',Math.max(4000,msg.length*60))}

// ---- highlighter: passage words become clickable spans, numbered in document order ----
function wordify(root){let n=0;const walk=node=>{for(const ch of [...node.childNodes]){if(ch.nodeType===3){const parts=ch.textContent.split(/(\s+)/);if(parts.length===1&&!parts[0].trim())continue;
  const frag=document.createDocumentFragment();parts.forEach(p=>{if(!p)return;if(/^\s+$/.test(p))frag.appendChild(document.createTextNode(p));else{const s=document.createElement('span');s.className='hw';s.dataset.w=n++;s.textContent=p;frag.appendChild(s)}});ch.replaceWith(frag)}
  else if(ch.nodeType===1&&!['svg','SVG','TABLE','table'].includes(ch.tagName)&&!ch.classList.contains('blank'))walk(ch)}};walk(root)}

 <div class="card"><h3>Timed module</h3><p class="muted small">${MOD[sec].n} questions in ${MOD[sec].min} minutes, with the full test tools. Builds pacing.</p><button class="btn" data-test="${sec==='math'?'modmath':'modrw'}">Start a timed module</button></div>
 ${fc?`<div class="card"><h3>Focus list <span class="badge">${fc}</span></h3><p class="muted small">${SECN[sec]} questions you missed, until you get each right twice on later days.</p><button class="btn" data-focus="${sec}">Practice the focus list</button></div>`:''}
 <div class="card ${p3?'':'dim'}"><h3>Hard drill ${p3?'':'<span class="pill">phase 3</span>'}</h3><p class="muted small">${p3?`10 of the hardest questions, with a ${PACE[sec]}-second pace clock.`:'Opens when this section\'s estimate reaches 650.'}</p>${p3?`<button class="btn" data-drill="${sec}">Start a hard drill</button>`:''}</div></div>
 <div class="card"><div class="cardhead"><h3>Skills</h3><div class="chips small">Level: ${['Auto','Easy','Medium','Hard'].map((l,i)=>`<button class="chip ${pd===i?'on':''}" data-pdiff="${i}">${l}</button>`).join('')}</div></div>
 ${doms.map(d=>`<h4>${DOMS[d].t}</h4>${Object.keys(SK).filter(id=>SK[id].dom===d).sort((a,b)=>SK[a].phase-SK[b].phase).map(skRow).join('')}`).join('')}</div></div>`}

// ---- tests ----
function viewTests(){const hist=S.tests.slice().reverse();
 return `<div class="wrap"><h2>Practice tests</h2><p class="muted">Adaptive, timed, and scored like the digital SAT: Module 1 decides whether Module 2 is harder or easier. Tools: timer (hide or show), mark for review, answer cross-out, passage highlighter, reference sheet, and Desmos.</p>
 ${S.tst?`<div class="card accent"><h3>Unfinished: ${esc(TEST_KINDS[S.tst.kind].t)}</h3><div class="actions"><button class="btn primary" id="tresumebtn">Resume</button><button class="btn ghost danger" id="tdiscard">Discard</button></div></div>`:''}
 <div class="grid2"><div class="card"><h3>Full practice test</h3><p class="muted small">Reading and Writing (64 minutes), a 10-minute break, then Math (70 minutes): 2 hours 24 minutes in all.</p><button class="btn primary" data-test="full">Start full test</button></div>
 <div class="card"><h3>One section</h3><p class="muted small">Both modules of one section, adaptive and timed.</p><div class="actions"><button class="btn" data-test="rw">Reading and Writing</button><button class="btn" data-test="math">Math</button></div></div></div>
 <p class="small muted">Scores here come from a simplified model and are shown as ranges. The official Bluebook practice tests are the best predictor; log those on the Progress tab.</p>
 <div class="card"><h3>History</h3>${hist.length?`<div class="tblwrap"><table class="tbl hist"><thead><tr><th>Date</th><th>Test</th><th>R&amp;W</th><th>Math</th><th>Total</th></tr></thead><tbody>${hist.map(t=>`<tr><td>${shortDate(t.date)}</td><td>${esc(TEST_KINDS[t.kind].t)}${t.paused?' <span class="pill">paused</span>':''}</td>
  <td>${t.rw?(t.rw.est?`${t.rw.est} <span class="small muted">(${t.rw.route==='hard'?'H':'E'})</span>`:`${t.rw.c[0]}/${t.rw.n[0]}`):''}</td><td>${t.math?(t.math.est?`${t.math.est} <span class="small muted">(${t.math.route==='hard'?'H':'E'})</span>`:`${t.math.c[0]}/${t.math.n[0]}`):''}</td><td>${t.total||''}</td></tr>`).join('')}</tbody></table></div><p class="small muted">H or E: whether Module 2 was the harder or easier version.${S.lastReview?' <button class="linkbtn" data-view="result">Review the latest test</button>':''}</p>`:'<p class="muted">No tests yet.</p>'}</div></div>`}

// ---- words ----
const WF={due:'Due',learning:'Learning',learned:'Learned',m:'Second meanings',new:'Not started',all:'All'};
function wfilter(f){const t=today();return WORDS.filter(x=>{const s=S.vocab[x.w];if(f==='due')return s&&s.due<=t;if(f==='learning')return s&&s.box<3;if(f==='learned')return s&&s.box>=3;if(f==='m')return !!x.m;if(f==='new')return !s;return true})}
function viewWords(){const f=S.wf||'due';const list=wfilter(f);const due=dueWords().length;
 return `<div class="wrap"><h2>Words</h2><p class="muted">The SAT tests words in context: precise academic words, and everyday words used in a less common sense (like <i>arrest</i> meaning "stop the progress of"). Each word comes back after 1, 3, 7, 16, then 35 days while you keep getting it right.</p>
 <div class="stats4"><div class="stat"><div class="statn">${wordsLearned()}</div><div class="statl">learned</div></div><div class="stat"><div class="statn">${wfilter('learning').length}</div><div class="statl">learning</div></div><div class="stat"><div class="statn">${due}</div><div class="statl">due today</div></div><div class="stat"><div class="statn">${WORDS.length}</div><div class="statl">in the list</div></div></div>
 <div class="actions"><button class="btn primary" id="wreview">${due?`Review ${Math.min(20,due)} due word${due===1?'':'s'}`:'Learn new words'}</button></div>
 <div class="chips">${Object.entries(WF).map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-wf="${k}">${l} <span>${wfilter(k).length}</span></button>`).join('')}</div>
 ${list.length?`<div class="wordgrid">${list.map(x=>{const s=S.vocab[x.w];const lv=s?Math.min(4,s.box):0;return `<button class="wcard lv${lv}" data-flip aria-expanded="false"><div class="wfront"><b>${esc(x.w)}</b><i>${x.pos}.</i></div><div class="wback"><b>${esc(x.w)}</b><span>${esc(x.def)}</span><em>${esc(x.sent).replace('___','<u>'+esc(x.w)+'</u>')}</em>${x.m?`<span class="small muted">Not: ${esc(x.m)}</span>`:''}</div></button>`}).join('')}</div>`:`<p class="muted">Nothing here yet.</p>`}</div>`}
function wireWords(){$$('[data-flip]').forEach(b=>b.onclick=()=>{b.classList.toggle('flipped');b.setAttribute('aria-expanded',b.classList.contains('flipped'))});$$('[data-wf]').forEach(b=>b.onclick=()=>{S.wf=b.dataset.wf;save();render()});$('#wreview').onclick=startWords}

// ---- progress ----
const OFF={psat89:{t:'PSAT 8/9',lo:120,hi:720},psat10:{t:'PSAT 10',lo:160,hi:760},nmsqt:{t:'PSAT/NMSQT',lo:160,hi:760},sat:{t:'SAT',lo:200,hi:800},bluebook:{t:'Bluebook practice test',lo:200,hi:800}};
const selIndex=o=>o.type==='nmsqt'?(2*o.rw+o.math)/10:null;
function trendChart(){const app=S.tests.filter(t=>t.total).map(t=>({d:t.date,v:t.total,k:'app'}));const off=S.official.filter(o=>['sat','bluebook'].includes(o.type)).map(o=>({d:o.date,v:o.rw+o.math,k:'off',t:OFF[o.type].t}));
 const pts=[...app,...off].sort((a,b)=>a.d<b.d?-1:1);if(pts.length<2)return '';const W=560,H=190,pl=40,pr=12,pt=12,pb=24;const d0=pts[0].d,span=Math.max(1,daysBetween(d0,pts[pts.length-1].d));
 const vs=[...pts.map(p=>p.v),S.target];const lo=Math.max(400,Math.floor((Math.min(...vs)-50)/100)*100),hi=Math.min(1600,Math.ceil((Math.max(...vs)+50)/100)*100);
 const X=d=>pl+(W-pl-pr)*daysBetween(d0,d)/span,Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));let g='';
 for(let v=lo;v<=hi;v+=100)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" class="ft tiny">${v}</text>`;
 g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(S.target)}" y2="${Y(S.target)}" stroke="var(--muted)" stroke-dasharray="5 4"/><text x="${W-pr}" y="${Y(S.target)-5}" text-anchor="end" class="ft tiny">target ${S.target}</text>`;
 const ap=pts.filter(p=>p.k==='app');if(ap.length>1)g+=`<polyline fill="none" stroke="var(--bar1)" stroke-width="2" points="${ap.map(p=>`${X(p.d)},${Y(p.v)}`).join(' ')}"/>`;
 pts.forEach(p=>{g+=p.k==='app'?`<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="4.5" fill="var(--bar1)" stroke="var(--card)" stroke-width="2"><title>App test, ${shortDate(p.d)}: ${p.v}</title></circle>`:`<rect x="${X(p.d)-5}" y="${Y(p.v)-5}" width="10" height="10" fill="var(--bar2)" stroke="var(--card)" stroke-width="2" transform="rotate(45 ${X(p.d)} ${Y(p.v)})"><title>${esc(p.t)}, ${shortDate(p.d)}: ${p.v}</title></rect>`});
 return `<div class="legend small"><span><i class="lg dot"></i>App practice tests (estimate)</span><span><i class="lg dia"></i>Bluebook and SAT scores</span></div><svg class="fig trend" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Score trend">${g}</svg>`}
function whyCard(){const since=addDays(today(),-60);const rec=S.missLog.filter(m=>m.d>=since);const tagged=rec.filter(m=>m.tag);if(rec.length<5)return `<p class="muted small">After a few more misses, this shows why they happen.</p>`;
 const c={};tagged.forEach(m=>c[m.tag]=(c[m.tag]||0)+1);const top=Object.entries(c).sort((a,b)=>b[1]-a[1]);
 return `<p class="small muted">${rec.length} misses in the last 60 days, ${tagged.length} tagged.</p>${top.length?`<div class="strands">${top.map(([t,n])=>`<div class="strand"><span>${REASONS[t]}</span><div class="bar thin"><div style="width:${pct(n,tagged.length)}%"></div></div><span class="strandn">${n}</span></div>`).join('')}</div><div class="tip"><b>Most common: ${REASONS[top[0][0]]}.</b> ${REASON_TIPS[top[0][0]]}</div>`:'<p class="muted small">Tag misses after each question to see patterns here.</p>'}`}
function paceCard(){const out=['rw','math'].map(sec=>{const ts=S.tests.filter(t=>t[sec]).slice(-3);const pr=S.pace[sec];if(!ts.length&&!(pr&&pr.n))return '';
  const tavg=ts.length?Math.round(ts.reduce((a,t)=>a+t[sec].avg,0)/ts.length):null;
  return `<div class="strand wide"><span>${SECN[sec]}</span><span>${tavg!=null?`tests: <b>${tavg} s</b>/question`:''}${pr&&pr.n?` · practice: ${Math.round(pr.s/pr.n)} s (${pct(pr.slow,pr.n)}% slow)`:''}</span><span class="strandn">goal ${PACE[sec]} s</span></div>`}).join('');
 return out||'<p class="muted small">Timing shows up after practice and tests.</p>'}
function viewProgress(){const lt=latestTotal();const rows=S.official.slice().sort((a,b)=>a.date<b.date?1:-1);
 return `<div class="wrap"><h2>Progress</h2>
 <div class="grid2"><div class="card"><h3>Score estimate</h3>${lt?`<div class="hugescore">${lt.total}</div><p class="muted small">From the latest full practice test (${shortDate(lt.date)}). Range ${Math.max(400,lt.total-70)}–${Math.min(1600,lt.total+70)}. Target ${S.target}${lt.total<S.target?`: ${S.target-lt.total} points to go`:': reached'}.</p>`:`<p class="muted">Take a full practice test for an estimate.</p>`}
 <p class="small">Best section estimates: Reading and Writing <b>${best('rw')||'—'}</b>, Math <b>${best('math')||'—'}</b></p>${trendChart()}</div>
 <div class="card"><h3>Why questions are missed</h3>${whyCard()}<h4>Pace</h4>${paceCard()}</div></div>
 <div class="card"><h3>Skill map</h3><p class="muted small">Mastered: 85% or better over at least ${MASTER_N} medium or hard questions. The bar shows accuracy on medium and hard questions.</p>
 ${['math','rw'].map(sec=>`<h4>${SECN[sec]}</h4>${Object.keys(DOMS).filter(d=>DOMS[d].sec===sec).map(d=>`<div class="small muted dom">${DOMS[d].t}</div><div class="strands">${Object.keys(SK).filter(id=>SK[id].dom===d).map(id=>{const a=skAcc(id,2);const m=mastered(id);return `<div class="strand"><span>${esc(SK[id].t)}${m?' ✓':''}${skOpen(id)?'':' 🔒'}</span><div class="bar thin ${m?'teal':''}"><div style="width:${a.n?pct(a.r,a.n):0}%"></div></div><span class="strandn">${a.n?pct(a.r,a.n)+'%':'—'}</span></div>`}).join('')}</div>`).join('')}`).join('')}</div>
 <div class="card"><h3>Official scores</h3><p class="muted small">Log every PSAT, SAT, and Bluebook practice test. These are the scores that matter.</p>
 ${rows.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>Test</th><th>R&amp;W</th><th>Math</th><th>Total</th><th></th></tr></thead><tbody>${rows.map(o=>`<tr><td>${shortDate(o.date)}</td><td>${OFF[o.type].t}${o.note?`<div class="small muted">${esc(o.note)}</div>`:''}</td><td>${o.rw}</td><td>${o.math}</td><td><b>${o.rw+o.math}</b>${selIndex(o)!=null?`<div class="small muted">Selection Index ${selIndex(o)}</div>`:''}</td><td><button class="btn small ghost" data-deloff="${o.id}" aria-label="Delete">✕</button></td></tr>`).join('')}</tbody></table></div>`:''}
 <div class="offform"><label>Test<select id="of_type">${Object.entries(OFF).map(([k,o])=>`<option value="${k}">${o.t}</option>`).join('')}</select></label><label>Date<input id="of_date" type="date" value="${today()}"></label>
 <label>Reading and Writing<input id="of_rw" type="number" step="10" inputmode="numeric"></label><label>Math<input id="of_math" type="number" step="10" inputmode="numeric"></label><label class="wide">Note (optional)<input id="of_note" maxlength="60"></label>
 <button class="btn primary" id="of_add">Add score</button></div><p class="err" id="of_err" role="alert"></p></div>
 ${settingsCard()}</div>`}
function settingsCard(){const rescues=rescueKeys();let undo=false;try{undo=!!localStorage.getItem(KEY+'-before-restore')}catch(e){}
 return `<div class="card settings"><h3>Settings</h3><div class="setgrid">
 <label>First name<input id="st_name" maxlength="30" value="${esc(S.name)}"></label>
 <label>Grade<select id="st_grade">${GRADES.map(g=>`<option value="${g}" ${S.grade===g?'selected':''}>${gradeName(g)}</option>`).join('')}</select></label>
 <label>Math class<select id="st_course">${COURSES.map((c,i)=>`<option value="${i}" ${S.course===i?'selected':''}>${c}</option>`).join('')}</select></label>
 <label>Target score<input id="st_target" type="number" min="800" max="1600" step="10" value="${S.target}"></label>
 <label>Next official test date<input id="st_date" type="date" value="${esc(S.testDate)}"></label>
 <label>Theme<select id="st_theme">${[['auto','Match device'],['light','Light'],['dark','Dark']].map(([k,l])=>`<option value="${k}" ${S.theme===k?'selected':''}>${l}</option>`).join('')}</select></label>
 <label class="wide">Desmos API key (optional)<input id="st_calc" value="${esc(S.calcKey)}" autocomplete="off" spellcheck="false"><span class="hint">Puts the Desmos graphing calculator inside practice tests, as in Bluebook. Request a key at desmos.com/my-api. Without one, the calculator opens in a new tab.</span></label>
 <label class="wide check"><input type="checkbox" id="st_open" ${S.openAll?'checked':''}> Open every skill now (for a parent: skips the course and mastery locks)</label></div>
 <p class="err" id="st_err" role="alert"></p><button class="btn primary" id="st_save">Save settings</button>
 <h4>Backup</h4><p class="small muted">Progress is stored only in this browser. Download a backup file now and then, and use it to move to another device.${S.lastBackup?` Last backup: ${shortDate(S.lastBackup)}.`:''}</p>
 <div class="actions"><button class="btn" id="bk_dl">Download backup file</button><label class="btn filebtn">Restore from file<input type="file" id="bk_file" accept=".json,application/json" hidden></label></div>
 ${undo?`<p class="small">The progress from before the last restore (or erase) is kept. <button class="linkbtn" id="bk_undo">Go back to it</button></p>`:''}
 ${rescues.length?`<p class="small">${rescues.length===1?'A save that could not be read was':`${rescues.length} saves that could not be read were`} kept aside. ${rescues.map((k,i)=>`<button class="linkbtn" data-rescue="${esc(k)}">Download${rescues.length>1?' '+(i+1):''}</button>`).join(' ')} and send ${rescues.length===1?'it':'them'} to whoever set up this app.</p>`:''}
 <h4>Start over</h4><p class="small muted">Erases all progress on this device.</p><button class="btn danger" id="st_reset">Erase all progress</button></div>`}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function restore(text){let o;try{o=JSON.parse(text)}catch(e){alert('That file is not a readable backup.');return}
 if(!plainObj(o)||o.v!==1||o.app!=='sat'){alert(o&&o.topics?'That looks like an ISEE Launchpad backup, not an SAT Launchpad backup.':'That is not an SAT Launchpad backup file.');return}
 const days=plainObj(o.days)?Object.keys(o.days).filter(isDate).sort():[];const nt=Array.isArray(o.tests)?o.tests.length:0,nw=plainObj(o.vocab)?Object.keys(o.vocab).length:0;
 const who=typeof o.name==='string'&&o.name?` for ${o.name.slice(0,30)}`:'';
 if(!confirm(`Replace the progress on this device with the backup${who}?\n\nThe backup has ${days.length} study days${days.length?` (last on ${days[days.length-1]})`:''}, ${nt} practice tests, and ${nw} words started.\n\nThe current progress is kept, so the restore can be undone from Settings.`))return;
 const prev=S;let prevRaw=null;try{prevRaw=localStorage.getItem(KEY);if(prevRaw)localStorage.setItem(KEY+'-before-restore',prevRaw)}catch(e){}
 // Stored questions (an open session or test, the last test review) are not restored: only progress is.
 o.cur=null;o.tst=null;o.lastReview=null;if(o.view==='result')o.view='home';
 try{S=norm(o);draw()}catch(e){S=prev;alert('That backup could not be used. Nothing was changed.');render();return}
 save();render();toast('Backup restored.')}
function undoRestore(){let raw=null;try{raw=localStorage.getItem(KEY+'-before-restore')}catch(e){}if(!raw)return;let o;try{o=JSON.parse(raw)}catch(e){return}
 if(!confirm('Go back to the progress from before the last restore?'))return;try{S=norm(o);draw()}catch(e){alert('The earlier progress could not be used.');return}
 try{localStorage.removeItem(KEY+'-before-restore')}catch(e){}save();render();toast('Restore undone.')}
function eraseAll(){const t=prompt('This erases all progress on this device. Type ERASE to confirm.');if(t!=='ERASE')return;try{const raw=localStorage.getItem(KEY);if(raw)localStorage.setItem(KEY+'-before-restore',raw);localStorage.removeItem(KEY)}catch(e){}S=norm(fresh());save();render()}
function wireProgress(){const g=id=>$(id).value.trim();
 $('#of_add').onclick=()=>{const type=g('#of_type'),date=g('#of_date'),rw=+g('#of_rw'),math=+g('#of_math');const o=OFF[type];const err=$('#of_err');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){err.textContent='Enter the test date.';return}if(date>today()){err.textContent='That date is in the future. Enter the date the test was taken.';return}
  for(const [v,l] of [[rw,'Reading and Writing'],[math,'Math']])if(!(v>=o.lo&&v<=o.hi&&v%10===0)){err.textContent=`${l} on the ${o.t} is between ${o.lo} and ${o.hi}, in steps of 10.`;return}
  S.official.push({id:newSid(),type,date,rw,math,note:g('#of_note').slice(0,60)});save();render()};
 $$('[data-deloff]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this score?'))return;S.official=S.official.filter(o=>o.id!==b.dataset.deloff);save();render()});
 $('#st_save').onclick=()=>{const t=+g('#st_target');if(!(t>=800&&t<=1600)){$('#st_err').textContent='Choose a target between 800 and 1600.';return}
  S.name=g('#st_name').slice(0,30);const ng=+g('#st_grade');if(ng!==S.grade||+g('#st_course')!==S.course)S.gradeSet=today();S.grade=ng;const nc=+g('#st_course');
  // A move to the next math course means earlier courses' skills have been taught.
  if(nc>S.course)for(const id in S.later)if(SK[id]&&SK[id].course<nc)delete S.later[id];S.course=nc;S.target=Math.round(t/10)*10;S.testDate=g('#st_date');S.theme=g('#st_theme');
  const key=g('#st_calc');if(key!==S.calcKey){S.calcKey=key;calc=null;const p=$('#calc');if(p)p.remove()}S.openAll=$('#st_open').checked;const ok=save();render();if(ok)toast('Settings saved.')};
 $('#bk_dl').onclick=()=>{S.lastBackup=today();save();download(`sat-launchpad-backup-${today()}.json`,JSON.stringify(S));render()};
 $('#bk_file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(String(r.result));r.readAsText(f)};
 $('#st_reset').onclick=eraseAll;if($('#bk_undo'))$('#bk_undo').onclick=undoRestore;
 $$('[data-rescue]').forEach(b=>b.onclick=()=>{try{download('sat-launchpad-unreadable-save.json',localStorage.getItem(b.dataset.rescue)||'')}catch(e){}})}

// ---- shared wiring ----
function wireCommon(){$$('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;save();render();scrollTo(0,0)});
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on('#yr_ok',()=>{S.gradeSet=today();save();render()});on('#td_clear',()=>{S.testDate='';save();render()});
 on('#hwords',startWordsToday);on('#hbackup',()=>{S.lastBackup=today();save();download(`sat-launchpad-backup-${today()}.json`,JSON.stringify(S));render()});
 $$('[data-daily]').forEach(b=>b.onclick=()=>startDaily(b.dataset.daily));$$('[data-focus]').forEach(b=>b.onclick=()=>startFocus(b.dataset.focus));
 $$('[data-resume]').forEach(b=>b.onclick=()=>{resumeSkill(b.dataset.resume);save();render();toast(`${SK[b.dataset.resume].t} is back in practice.`)});
 $$('[data-repause]').forEach(b=>b.onclick=()=>{const x=S.later[b.dataset.repause];pauseSkill(b.dataset.repause,x?x.d:1);save();render()});
 on('#tresumebtn',resumeTest);on('#tdiscard',()=>{if(confirm('Discard the unfinished test?')){S.tst=null;save();render()}});
 $$('[data-test]').forEach(b=>b.onclick=()=>startTest(b.dataset.test));$$('[data-drill]').forEach(b=>b.onclick=()=>startDrill(b.dataset.drill));
 $$('[data-pdiff]').forEach(b=>b.onclick=()=>{S.pdiff=+b.dataset.pdiff;save();render()});
 $$('[data-skill]').forEach(b=>b.onclick=()=>startSkill(b.dataset.skill,S.pdiff||0,false));$$('[data-lesson]').forEach(b=>b.onclick=()=>startSkill(b.dataset.lesson,S.pdiff||0,true))}

// ---- start ----
// A test left open mid-module (the app was closed) resumes where it stopped, marked as paused.
if(S.tst&&S.tst.active&&S.tst.phase==='module')S.tst.paused=true;
if(S.view==='result'&&!S.lastReview||S.view==='practice')S.view='home';
render();

</script>
<script>
// Offline install: only when served from a web address (not when opened as a local file).
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
