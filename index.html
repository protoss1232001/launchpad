<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAT Launchpad</title>
<meta name="description" content="A multi-year study plan and practice app for the digital SAT.">
<meta name="theme-color" content="#3151D3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAT Launchpad">
<style>
:root{--paper:#F3F5FA;--card:#FFFFFF;--ink:#18223A;--muted:#5B6479;--line:#D8DEEA;--accent:#3151D3;--accent-ink:#fff;--teal:#0F7F85;--good:#177A4C;--goodbg:#E2F4EA;--warn:#8A5E00;--warnbg:#FFF3D6;--bad:#C93C35;--badbg:#FBE4E2;--figfill:#E6ECF8;--grid:#DCE3EE;--bar1:#3D6BE0;--bar2:#E0901A;--hl:#FFE58A;--shadow:0 1px 2px rgba(24,34,58,.06),0 6px 18px rgba(24,34,58,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#11172A;--card:#1A2236;--ink:#ECF0F7;--muted:#A3ACBF;--line:#2B3550;--accent:#7D95FF;--accent-ink:#0E1633;--teal:#3CC3C8;--good:#4CC98A;--goodbg:#173626;--warn:#E0AE49;--warnbg:#3A2E10;--bad:#FF7A70;--badbg:#3D1E1C;--figfill:#243050;--grid:#2C3753;--bar1:#7D9BFF;--bar2:#F3B24A;--hl:#6B5A12;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--paper:#11172A;--card:#1A2236;--ink:#ECF0F7;--muted:#A3ACBF;--line:#2B3550;--accent:#7D95FF;--accent-ink:#0E1633;--teal:#3CC3C8;--good:#4CC98A;--goodbg:#173626;--warn:#E0AE49;--warnbg:#3A2E10;--bad:#FF7A70;--badbg:#3D1E1C;--figfill:#243050;--grid:#2C3753;--bar1:#7D9BFF;--bar2:#F3B24A;--hl:#6B5A12;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{margin:0 0 .4em;letter-spacing:-.02em;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800}h2{font-size:1.45rem;font-weight:800}h3{font-size:1.1rem;font-weight:700}h4{font-size:1rem;font-weight:700;margin-top:1.1em}
p{margin:.5em 0}a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,label:focus-within.filebtn{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5em .7em;max-width:100%}
.wrap{max-width:1000px;margin:0 auto;padding:16px clamp(16px,3vw,28px) 60px}.wrap.narrow{max-width:780px}
.muted{color:var(--muted)}.small{font-size:.875rem}.center{text-align:center}.bad{color:var(--bad)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding:12px clamp(16px,3vw,28px);background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:1.2rem;flex:none}
.brandname{font-weight:800;letter-spacing:-.02em}.brandsub{font-size:.75rem;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:12px;max-width:100%;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;flex:none;border:0;background:transparent;padding:.45em .9em;border-radius:9px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}.tab:hover{color:var(--ink)}
/* cards and layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;min-width:0}
.card.accent{border-color:var(--accent)}.card.note{background:var(--warnbg);border-color:transparent}.card.note.blocking{border:2px solid var(--warn)}.filebtn{cursor:pointer}.card.dim{opacity:.75}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}.cardhead h3{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin:14px 0}.grid2 .card{margin:0}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center;padding:22px 0 6px}.hero .lead{font-size:1.08rem;color:var(--muted)}
.stats,.stats4{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats4{grid-template-columns:repeat(4,1fr);margin:12px 0}.stats3{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px 0}.stats3 .stat{min-width:120px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:80px}
.statn{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.statl{font-size:.75rem;color:var(--muted)}
.hugescore{font-size:3rem;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}.big{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.setup label,.setgrid label,.offform label{display:flex;flex-direction:column;gap:4px;font-weight:600;margin:12px 0}
.setup input,.setup select{width:100%}.hint{font-weight:400;font-size:.8rem;color:var(--muted)}.err{color:var(--bad);font-weight:600;min-height:1em;margin:6px 0}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:0 16px}.setgrid label{margin:8px 0}.setgrid .wide,.offform .wide{grid-column:1/-1}
.setgrid label.check{flex-direction:row;align-items:center;gap:10px;font-weight:500}.setgrid label.check input{width:20px;height:20px;accent-color:var(--accent)}
.offform{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:0 12px;align-items:end;margin-top:10px}.offform label{margin:6px 0}.offform .btn{margin:6px 0}
/* buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.55em 1.1em;font-weight:600;transition:transform .08s,background .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--paper)}.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ghost{background:transparent}.btn.small{padding:.35em .8em;font-size:.875rem}.btn.big{padding:.75em 1.5em;font-size:1.05rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn[disabled]{opacity:.45;cursor:default}
.linkbtn{border:0;background:none;padding:0;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}.actions.center{justify-content:center}
.pill{display:inline-block;padding:.15em .6em;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--goodbg);color:var(--good);border-color:transparent}.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.pill.teal{background:var(--teal);color:var(--card);border-color:transparent}
.badge{background:var(--warnbg);color:var(--warn);font-weight:800;font-size:.8rem;padding:.2em .7em;border-radius:999px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.chips.small{font-size:.85rem;margin:0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.3em .9em;font-weight:600}.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.chip span{opacity:.7;font-weight:500}
/* bars */
.bar{position:relative;height:12px;background:var(--paper);border:1px solid var(--line);border-radius:999px;margin:10px 0 4px;overflow:hidden}.bar>div{height:100%;background:var(--accent);border-radius:999px}
.bar.thin{height:8px;margin:4px 0}.bar.teal>div{background:var(--teal)}
.strands{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:6px 24px}
.strand{display:grid;grid-template-columns:1fr 110px 48px;align-items:center;gap:10px;font-size:.9rem}.strand.wide{grid-template-columns:1fr auto;grid-column:1/-1}.strand.wide .strandn{grid-column:2}
.strandn{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}.dom{margin:10px 0 2px;font-weight:700}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin:8px 0;max-width:420px}.heat span{aspect-ratio:1;border-radius:4px;background:var(--paper);border:1px solid var(--line)}.heat span.hit{background:var(--good);border-color:var(--good)}
.tblwrap{overflow-x:auto;margin:10px 0}.tbl{border-collapse:collapse;width:100%;font-size:.92rem}.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}.tbl th{background:var(--paper);font-weight:700}.tbl td{font-variant-numeric:tabular-nums}
.tip{background:var(--warnbg);border-left:4px solid var(--warn);padding:10px 14px;border-radius:8px;margin:14px 0}.tip b{color:var(--warn);margin-right:6px}
.tip.desmos{background:var(--figfill);border-left-color:var(--teal)}.tip.desmos b{color:var(--teal)}
.ex{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0}.exq{font-weight:700}.exa{margin-top:4px}
/* today and roadmap */
.todayh{margin-top:18px;margin-bottom:2px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px;margin:12px 0}.grid3 .card{margin:0}
.sess{display:flex;flex-direction:column;align-items:flex-start}.sess .btn{margin-top:auto}.sess.done{border-color:var(--good)}.sess.done h3{color:var(--good)}
.pbar{margin:8px 0}.pbar .bar{margin-top:4px}
.sml{display:none}
.ntbtn{color:var(--muted)}
.today{border-color:var(--accent);border-width:2px}.plan{margin:8px 0 16px;padding-left:1.3em}.plan li{margin:3px 0}
.phase.current{border-color:var(--teal);border-width:2px}
.miles{list-style:none;padding:0;margin:0}.miles li{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:10px 8px;border-top:1px solid var(--line)}.miles li:first-child{border:0}
.mg{font-weight:700;font-size:.85rem;color:var(--muted)}.miles li.past{opacity:.6}.miles li.now .mg{color:var(--teal)}.miles li.now{background:linear-gradient(90deg,var(--figfill),transparent);border-radius:8px}
/* practice list */
.skrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.skrow.locked b{color:var(--muted)}.skbtns{display:flex;gap:6px}
/* words */
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.wcard{border:1px solid var(--line);border-left:5px solid var(--line);background:var(--card);border-radius:10px;padding:12px;text-align:left;min-height:80px;display:block;width:100%}
.wcard.lv1,.wcard.lv2{border-left-color:var(--warn)}.wcard.lv3,.wcard.lv4{border-left-color:var(--good)}
.wfront{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.wfront b{font-size:1.05rem}.wfront i{color:var(--muted);font-size:.8rem}
.wback{display:none;flex-direction:column;gap:4px}.wback em{color:var(--teal);font-size:.85rem}.wcard.flipped .wfront{display:none}.wcard.flipped .wback{display:flex}
/* session */
.sesshead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0}
.dots{display:flex;gap:6px;margin-top:6px}.dots span{width:28px;height:6px;border-radius:3px;background:var(--line)}.dots span.done{background:var(--good)}.dots span.now{background:var(--accent)}
.lesson p,.lesson li{max-width:70ch}.lesson ul{padding-left:1.3em}.lesson li{margin:4px 0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.qhead .pill{white-space:normal;text-align:right;max-width:100%}
.passage{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:14px 18px;margin:6px 0 14px;line-height:1.65}
.passage .ptx{max-width:68ch}.t2+.t2{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}.tlab{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.noteh{margin-bottom:4px}.notes{margin:6px 0 0;padding-left:1.2em}.notes li{margin:3px 0}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);color:transparent;line-height:1;user-select:none}
.stem{font-size:1.05rem;font-weight:600;margin:10px 0 14px;line-height:1.55}.ctx{font-weight:400;background:var(--paper);border-radius:8px;padding:10px 14px;margin-bottom:10px}
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-size:1rem;width:100%;transition:border-color .15s,background .15s}
.choice:hover:not([disabled]){border-color:var(--accent)}.choice[disabled]{cursor:default}
.let{flex:none;width:30px;height:30px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.ct{min-width:0;overflow-wrap:anywhere}
.choice.right{border-color:var(--good);background:var(--goodbg)}.choice.right .let{background:var(--good);color:var(--card);border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:var(--badbg)}.choice.wrong .let{background:var(--bad);color:var(--card);border-color:var(--bad)}
.choice.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.choice.sel .let{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;border-left:5px solid var(--good);background:var(--goodbg)}.fb.no{border-left-color:var(--bad);background:var(--badbg)}.exp{margin-top:6px}
.why{margin-top:12px}.why .chip{font-size:.82rem;padding:.25em .75em}
.sprwrap{display:flex;flex-direction:column;gap:6px;max-width:320px}.sprin{font-size:1.25rem;font-variant-numeric:tabular-nums;width:9em}.sprprev{font-size:.9rem;color:var(--muted);min-height:1.6em}.prevv{color:var(--ink);font-size:1.15rem}
/* fractions and figures */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 .15em;font-size:.9em}.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}.fr>span:last-child{padding:0 .2em}
.fig{max-width:100%;height:auto;display:block;margin:8px auto}.figwrap{margin:12px auto;max-width:380px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px}
.passage .fig,.passage .tblwrap{margin:12px 0 0}.passage .tbl th,.passage .tbl td{background:var(--card)}
.figtitle{text-align:center;font-weight:700;font-size:.9rem}.ft{font-size:13px;fill:var(--ink)}.ft.small{font-size:11px}.ft.tiny{font-size:10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;color:var(--muted)}.lg{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle}.lg.dot{border-radius:50%;background:var(--bar1)}.lg.dia{background:var(--bar2);transform:rotate(45deg)}
.trend{margin-top:6px}
/* modal and toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:start center;padding:30px 12px;overflow:auto;z-index:30}
.modalbox{background:var(--card);border-radius:14px;padding:18px 20px;max-width:680px;width:100%;box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}.modalhead h3{margin:0}
.refgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}.refgrid>div{background:var(--paper);border-radius:8px;padding:8px 12px;line-height:1.8}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---- test player ---- */
body.testing{background:var(--card)}
.tp{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.tphead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 16px;border-bottom:2px dashed var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.tpl{display:flex;flex-direction:column;min-width:0}.tpl b{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlink{border:0;background:none;padding:6px 0;min-height:32px;color:var(--accent);font-weight:600;font-size:.85rem;text-align:left}
.tpc{display:flex;flex-direction:column;align-items:center}.clock{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:4.2em;text-align:center}
.clock.hid{visibility:hidden}.clock.warn{color:var(--bad)}
.tpr{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:.35em .7em;font-weight:600;font-size:.85rem}.tool.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.tool.small{padding:.2em .6em}
.tpbody{flex:1;display:grid;min-height:0}
.tpbody.split{grid-template-columns:1fr 1fr}.tpbody.single{grid-template-columns:minmax(0,760px);justify-content:center}
.tpane{padding:20px clamp(16px,3vw,32px);min-width:0;overflow-wrap:anywhere}.tleft{border-right:4px solid var(--line)}
.tpas{background:none;border:0;padding:0;margin:0;font-size:1.02rem;max-width:66ch}
.tpas.hlon{cursor:text}.tpas.hlon .hw{cursor:pointer;border-radius:3px}.tpas.hlon .hw:hover{background:var(--figfill)}.hw.hl,.tpas.hlon .hw.hl:hover{background:var(--hl)}
.qbar{display:flex;align-items:center;gap:10px;background:var(--paper);border-bottom:2px dashed var(--line);padding:4px 8px 4px 0;margin-bottom:12px}
.qnum{background:var(--ink);color:var(--paper);font-weight:800;padding:.3em .8em;border-radius:4px 0 0 4px}
.markbtn{border:0;background:none;font-weight:600;font-size:.9rem;padding:.3em .4em}.markbtn.on{color:var(--accent)}
.qbar .tool{margin-left:auto}
.crow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.crow.struck .choice{opacity:.55}.crow.struck .ct{text-decoration:line-through}
.elimx{border:1px solid var(--line);background:var(--card);border-radius:19px;min-width:38px;height:38px;padding:0 8px;font-weight:700;font-size:.8rem}
.tp .stem{font-weight:500}
.intro{display:grid;gap:10px;margin:12px 0}.iw{background:var(--paper);border-radius:10px;padding:10px 14px}.iw b{font-size:1.1rem}.isent{color:var(--teal);font-size:.92rem;margin-top:2px}
.sprdir{background:var(--paper);border-radius:10px;padding:10px 14px}.sprdir summary{cursor:pointer;font-weight:600}
.pauselist{list-style:none;padding:0;margin:8px 0 0}.pauselist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(0,0,0,.08);flex-wrap:wrap}
.tpfoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 16px;border-top:2px dashed var(--line);background:var(--card);position:sticky;bottom:0;z-index:5}
.tpname{font-weight:600;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn{background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:.5em 1em;font-weight:700;white-space:nowrap}
.tpbtns{display:flex;gap:8px;justify-content:flex-end}
.tpbody.review{grid-template-columns:minmax(0,760px);justify-content:center}.revbox{padding:24px 16px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin:12px 0}

.navkey{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted)}.navkey i.nq{width:18px;height:18px;vertical-align:middle;margin-right:6px}
.bigclock{font-size:3.4rem;font-weight:900;font-variant-numeric:tabular-nums;margin:10px 0}
/* Desmos panel: beside the question on a wide screen, a bottom sheet on a phone */
.calc{position:fixed;z-index:25;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;top:64px;bottom:64px;left:8px;width:min(440px,46vw);border-radius:12px}
.calc.wide{width:min(760px,70vw)}.calc[hidden]{display:none}
.calchead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}.calchead span{display:flex;gap:6px}
#calcbody{flex:1;min-height:0}.calcmsg{padding:16px}
@media (min-width:901px){body.calcopen .tpbody{margin-left:min(456px,48vw)}body.calcopen.calcwide .tpbody{margin-left:min(776px,72vw)}}

.revh{margin-top:18px}
.revq{border:1px solid var(--line);border-left:4px solid var(--good);border-radius:8px;margin:6px 0}.revq.no{border-left-color:var(--bad)}
.revq summary{display:grid;grid-template-columns:32px 1fr auto auto;gap:6px 10px;align-items:center;padding:8px 10px;cursor:pointer;list-style:none}.revq summary::-webkit-details-marker{display:none}
.rn{font-weight:800}.rs{font-size:.9rem;min-width:0}.rt{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}.rk{grid-column:2/-1;font-size:.85rem;color:var(--muted)}
.revbody{padding:4px 14px 14px}
@media (max-width:900px){
 .tpbody.split{grid-template-columns:1fr}.tleft{border-right:0;border-bottom:4px solid var(--line)}

 /* On a phone the test footer stays on screen, and the calculator sheet sits just above it. */

}

}

<body>
<div id="app"></div>
<noscript><p style="padding:20px;font-family:sans-serif">SAT Launchpad needs JavaScript turned on. Open it in Chrome, Safari, Edge, or Firefox.</p></noscript>
<script>
// ===== CORE HELPERS =====
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const lcm=(a,b)=>Math.abs(a*b)/gcd(a,b);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const fmt=n=>Number(n).toLocaleString('en-US');
const nz=n=>Object.is(n,-0)?0:n;
// A real minus sign, as printed on the test.
const mn=n=>{n=nz(n);return n<0?'−'+fmt(-n):fmt(n)};
const money=n=>'$'+Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const round=(x,p=2)=>Math.round(x*Math.pow(10,p))/Math.pow(10,p);
const V=x=>`<i>${x}</i>`;
// "+ 5" or "− 5" after a term, and a negative number in parentheses when subtracted or multiplied.
const plus=n=>n===0?'':n<0?` − ${mn(-n)}`:` + ${mn(n)}`;
const par=n=>n<0?`(${mn(n)})`:mn(n);                     // a variable
const sup=(b,e)=>`${b}<sup>${e}</sup>`;
// ---- fractions ----
const simp=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d);return [n/g,d/g]};
const frac=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
// A simplified fraction, sign in front, whole numbers printed plainly.
const fv=(n,d=1)=>{[n,d]=simp(n,d);if(d===1)return mn(n);return (n<0?'−':'')+frac(Math.abs(n),d)};
// The same value as a student would type it on the test.
const ftyped=(n,d=1)=>{[n,d]=simp(n,d);return d===1?String(n):`${n}/${d}`};
// ---- expressions ----
// Build "3x − 5" style expressions from [coefficient, variable-html] terms, skipping zeros.
function expr(terms){let s='';terms.forEach(([c,v])=>{if(typeof c==='number'&&c===0)return;const neg=typeof c==='number'?c<0:String(c).startsWith('−');
  let a=typeof c==='number'?Math.abs(c):String(c).replace(/^−/,'');if(v&&a===1)a='';
  if(!s)s=(neg?'−':'')+a+(v||'');else s+=(neg?' − ':' + ')+a+(v||'')});return s||'0'}
const X=V('x'),Y=V('y');
const X2=`${V('x')}<sup>2</sup>`;
// ---- choices ----
const stripTags=s=>String(s).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
// The value a choice represents, so look-alikes are never offered together.
function valKey(s){s=String(s);
  let m=s.match(/^\s*(−|-)?<span class="fr"><span>(\d+)<\/span><span>(\d+)<\/span><\/span>\s*$/);
  if(m)return 'n:'+((m[1]?-1:1)*(+m[2])/(+m[3])).toFixed(6);
  const t=stripTags(s).replace(/−/g,'-');
  m=t.match(/^\$?\s*(-?[\d,]+(?:\.\d+)?)\s*(%|°|[a-zA-Z²³]*\.?)?$/);
  if(m){const v=parseFloat(m[1].replace(/,/g,''));if(!isNaN(v))return 'n:'+v.toFixed(6)+':'+String(m[2]||'').toLowerCase()}
  return 't:'+t.toLowerCase()}
// Multiple choice. Duplicates or look-alikes of the answer are dropped; too few left -> null, and the caller retries.
function mc(q,ans,wrongs,exp,o){o=o||{};const A=String(ans);const key=o.form?(x=>stripTags(x).toLowerCase()):valKey;
  const seen=new Set([key(A)]),W=[];for(const w of wrongs){const t=String(w);const k=key(t);if(seen.has(k))continue;seen.add(k);W.push(t);if(W.length===3)break}
  if(W.length<3)return null;const ch=o.keepOrder?[A,...W]:shuf([A,...W]);
  if(o.order)ch.sort((x,y)=>o.order.indexOf(x)-o.order.indexOf(y));
  else if(!o.keepOrder&&!o.form&&ch.every(x=>/^n:/.test(valKey(x))))ch.sort((x,y)=>parseFloat(valKey(x).slice(2))-parseFloat(valKey(y).slice(2)));
  const out={type:'mc',q,ch,a:ch.indexOf(A),exp};for(const k of ['chk','fig','pas','kind','word'])if(o[k])out[k]=o[k];return out}
// Student-produced response: the value is checked by the official entry rules.
// How a typed answer's key is displayed: a whole number, or a fraction and (when it ends) its decimal.
// The correct typed answers to show: forms that fit the box (5 characters, 6 with a minus sign).
function showVal(v){if(Number.isInteger(v))return String(v);const neg=v<0,max=neg?6:5,fits=s=>s.length<=max,forms=[];
  for(let d=2;d<=200;d++){const n=Math.round(v*d);if(Math.abs(n/d-v)<1e-9){const f=ftyped(n,d);if(fits(f))forms.push(f);break}}
  const ab=Math.abs(v);let dec=String(round(ab,10)).replace(/^0\./,'.');if(Math.abs(round(ab,10)-ab)<1e-12&&fits((neg?'-':'')+dec))forms.push((neg?'-':'')+dec);
  else{const ip=Math.trunc(ab);const lead=ip?String(ip):'';const dg=max-(neg?1:0)-lead.length-1;if(dg>0){const u=Math.pow(10,dg);
    const t=Math.trunc(ab*u+1e-7)/u,r=Math.round(ab*u)/u;for(const x of [t,r]){const s=(neg?'-':'')+lead+'.'+String(Math.round((x-ip)*u)).padStart(dg,'0');if(!forms.includes(s))forms.push(s)}}}
  return forms.length?forms.join(' or '):String(round(v,4))}
function spr(q,value,exp,o){o=o||{};const out={type:'spr',q,v:value,show:o.show||showVal(value),exp};for(const k of ['chk','fig','pas'])if(o[k])out[k]=o[k];return out}
// Official rules: up to 5 characters (6 with a minus sign); fractions or decimals;
// no mixed numbers; a decimal too long to fit may be rounded or truncated, but must fill the space.
function sprParse(raw){const s=String(raw||'').trim().replace(/−/g,'-');if(!s)return {ok:false,why:''};
  const neg=s.startsWith('-'),body=neg?s.slice(1):s,max=neg?6:5;
  if(s.length>max)return {ok:false,why:`Too long: ${max} characters at most${neg?' including the minus sign':''}.`};
  if(/^\d+\s+\d+\/\d+$/.test(body))return {ok:false,why:'Mixed numbers are not allowed. Enter 7/2 or 3.5, not 3 1/2.'};
  let m=body.match(/^(\d+)\/(\d+)$/);if(m){if(+m[2]===0)return {ok:false,why:'Cannot divide by zero.'};return {ok:true,v:(neg?-1:1)*(+m[1])/(+m[2]),dec:null,full:s.length===max}}
  m=body.match(/^(\d*)\.?(\d*)$/);if(m&&body!=='.'&&/\d/.test(body)){const dec=body.includes('.')?(body.split('.')[1]||'').length:0;return {ok:true,v:(neg?-1:1)*parseFloat(body.startsWith('.')?'0'+body:body),dec,full:s.length===max}}
  return {ok:false,why:'Use digits, one decimal point or one fraction bar, and an optional minus sign.'}}
function sprCorrect(raw,v){const p=sprParse(raw);if(!p.ok)return false;if(Math.abs(p.v-v)<1e-9)return true;
  // A decimal that fills the box, rounded or truncated at its last digit.
  if(p.dec&&p.full){const u=Math.pow(10,-p.dec);const x=v/u,k=Math.round(p.v/u);return k===Math.trunc(x+(x>=0?1e-7:-1e-7))||k===Math.round(x)}
  return false}
// ---- figures ----
const SVG=(w,h,inner,alt)=>`<svg class="fig" viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="${esc(alt||'figure')}">${inner}</svg>`;
// A coordinate plane. fns: [{f, dom:[a,b]}], pts: [[x,y]], segs: [[x1,y1,x2,y2]]
function plane(o){const W=o.w||300,H=o.h||300,xmin=o.x[0],xmax=o.x[1],ymin=o.y[0],ymax=o.y[1],sx=o.sx||1,sy=o.sy||1;
  const px=x=>24+(x-xmin)*(W-40)/(xmax-xmin),py=y=>H-24-(y-ymin)*(H-40)/(ymax-ymin);let g='';
  for(let x=Math.ceil(xmin/sx)*sx;x<=xmax;x+=sx)g+=`<line x1="${px(x)}" y1="${py(ymin)}" x2="${px(x)}" y2="${py(ymax)}" stroke="var(--grid)"/>`;
  for(let y=Math.ceil(ymin/sy)*sy;y<=ymax;y+=sy)g+=`<line x1="${px(xmin)}" y1="${py(y)}" x2="${px(xmax)}" y2="${py(y)}" stroke="var(--grid)"/>`;
  if(ymin<=0&&ymax>=0)g+=`<line x1="${px(xmin)}" y1="${py(0)}" x2="${px(xmax)}" y2="${py(0)}" stroke="var(--ink)" stroke-width="1.5"/>`;
  if(xmin<=0&&xmax>=0)g+=`<line x1="${px(0)}" y1="${py(ymin)}" x2="${px(0)}" y2="${py(ymax)}" stroke="var(--ink)" stroke-width="1.5"/>`;
  const lx=o.lx||sx*(o.labelEvery||1),ly=o.ly||sy*(o.labelEvery||1);
  for(let x=Math.ceil(xmin/lx)*lx;x<=xmax;x+=lx)if(x!==0)g+=`<text x="${px(x)}" y="${py(Math.max(ymin,Math.min(0,ymax)))+14}" text-anchor="middle" class="ft tiny">${mn(round(x,3))}</text>`;
  for(let y=Math.ceil(ymin/ly)*ly;y<=ymax;y+=ly)if(y!==0)g+=`<text x="${px(Math.max(xmin,Math.min(0,xmax)))-5}" y="${py(y)+4}" text-anchor="end" class="ft tiny">${mn(round(y,3))}</text>`;
  if(xmin<=0&&xmax>=0&&ymin<=0&&ymax>=0)g+=`<text x="${px(0)-5}" y="${py(0)+14}" text-anchor="end" class="ft tiny">O</text>`;
  g+=`<text x="${px(xmax)-2}" y="${py(Math.max(ymin,Math.min(0,ymax)))-6}" text-anchor="end" class="ft small"><tspan font-style="italic">${o.xl||'x'}</tspan></text><text x="${px(Math.max(xmin,Math.min(0,xmax)))+6}" y="${py(ymax)+12}" class="ft small"><tspan font-style="italic">${o.yl||'y'}</tspan></text>`;
  (o.fns||[]).forEach(fn=>{const a=fn.dom?fn.dom[0]:xmin,b=fn.dom?fn.dom[1]:xmax;let d='',pen=false;
    for(let i=0;i<=240;i++){const x=a+(b-a)*i/240,y=fn.f(x);if(!isFinite(y)||y<ymin-1e-9||y>ymax+1e-9){pen=false;continue}d+=(pen?'L':'M')+px(x).toFixed(1)+','+py(y).toFixed(1);pen=true}
    g+=`<path d="${d}" fill="none" stroke="${fn.color||'var(--bar1)'}" stroke-width="2.5"${fn.dash?' stroke-dasharray="6 5"':''}/>`});
  (o.segs||[]).forEach(s=>g+=`<line x1="${px(s[0])}" y1="${py(s[1])}" x2="${px(s[2])}" y2="${py(s[3])}" stroke="var(--bar1)" stroke-width="2.5"/>`);
  (o.pts||[]).forEach(p=>g+=`<circle cx="${px(p[0])}" cy="${py(p[1])}" r="${o.r||4}" fill="${p[2]||'var(--bar1)'}"/>`);
  return SVG(W,H,g,o.alt||'Graph in the xy-plane')}
function table(head,rows,cls){return `<div class="tblwrap"><table class="tbl ${cls||''}"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function barChart(labels,vals,title,ylab,o){o=o||{};const n=labels.length,W=340,H=220,pad=44,mx=Math.max(...vals);const step=mx>200?50:mx>80?20:mx>40?10:mx>20?5:mx>10?2:1;const top=Math.ceil(mx/step)*step;
  const bw=(W-pad-16)/n,y=v=>H-32-(v*(H-62)/top);let s='';
  for(let v=0;v<=top;v+=step)s+=`<line x1="${pad}" y1="${y(v)}" x2="${W-8}" y2="${y(v)}" stroke="var(--grid)"/><text x="${pad-6}" y="${y(v)+4}" text-anchor="end" class="ft tiny">${v}</text>`;
  labels.forEach((l,i)=>{const x0=pad+i*bw;s+=`<rect x="${x0+bw*0.2}" y="${y(vals[i])}" width="${bw*0.6}" height="${H-32-y(vals[i])}" fill="var(--bar1)" rx="3"/><text x="${x0+bw/2}" y="${H-16}" text-anchor="middle" class="ft tiny">${l}</text>`+(o.values?`<text x="${x0+bw/2}" y="${y(vals[i])-4}" text-anchor="middle" class="ft tiny">${vals[i]}</text>`:'')});
  if(ylab)s+=`<text x="12" y="${(H-32)/2}" transform="rotate(-90 12 ${(H-32)/2})" text-anchor="middle" class="ft tiny">${ylab}</text>`;
  return `<div class="figwrap"><div class="figtitle">${title}</div>${SVG(W,H,`<line x1="${pad}" y1="${H-32}" x2="${W-8}" y2="${H-32}" stroke="var(--ink)"/>${s}`,`Bar graph, ${title}: ${labels.map((l,i)=>l+' '+vals[i]).join(', ')}`)}</div>`}
// Right triangle ABC with the right angle at C. lab = {a, b, c, A, B} text or ''.
function rightTri(lab,alt){const s=`<polygon points="40,170 260,170 260,40" fill="var(--figfill)" stroke="var(--ink)" stroke-width="2"/><polyline points="246,170 246,156 260,156" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
 <text x="28" y="184" class="ft small">A</text><text x="266" y="184" class="ft small">C</text><text x="266" y="38" class="ft small">B</text>
 ${lab.b?`<text x="150" y="190" text-anchor="middle" class="ft">${lab.b}</text>`:''}${lab.a?`<text x="270" y="108" class="ft">${lab.a}</text>`:''}${lab.c?`<text x="140" y="96" text-anchor="end" class="ft">${lab.c}</text>`:''}
 ${lab.A?`<text x="78" y="162" class="ft small">${lab.A}</text>`:''}${lab.B?`<text x="236" y="72" class="ft small">${lab.B}</text>`:''}
 <text x="160" y="206" text-anchor="middle" class="ft tiny">Note: Figure not drawn to scale.</text>`;
 return SVG(310,212,s,alt||'Right triangle ABC with the right angle at C')}
const tip=s=>`<div class="tip"><b>Test tip</b> ${s}</div>`;
const ex=(q,a)=>`<div class="ex"><div class="exq">${q}</div><div class="exa">${a}</div></div>`;
const watch=s=>` <b>Trap:</b> ${s}`;

// ===== SKILL REGISTRY =====
// course: the school math course that teaches it (0 pre-algebra, 1 Algebra 1, 2 Geometry, 3 Algebra 2, 4 Precalculus)
// phase: 1 foundation (8th-9th), 2 advanced (10th), 3 hardest questions (summer before 11th)
const COURSES=['Pre-Algebra / Math 8','Algebra 1','Geometry','Algebra 2','Precalculus'];
const DOMS={alg:{sec:'math',t:'Algebra'},adv:{sec:'math',t:'Advanced Math'},psda:{sec:'math',t:'Problem-Solving and Data Analysis'},geo:{sec:'math',t:'Geometry and Trigonometry'},
 ii:{sec:'rw',t:'Information and Ideas'},cs:{sec:'rw',t:'Craft and Structure'},ei:{sec:'rw',t:'Expression of Ideas'},sec:{sec:'rw',t:'Standard English Conventions'}};
const SK={};
function skill(id,o){SK[id]=Object.assign({id},o)}
const lesson=(intro,steps,traps,desmos,example)=>`<p>${intro}</p><h4>How to do it</h4><ul>${steps.map(s=>`<li>${s}</li>`).join('')}</ul>${example?`<h4>Worked example</h4>${example}`:''}${traps?`<h4>Common traps</h4><ul>${traps.map(s=>`<li>${s}</li>`).join('')}</ul>`:''}${desmos?`<div class="tip desmos"><b>Desmos</b> ${desmos}</div>`:''}`;

// ================= ALGEBRA =================
skill('alg_lin1',{t:'Linear equations in one variable',dom:'alg',course:0,phase:1,
 lesson:lesson('Solve for the variable by undoing operations in reverse order, doing the same thing to both sides.',
  ['Distribute and combine like terms on each side first.','Collect the variable on one side and numbers on the other.','For "no solution" or "infinitely many solutions" questions, simplify both sides: same variable coefficient with different constants means no solution; identical sides mean infinitely many.'],
  ['Dropping a negative sign when distributing: −3(<i>x</i> − 2) is −3<i>x</i> + 6, not −3<i>x</i> − 6.','Answering with <i>x</i> when the question asks for 2<i>x</i> + 1 or another expression.'],
  'Type <i>y</i> = (left side) on one line and <i>y</i> = (right side) on the next. Tap where the two lines cross: the <i>x</i>-coordinate is the solution.',
  ex('For what value of <i>k</i> does 3(<i>x</i> + 2) = <i>kx</i> + 8 have no solution?','Distribute: 3<i>x</i> + 6 = <i>kx</i> + 8. The constants 6 and 8 already differ, so the equation has no solution exactly when the <i>x</i>-terms match: <i>k</i> = 3. (If the constants were equal too, every <i>x</i> would work: infinitely many solutions.)')),
 gen(d){
  if(d===1){const x=R(-9,12),a=pick([2,3,4,5,6,7,-2,-3,-4]),b=R(-15,15);if(!b)return null;const c=a*x+b;const undo=b<0?`Add ${mn(-b)} to`:`Subtract ${mn(b)} from`;
   const q=`If ${expr([[a,X],[b,'']])} = ${mn(c)}, what is the value of ${X}?`;
   return R(0,1)?spr(q,x,`${undo} both sides: ${expr([[a,X]])} = ${mn(c-b)}. Divide by ${mn(a)}: ${X} = <b>${mn(x)}</b>.`,{chk:{t:'lin1',p:{a,b,c},a:x}})
    :mc(q,mn(x),[mn((c+b)/a),mn(c-b),mn(-x),mn(x+1)].filter(s=>!/\./.test(s)),`${undo} both sides: ${expr([[a,X]])} = ${mn(c-b)}. Divide by ${mn(a)}: ${X} = <b>${mn(x)}</b>.${watch(b<0?`subtracting ${mn(-b)} instead of adding it.`:`adding ${mn(b)} instead of subtracting it.`)}`,{chk:{t:'lin1',p:{a,b,c},a:x}})}
  if(d===2){// a(x + b) = cx + e, answer may be a fraction
   const a=pick([2,3,4,5,-2,-3]),b=R(-6,6),c=pick([1,-1,2,-2,3,6,7]);if(a===c||!b)return null;const e=R(-20,20);
   const n=e-a*b,dd=a-c;const q=`${mn(a)}(${expr([[1,X],[b,'']])}) = ${expr([[c,X],[e,'']])}<br>What value of ${X} is the solution to the given equation?`;
   const [sn,sd]=simp(n,dd);
   return spr(q,n/dd,`Distribute: ${expr([[a,X],[a*b,'']])} = ${expr([[c,X],[e,'']])}. Move the ${X}-terms together: ${expr([[a-c,X]])} = ${mn(n)}. So ${X} = ${fv(n,dd)}.`,{chk:{t:'lin1b',p:{a,b,c,e},a:n/dd}})}
  // d3: a parameter that makes the equation have no solution / infinitely many
  const a=pick([2,3,4,5,6]),b=pick([-5,-4,-3,-2,2,3,4,5]),inf=R(0,1)===1;
  if(inf){const k=a*b;const q=`In the equation ${mn(a)}(${expr([[1,X],[b,'']])}) = ${expr([[a,X]])} + ${V('k')}, ${V('k')} is a constant. If the equation has infinitely many solutions, what is the value of ${V('k')}?`;
   return spr(q,k,`Distribute: ${expr([[a,X],[k,'']])} = ${expr([[a,X]])} + ${V('k')}. The two sides are identical for every ${X} only when ${V('k')} = <b>${mn(k)}</b>.`,{chk:{t:'infsol',p:{a,b},a:k}})}
  const m=R(1,9);const q=`In the equation ${expr([[V('k'),X],[m,'']])} = ${expr([[a,X],[m+b,'']])}, ${V('k')} is a constant. If the equation has no solution, what is the value of ${V('k')}?`;
  return spr(q,a,`A linear equation has no solution when the ${X}-terms match but the constants differ. The constants ${m} and ${mn(m+b)} already differ, so the ${X}-coefficients must match: ${V('k')} = <b>${a}</b>.${watch('solving for x instead of finding the constant.')}`,{chk:{t:'nosol',p:{a,m,b},a}})}});

skill('alg_linfn',{t:'Linear functions',dom:'alg',course:1,phase:1,
 lesson:lesson('A linear function has a constant rate of change. In <i>f</i>(<i>x</i>) = <i>mx</i> + <i>b</i>, <i>m</i> is the slope (change in output per 1 unit of input) and <i>b</i> is the starting value, <i>f</i>(0).',
  ['Slope from two points: (<i>y</i>₂ − <i>y</i>₁) ÷ (<i>x</i>₂ − <i>x</i>₁).','In a word problem, the number multiplied by the variable is a rate ("per"); the number standing alone is a fixed or starting amount.','If you know two values of a linear function, find the slope first, then use either point.'],
  ['Subtracting the <i>x</i>-values in one order and the <i>y</i>-values in the other.','Confusing the rate with the starting amount.'],
  'Enter the points in a table, then type y₁ ~ mx₁ + b to fit a line. Desmos reports m and b.'),
 gen(d){

   return mc(q,mn(ans),[mn(m*k-b),mn(m+k+b),mn(-ans),mn(m*(k+b))],`Substitute ${mn(k)} for ${X}: ${mn(m)}(${mn(k)})${plus(b)} = <b>${mn(ans)}</b>.`,{chk:{t:'fval',p:{m,b,k},a:ans}})}
  if(d===2){if(R(0,1)){// slope from two points
    const x1=R(-6,4),dx=pick([1,2,3,4,5]),y1=R(-8,8),dy=pick([-9,-6,-4,-3,2,3,4,6,8,10]);const x2=x1+dx,y2=y1+dy;
    const q=`A line in the ${X}${Y}-plane passes through the points (${mn(x1)}, ${mn(y1)}) and (${mn(x2)}, ${mn(y2)}). What is the slope of the line?`;
    return mc(q,fv(dy,dx),[fv(dx,dy),fv(-dy,dx),fv(y2+y1,x2+x1||1),fv(dy,-dx)===fv(-dy,dx)?fv(y1,x1||1):fv(dy+1,dx)],`Slope = change in ${Y} ÷ change in ${X} = (${mn(y2)} − ${par(y1)}) ÷ (${mn(x2)} − ${par(x1)}) = ${fv(dy,dx)}.${watch('dividing the change in x by the change in y.')}`,{chk:{t:'slope',p:{x1,y1,x2,y2},a:dy/dx}})}
   // interpret a linear model
   const rate=pick([12,15,18,25,35,45]),fee=pick([20,30,40,50,60,75]);const job=pick([['A plumber','hour of work','h','hours of work'],['A bike shop','day of rental','d','days of rental'],['A tutor','session','s','sessions']]);
   const askFee=R(0,1)===1;const num=askFee?fee:rate;
   const q=`${job[0]} charges a total of ${V('C')} dollars for ${V(job[2])} ${job[3]}, where ${V('C')} = ${rate}${V(job[2])} + ${fee}. What is the best interpretation of the number ${num} in this context?`;
   const FIX=`A fixed charge that does not depend on the number of ${job[3]}`,EACH=`The charge for each ${job[1]}`;
   return mc(q,askFee?FIX:EACH,[askFee?EACH:FIX,`The total charge for ${num} ${job[3]}`,`The number of ${job[3]} that ${num} dollars will pay for`],askFee?`${fee} is added once, no matter what ${V(job[2])} is: it is the fixed charge. ${rate} is the rate, in dollars for each ${job[1]}.`:`${rate} is multiplied by ${V(job[2])}, the number of ${job[3]}, so it is the charge for each ${job[1]}. ${fee} is added once: the fixed charge.`,{form:1,chk:{t:'interp',p:{},a:askFee?'fixed':'rate'}})}
  // d3: two values of a linear function -> a third
  const m=pick([2,3,-2,-3,4,-4,5]),b=R(-12,12);const a1=R(-4,2),a2=a1+pick([2,3,4]),c=R(3,9);
  const q=`For the linear function ${V('f')}, ${V('f')}(${mn(a1)}) = ${mn(m*a1+b)} and ${V('f')}(${mn(a2)}) = ${mn(m*a2+b)}. What is the value of ${V('f')}(${mn(c)})?`;
  return spr(q,m*c+b,`Slope: (${mn(m*a2+b)} − ${par(m*a1+b)}) ÷ (${mn(a2)} − ${par(a1)}) = ${mn(m)}. Then ${V('f')}(${X}) = ${expr([[m,X],[b,'']])}, so ${V('f')}(${mn(c)}) = <b>${mn(m*c+b)}</b>.`,{chk:{t:'f3',p:{a1,f1:m*a1+b,a2,f2:m*a2+b,c},a:m*c+b}})}});

skill('alg_lin2',{t:'Linear equations in two variables and their graphs',dom:'alg',course:1,phase:1,
 lesson:lesson('An equation such as 2<i>x</i> + 3<i>y</i> = 12 describes a line. Every point on the line makes the equation true.',
  ['To test a point, substitute both coordinates.','Intercepts: set <i>y</i> = 0 to find the <i>x</i>-intercept, and <i>x</i> = 0 for the <i>y</i>-intercept.','Parallel lines have equal slopes. Perpendicular slopes are negative reciprocals: 2/3 and −3/2.'],
  ['Using the reciprocal without changing the sign (or the reverse) for a perpendicular line.','Reading the slope of <i>ax</i> + <i>by</i> = <i>c</i> as <i>a</i>. It is −<i>a</i>/<i>b</i>.'],
  'Graph the equation directly. Tap an intercept to see its coordinates.'),
 gen(d){
  if(d===1){const m=pick([2,3,-2,-1,4]),b=R(-6,6);const x0=R(-4,4);const good=[x0,m*x0+b];
   const bad=[[x0,m*x0+b+pick([1,2,-1])],[x0+1,m*x0+b],[m*x0+b,x0],[-x0,m*x0+b+1],[x0-1,m*x0+b]].filter(p=>p[1]!==m*p[0]+b);
   const q=`Which point lies on the line ${Y} = ${expr([[m,X],[b,'']])}?`;const P=p=>`(${mn(p[0])}, ${mn(p[1])})`;
   return mc(q,P(good),bad.map(P),`Substitute ${X} = ${mn(x0)}: ${Y} = ${mn(m)}(${mn(x0)})${plus(b)} = ${mn(good[1])}. The point is ${P(good)}.`,{chk:{t:'onLine',p:{m,b},a:good}})}
  if(d===2){const p=pick([1,2,3,4,5]),q0=pick([2,3,4,5,7]);if(gcd(p,q0)!==1)return null;const sg=R(0,1)?1:-1;const c=R(-5,5);
   const q=`Line ${V('k')} is perpendicular to the line ${Y} = ${sg<0?'−':''}${p===q0?'':frac(p,q0)}${X}${c?(c<0?' − ':' + ')+Math.abs(c):''}. What is the slope of line ${V('k')}?`;
   return mc(q,fv(-sg*q0,p),[fv(sg*q0,p),fv(-sg*p,q0),fv(sg*p,q0)],`Perpendicular slopes are negative reciprocals. The given slope is ${fv(sg*p,q0)}, so line ${V('k')} has slope ${fv(-sg*q0,p)}.${watch('taking only the reciprocal, or only the negative.')}`,{chk:{t:'perp',p:{s:sg*p/q0},a:-q0/(sg*p)}})}
  // d3: standard form intercept or graph -> equation
  if(R(0,1)){const a=pick([2,3,4,5,6]),b=pick([2,3,4,5,-3,-2]),x0=pick([2,3,4,6]),c=a*x0;const yint=c/b;
   const q=`The graph of ${expr([[a,X],[b,Y]])} = ${mn(c)} in the ${X}${Y}-plane has an ${X}-intercept at (${V('a')}, 0) and a ${Y}-intercept at (0, ${V('b')}). What is the value of ${V('a')} + ${V('b')}?`;
   return spr(q,x0+yint,`Set ${Y} = 0: ${a}${X} = ${mn(c)}, so ${V('a')} = ${x0}. Set ${X} = 0: ${mn(b)}${Y} = ${mn(c)}, so ${V('b')} = ${fv(c,b)}. Sum: ${fv(x0*b+c,b)}.`,{chk:{t:'intSum',p:{a,b,c},a:x0+yint}})}
  const m=pick([-3,-2,-1,1,2,3]),b=R(-4,4);const fig=plane({x:[-6,6],y:[-6,6],fns:[{f:x=>m*x+b}],alt:'The graph of a line in the xy-plane',labelEvery:2});
  const q=`The graph of a line is shown. Which equation defines the line?${fig}`;
  return mc(q,`${Y} = ${expr([[m,X],[b,'']])}`,[`${Y} = ${expr([[-m,X],[b,'']])}`,`${Y} = ${expr([[m,X],[-b,'']])}`,`${Y} = ${expr([[b||m+1,X],[m,'']])}`,`${Y} = ${expr([[-m,X],[-b,'']])}`],`The line crosses the ${Y}-axis at ${mn(b)}, and each step of 1 to the right changes ${Y} by ${mn(m)}. So ${Y} = ${expr([[m,X],[b,'']])}.`,{form:1,chk:{t:'graphEq',p:{m,b},a:[m,b]}})}});

skill('alg_sys',{t:'Systems of two linear equations',dom:'alg',course:1,phase:1,
 lesson:lesson('A system is solved by the point that makes both equations true: where the two lines cross.',
  ['Substitution: when one equation is already "<i>y</i> = …", replace <i>y</i> in the other.','Elimination: multiply so one variable has opposite coefficients, then add the equations.','Read what is asked. Many questions want <i>x</i> + <i>y</i> or 2<i>x</i> − <i>y</i>, not <i>x</i>.','No solution: parallel lines (same slope, different intercepts). Infinitely many: the same line.','With a constant <i>k</i>: make one equation\'s <i>x</i>- and <i>y</i>-coefficients the same multiple of the other\'s. If the constants are a different multiple, no solution; if the same multiple, infinitely many.'],
  ['Stopping after finding <i>x</i> when the question asks for something else.','For "no solution," making the equations identical, which gives infinitely many solutions instead.'],
  'Graph both equations and tap the intersection. For "no solution" questions, use a slider for the constant.'),
 gen(d){
  if(d===1){const x=R(-5,8),a=R(-6,6),b=pick([2,3,-2,4]),y=x+a;const c=y-b*x;if(b===1)return null;
   const q=`${Y} = ${expr([[1,X],[a,'']])}<br>${Y} = ${expr([[b,X],[c,'']])}<br>What is the solution (${X}, ${Y}) to the given system of equations?`;const P=(u,v)=>`(${mn(u)}, ${mn(v)})`;
   return mc(q,P(x,y),[P(y,x),P(x,y+1),P(-x,-x+a),P(x+1,x+1+a)],`Set the right sides equal: ${expr([[1,X],[a,'']])} = ${expr([[b,X],[c,'']])}, so ${expr([[1-b,X]])} = ${mn(c-a)} and ${X} = ${mn(x)}. Then ${Y} = ${mn(x)}${plus(a)} = ${mn(y)}.`,{chk:{t:'sys1',p:{a,b,c},a:[x,y]}})}
  if(d===2){const x=R(-4,7),y=R(-4,7);const a=pick([2,3,4,5]),b=pick([1,2,3,-1,-2]),c=pick([1,2,3]),e=pick([-1,-2,-3,1,2]);if(a*e-b*c===0)return null;
   const ask=pick(['x+y','x-y','2x+y']);const val=ask==='x+y'?x+y:ask==='x-y'?x-y:2*x+y;const askH=ask==='x+y'?`${X} + ${Y}`:ask==='x-y'?`${X} − ${Y}`:`2${X} + ${Y}`;
   const q=`${expr([[a,X],[b,Y]])} = ${mn(a*x+b*y)}<br>${expr([[c,X],[e,Y]])} = ${mn(c*x+e*y)}<br>If (${X}, ${Y}) is the solution to the given system of equations, what is the value of ${askH}?`;
   return spr(q,val,`Solving the system (by elimination or substitution) gives ${X} = ${mn(x)} and ${Y} = ${mn(y)}. So ${askH} = <b>${mn(val)}</b>.${watch(`answering with ${X} or ${Y} alone.`)}`,{chk:{t:'sys2',p:{a,b,c,e,r1:a*x+b*y,r2:c*x+e*y,ask},a:val}})}
  // d3: constant making a system have no solution
  const a=pick([2,3,4,5]),b=pick([3,5,7,-3,-5]),m=pick([2,3,4]),r1=R(1,12);const k=m*b;
  const q=`${expr([[a,X],[b,Y]])} = ${r1}<br>${expr([[m*a,X],[V('k'),Y]])} = ${mn(r1*m+pick([1,2,5,-3]))}<br>In the given system of equations, ${V('k')} is a constant. For what value of ${V('k')} does the system have no solution?`;
  return spr(q,k,`The second equation's ${X}-coefficient is ${m} times the first. For parallel lines, the ${Y}-coefficient must also be ${m} times as large: ${V('k')} = ${m} × ${par(b)} = <b>${mn(k)}</b>. The constants are not ${m} times as large, so the lines are parallel, not the same line.`,{chk:{t:'sysNone',p:{a,b,m},a:k}})}});

skill('alg_ineq',{t:'Linear inequalities',dom:'alg',course:1,phase:1,
 lesson:lesson('Solve an inequality like an equation, with one extra rule: multiplying or dividing both sides by a negative number flips the inequality sign.',
  ['"At least" means ≥, "at most" and "no more than" mean ≤.','For the greatest or least whole number that works, solve, then check the boundary.','To test a point against a system of inequalities, it must satisfy every inequality.'],
  ['Forgetting to flip the sign after dividing by a negative.','Rounding up when the budget means you must round down.'],
  'Type each inequality as written; Desmos shades it. The region shaded by both is the solution set, and you can tap a point to test it.'),
 gen(d){
  if(d===1){const a=pick([2,3,4,5,-2,-3,-4]),b=R(-10,10),x=R(-5,6);if(!b)return null;const c=a*x+b;const flip=a<0;
   const q=`Which inequality is equivalent to ${expr([[a,X],[b,'']])} > ${mn(c)}?`;
   return mc(q,`${X} ${flip?'<':'>'} ${mn(x)}`,[`${X} ${flip?'>':'<'} ${mn(x)}`,`${X} ${flip?'<':'>'} ${mn(-x)}`,`${X} ${flip?'>':'<'} ${mn(-x)}`,`${X} ${flip?'<':'>'} ${mn(c-b)}`],`${b<0?`Add ${mn(-b)}`:`Subtract ${mn(b)}`}: ${expr([[a,X]])} > ${mn(c-b)}. Divide by ${mn(a)}${flip?', and flip the sign because you divided by a negative':''}: ${X} ${flip?'<':'>'} ${mn(x)}.`,{form:1,chk:{t:'ineq1',p:{a,b,c},a:[flip?'<':'>',x]}})}
  if(d===2){const fee=pick([12,15,18,20,25]),each=pick([3.5,4.5,6,7.5,8]),budget=pick([60,75,90,100,120]);const n=Math.floor((budget-fee)/each+1e-9);
   const q=`A club pays a $${fee} setup fee plus $${each.toFixed(2)} per shirt. If the club can spend at most $${budget}, what is the greatest number of shirts it can buy?`;
   return spr(q,n,`${fee} + ${each}${V('n')} ≤ ${budget}, so ${V('n')} ≤ (${budget} − ${fee}) ÷ ${each} ${Math.abs((budget-fee)/each-round((budget-fee)/each,3))<1e-9?'=':'≈'} ${round((budget-fee)/each,3)}. The greatest whole number is <b>${n}</b>.${watch('rounding up, which would go over budget.')}`,{chk:{t:'budget',p:{fee,each,budget},a:n}})}
  const m1=pick([1,2,3]),b1=R(-3,2),m2=pick([-1,-2]),b2=R(3,7);const ok=(x,y)=>y>m1*x+b1&&y<=m2*x+b2;
  let good=null;const cand=[];for(let x=-4;x<=4;x++)for(let y=-6;y<=10;y++)cand.push([x,y]);
  const goods=shuf(cand.filter(p=>ok(...p)));const bads=shuf(cand.filter(p=>!ok(...p)&&(p[1]>m1*p[0]+b1||p[1]<=m2*p[0]+b2)));if(!goods.length||bads.length<3)return null;good=goods[0];
  const P=p=>`(${mn(p[0])}, ${mn(p[1])})`;
  const q=`${Y} > ${expr([[m1,X],[b1,'']])}<br>${Y} ≤ ${expr([[m2,X],[b2,'']])}<br>Which point (${X}, ${Y}) is a solution to the given system of inequalities?`;
  return mc(q,P(good),bads.slice(0,3).map(P),`Check both inequalities. For ${P(good)}: ${mn(good[1])} > ${mn(m1*good[0]+b1)} ✓ and ${mn(good[1])} ≤ ${mn(m2*good[0]+b2)} ✓. Each other point fails at least one.`,{chk:{t:'ineqPt',p:{m1,b1,m2,b2},a:good}})}});

skill('adv_equiv',{t:'Equivalent expressions',dom:'adv',course:1,phase:1,
 lesson:lesson('Equivalent expressions have the same value for every <i>x</i>. You will expand, factor, and use exponent rules.',
  ['(<i>x</i> + <i>a</i>)(<i>x</i> + <i>b</i>) = <i>x</i>² + (<i>a</i> + <i>b</i>)<i>x</i> + <i>ab</i>.','To factor <i>x</i>² + <i>bx</i> + <i>c</i>, find two numbers that multiply to <i>c</i> and add to <i>b</i>.','Exponent rules: <i>x</i><sup>a</sup> · <i>x</i><sup>b</sup> = <i>x</i><sup>a+b</sup>; (<i>x</i><sup>a</sup>)<sup>b</sup> = <i>x</i><sup>ab</sup>; <i>x</i><sup>m/n</sup> is the <i>n</i>th root of <i>x</i><sup>m</sup>.','Difference of squares: <i>a</i>² − <i>b</i>² = (<i>a</i> + <i>b</i>)(<i>a</i> − <i>b</i>). Factor out the greatest common factor first: 6<i>x</i>² − 24 = 6(<i>x</i>² − 4) = 6(<i>x</i> + 2)(<i>x</i> − 2).','Negative exponents: <i>x</i><sup>−<i>n</i></sup> = 1/<i>x</i><sup><i>n</i></sup>. To simplify (<i>x</i>² + 5<i>x</i> + 6)/(<i>x</i> + 2), factor the top and cancel: (<i>x</i> + 2)(<i>x</i> + 3)/(<i>x</i> + 2) = <i>x</i> + 3.','If two expressions are equal for all <i>x</i>, matching coefficients are equal.'],
  ['Forgetting the middle term: (<i>x</i> + 3)² is not <i>x</i>² + 9.','Adding exponents when you should multiply them.'],
  'Graph the original and a choice. If the two graphs lie exactly on top of each other, they are equivalent.'),
 gen(d){
  if(d===1){const a=R(-7,7),b=R(-7,7);if(!a||!b)return null;const q=`Which expression is equivalent to (${expr([[1,X],[a,'']])})(${expr([[1,X],[b,'']])})?`;
   const E=(p,r)=>expr([[1,X2],[p,X],[r,'']]);
   return mc(q,E(a+b,a*b),[E(0,a*b),E(a*b,a+b),E(a+b,-a*b),E(-(a+b),a*b)],`Multiply every term: ${expr([[1,X2],[b,X],[a,X],[a*b,'']])} = ${E(a+b,a*b)}.${watch('leaving out the middle term.')}`,{form:1,chk:{t:'expand',p:{a,b},a:[a+b,a*b]}})}
  if(d===2){if(R(0,1)){const a=pick([2,3,4,5]),b=pick([2,3,4]),c=pick([1,2,3,4,5]);
    const px=e=>e===1?X:sup(X,e);const q=`Which expression is equivalent to (${sup(X,a)})<sup>${b}</sup> · ${px(c)}, where ${X} > 0?`;
    return mc(q,sup(X,a*b+c),[sup(X,a+b+c),sup(X,a*b*c),sup(X,(a+b)*c),sup(X,a*(b+c))],`A power of a power multiplies exponents: (${sup(X,a)})<sup>${b}</sup> = ${sup(X,a*b)}. Multiplying adds exponents: ${sup(X,a*b)} · ${px(c)} = ${sup(X,a*b+c)}.`,{form:1,chk:{t:'exprule',p:{a,b,c},a:a*b+c}})}
   const m=pick([2,3,4,5]),n=pick([2,3,4]);if(gcd(m,n)!==1)return null;const root=n===2?'√':n===3?'∛':'∜';
   const q=`Which expression is equivalent to ${X}<sup>${m}/${n}</sup>, where ${X} > 0?`;
   return mc(q,`${root}(${sup(X,m)})`,[`${n===2?'∛':'√'}(${sup(X,m)})`,`${root}(${X})<sup>${m*n}</sup>`,`${frac(sup(X,m),n)}`,`${sup(X,m*n)}`],`The denominator of the exponent is the root, and the numerator is the power: ${X}<sup>${m}/${n}</sup> = ${root}(${sup(X,m)}).`,{form:1,chk:{t:'ratexp',p:{m,n},a:[m,n]}})}
  const a=pick([2,3,4,5]),b=R(-6,6),c=pick([1,2,3,-2]),e=R(-6,6);if(!b||!e)return null;const qv=a*e+b*c;
  const q=`(${expr([[a,X],[b,'']])})(${expr([[c,X],[e,'']])}) = ${V('p')}${X2} + ${V('q')}${X} + ${V('r')}<br>The given equation is true for all values of ${X}, where ${V('p')}, ${V('q')}, and ${V('r')} are constants. What is the value of ${V('q')}?`;
  return spr(q,qv,`The ${X}-terms come from the outer and inner products: (${mn(a)})(${mn(e)}) + (${mn(b)})(${mn(c)}) = ${mn(a*e)}${plus(b*c)} = ${mn(qv)}. So ${V('q')} = <b>${mn(qv)}</b>.`,{chk:{t:'coef',p:{a,b,c,e},a:qv}})}});

skill('adv_quad',{t:'Quadratic and other nonlinear equations',dom:'adv',course:1,phase:2,
 lesson:lesson('Quadratic equations can have two, one, or no real solutions. You can solve by factoring, by square roots, or with the quadratic formula. Equations with square roots or fractions, and a line meeting a parabola, come down to a quadratic too.',
  ['Get 0 on one side, then factor: (<i>x</i> − <i>r</i>)(<i>x</i> − <i>s</i>) = 0 gives <i>x</i> = <i>r</i> or <i>x</i> = <i>s</i>.','Discriminant <i>b</i>² − 4<i>ac</i>: positive → two real solutions, zero → exactly one, negative → none.','For <i>ax</i>² + <i>bx</i> + <i>c</i> = 0, the solutions add to −<i>b</i>/<i>a</i> and multiply to <i>c</i>/<i>a</i>.','Square-root or fraction equations: isolate the root, square both sides (or multiply through by the denominators), solve, then <b>check every answer in the original</b>. Squaring can create an answer that does not work (an extraneous solution).','A line and a parabola: substitute the line into the parabola to get one quadratic. Its discriminant tells how many times they meet: positive 2, zero 1 (the line is tangent), negative 0.'],
  ['Taking only the positive square root.','Using <i>b</i>² + 4<i>ac</i> instead of <i>b</i>² − 4<i>ac</i>.','Keeping an extraneous solution: √(<i>x</i> + 3) can never equal a negative number.'],
  'Graph y = the quadratic. The x-intercepts are the solutions, and the number of crossings tells you how many there are.'),
 gen(d){
  if(d===1){const r=R(2,12),h=R(-5,5);const q=`What is the positive solution to ${h?`(${expr([[1,X],[-h,'']])})<sup>2</sup>`:X2} = ${r*r}?`;const pos=[h+r,h-r].filter(v=>v>0);if(pos.length!==1)return null;
   return spr(q,pos[0],`Take square roots: ${expr([[1,X],[-h,'']])} = ${r} or ${expr([[1,X],[-h,'']])} = −${r}. So ${X} = ${mn(h+r)} or ${X} = ${mn(h-r)}. The positive solution is <b>${mn(pos[0])}</b>.`,{chk:{t:'sqroot',p:{h,r},a:pos[0]}})}
  if(d===2){if(R(0,1)){const r=R(-8,8),s=R(-8,8);if(r===s)return null;const b=-(r+s),c=r*s;const ask=R(0,1)?'sum':'big';
    const q=`${expr([[1,X2],[b,X],[c,'']])} = 0<br>What is the ${ask==='sum'?'sum of the solutions':'greater solution'} to the given equation?`;
    const val=ask==='sum'?r+s:Math.max(r,s);
    return spr(q,val,`Factor: ${r?`(${expr([[1,X],[-r,'']])})`:X}${s?`(${expr([[1,X],[-s,'']])})`:X} = 0, so ${X} = ${mn(r)} or ${X} = ${mn(s)}. ${ask==='sum'?`The sum is <b>${mn(r+s)}</b> (the same as −${V('b')}/${V('a')}).`:`The greater is <b>${mn(Math.max(r,s))}</b>.`}`,{chk:{t:'quadRoots',p:{b,c,ask},a:val}})}
   const a=pick([1,2,3]),b=R(-9,9),c=R(-9,9);const D=b*b-4*a*c;const n=D>0?2:D===0?1:0;
   const q=`How many distinct real solutions does the equation ${expr([[a,X2],[b,X],[c,'']])} = 0 have?`;
   return mc(q,['Zero','Exactly one','Exactly two'][n],['Zero','Exactly one','Exactly two','Infinitely many'].filter((_,i)=>i!==n),`The discriminant is ${V('b')}² − 4${V('a')}${V('c')} = ${mn(b*b)} − ${par(4*a*c)} = ${mn(D)}. ${D>0?'Positive: two real solutions.':D===0?'Zero: exactly one real solution.':'Negative: no real solutions.'}`,{form:1,order:['Zero','Exactly one','Exactly two','Infinitely many'],chk:{t:'disc',p:{a,b,c},a:n}})}
  // d3: the constant that gives exactly one solution, a square-root equation with an extraneous
  // solution, or how many times a line meets a parabola
  const pickd3=R(0,2);
  if(pickd3===1){// √(x + a) = x + b, built so that one root of the squared equation is extraneous
   const b=R(-5,5),r1=R(-b-6,-b-1),r2=1-2*b-r1;if(r1===r2||Math.abs(r2)>40)return null;const av=b*b-r1*r2;if(r2+av<0)return null;
   const q=`What is the solution to the equation √(${expr([[1,X],[av,'']])}) = ${expr([[1,X],[b,'']])}?`;
   return spr(q,r2,`Square both sides: ${expr([[1,X],[av,'']])} = (${expr([[1,X],[b,'']])})² = ${expr([[1,X2],[2*b,X],[b*b,'']])}. So ${expr([[1,X2],[2*b-1,X],[b*b-av,'']])} = 0, which factors as (${expr([[1,X],[-r1,'']])})(${expr([[1,X],[-r2,'']])}) = 0. Check both in the original: ${X} = ${mn(r1)} makes the right side ${mn(r1+b)}, which is negative, but a square root is never negative, so ${mn(r1)} is extraneous. ${X} = ${mn(r2)} works: √${mn(r2+av)} = ${mn(r2+b)}. The solution is <b>${mn(r2)}</b>.${watch(`answering ${mn(r1)} without checking it in the original equation.`)}`,{chk:{t:'radical',p:{a:av,b},a:r2}})}
  if(pickd3===2){// y = x² + bx + c and y = mx + k
   const b=R(-6,6),c=R(-8,8),m=R(-5,5),k=R(-8,8);const B=b-m,C=c-k;const D=B*B-4*C;const n=D>0?2:D===0?1:0;
   const q=`${Y} = ${expr([[1,X2],[b,X],[c,'']])}<br>${Y} = ${expr([[m,X],[k,'']])}<br>How many points of intersection do the graphs of the given equations have in the ${X}${Y}-plane?`;
   return mc(q,['Zero','Exactly one','Exactly two'][n],['Zero','Exactly one','Exactly two','Infinitely many'].filter((_,i)=>i!==n),`Set the right sides equal: ${expr([[1,X2],[b,X],[c,'']])} = ${expr([[m,X],[k,'']])}, so ${expr([[1,X2],[B,X],[C,'']])} = 0. The discriminant is ${par(B)}² − 4(1)${par(C)} = ${mn(D)}. ${D>0?'Positive: two intersection points.':D===0?'Zero: the line touches the parabola at exactly one point.':'Negative: the line misses the parabola.'}`,{form:1,order:['Zero','Exactly one','Exactly two','Infinitely many'],chk:{t:'sysCount',p:{b,c,m,k},a:n}})}
  const k=pick([2,3,4,5,6,7,8,10,12]),b=2*k*(R(0,1)?1:-1);const cval=k*k;
  const q=`In the equation ${X2} ${b<0?'−':'+'} ${Math.abs(b)}${X} + ${V('c')} = 0, ${V('c')} is a constant. If the equation has exactly one real solution, what is the value of ${V('c')}?`;
  return spr(q,cval,`Exactly one solution means the discriminant is 0: (${mn(b)})² − 4(1)${V('c')} = 0, so ${V('c')} = ${b*b} ÷ 4 = <b>${cval}</b>. (The equation is then (${expr([[1,X],[b/2,'']])})² = 0.)`,{chk:{t:'oneSol',p:{b},a:cval}})}});

skill('adv_nlfn',{t:'Nonlinear functions: quadratic and exponential',dom:'adv',course:1,phase:2,
 lesson:lesson('Quadratic functions make parabolas; exponential functions grow or shrink by the same factor each step.',
  ['Vertex form <i>y</i> = <i>a</i>(<i>x</i> − <i>h</i>)² + <i>k</i> has its vertex at (<i>h</i>, <i>k</i>). Note the sign: (<i>x</i> − 3)² means <i>h</i> = 3.','Exponential: <i>f</i>(<i>t</i>) = <i>a</i>(<i>b</i>)<sup><i>t</i></sup>. Growth of <i>r</i>% per step means <i>b</i> = 1 + <i>r</i>/100; decay of <i>r</i>% means <i>b</i> = 1 − <i>r</i>/100.','From standard form <i>y</i> = <i>ax</i>² + <i>bx</i> + <i>c</i>, the vertex is at <i>x</i> = −<i>b</i>/(2<i>a</i>); substitute to get its <i>y</i>-value. From factored form, the vertex\'s <i>x</i> is halfway between the two <i>x</i>-intercepts.','The minimum or maximum of a parabola is the <i>y</i>-value of its vertex.','In <i>f</i>(<i>t</i>) = <i>a</i>(<i>b</i>)<sup><i>t</i></sup>, <i>a</i> is the starting value, <i>f</i>(0). If something doubles every 3 years, the model is <i>a</i>(2)<sup><i>t</i>/3</sup>.'],
  ['Reading (<i>x</i> + 2)² as a vertex at <i>x</i> = 2 instead of −2.','Writing a 6% increase as 0.06 instead of 1.06.'],
  'Graph the function and tap the vertex: Desmos labels the minimum or maximum.',
  ex('What is the minimum value of <i>f</i>(<i>x</i>) = <i>x</i>² − 6<i>x</i> + 11?','Vertex at <i>x</i> = −(−6)/(2 · 1) = 3. Then <i>f</i>(3) = 9 − 18 + 11 = 2. Or complete the square: (<i>x</i> − 3)² + 2, and a square is never negative, so the minimum is 2.')),
 gen(d){
  if(d===1){if(R(0,1)){const a=pick([2,3,5,10]),b=pick([2,3]),k=pick([2,3]);const val=a*Math.pow(b,k);
    const q=`The function ${V('f')} is defined by ${V('f')}(${X}) = ${a}(${b})<sup>${X}</sup>. What is the value of ${V('f')}(${k})?`;
    return spr(q,val,`${V('f')}(${k}) = ${a}(${b})<sup>${k}</sup> = ${a} × ${Math.pow(b,k)} = <b>${val}</b>.${watch(`multiplying ${a} × ${b} first, then raising to the power.`)}`,{chk:{t:'fexp',p:{a,b,k},a:val}})}
   const c=R(-9,9),k=R(-5,5);if(!c)return null;const q=`The function ${V('g')} is defined by ${V('g')}(${X}) = ${X2} ${c<0?'−':'+'} ${Math.abs(c)}. What is the value of ${V('g')}(${mn(k)})?`;const val=k*k+c;
   return spr(q,val,`${V('g')}(${mn(k)}) = (${mn(k)})² ${c<0?'−':'+'} ${Math.abs(c)} = ${k*k} ${c<0?'−':'+'} ${Math.abs(c)} = <b>${mn(val)}</b>.${k<0?watch(`forgetting that squaring a negative gives a positive: (${mn(k)})² = ${k*k}.`):''}`,{chk:{t:'fsq',p:{c,k},a:val}})}
  if(d===2){if(R(0,1)){const h=R(-6,6),k=R(-6,6),a=pick([1,2,-1,3]);if(!h)return null;const P=(u,v)=>`(${mn(u)}, ${mn(v)})`;
    const q=`What are the coordinates of the vertex of the graph of ${Y} = ${a===1?'':a===-1?'−':a}(${expr([[1,X],[-h,'']])})<sup>2</sup> ${k<0?'−':'+'} ${Math.abs(k)} in the ${X}${Y}-plane?`;
    return mc(q,P(h,k),[P(-h,k),P(k,h),P(h,-k),P(-h,-k)],`In ${Y} = ${V('a')}(${X} − ${V('h')})² + ${V('k')}, the vertex is (${V('h')}, ${V('k')}). Here ${X} ${h>0?'−':'+'} ${Math.abs(h)} means ${V('h')} = ${mn(h)}, so the vertex is ${P(h,k)}.${watch('flipping the sign of h.')}`,{chk:{t:'vertex',p:{h,k},a:[h,k]}})}
   const P0=pick([200,500,800,1200,2500]),r=pick([3,4,5,6,8,10,12,15]),grow=R(0,1)===1;const b=grow?1+r/100:1-r/100;const bs=String(round(b,2));
   const q=`A ${grow?'town has a population of':'car was bought for'} ${grow?fmt(P0):'$'+fmt(P0*10)}, and the ${grow?'population grows':'value decreases'} by ${r}% each year. Which function models the ${grow?'population':'value'} ${V('t')} years later?`;
   const base=grow?fmt(P0):fmt(P0*10);const alt=String(round(grow?1-r/100:1+r/100,2));
   return mc(q,`${base}(${bs})<sup>${V('t')}</sup>`,[`${base}(0.${String(r).padStart(2,'0')})<sup>${V('t')}</sup>`,`${base}(${alt})<sup>${V('t')}</sup>`,`${base} ${grow?'+':'−'} ${r}${V('t')}`,`${base}(${r})<sup>${V('t')}</sup>`],`Each year the amount is multiplied by ${grow?`1 + ${r/100}`:`1 − ${r/100}`} = ${bs}. After ${V('t')} years: ${base}(${bs})<sup>${V('t')}</sup>.${watch(`using 0.${String(r).padStart(2,'0')}, which would keep only ${r}% each year.`)}`,{form:1,chk:{t:'growthExpr',p:{r,grow},a:b}})}
  // d3: minimum by completing the square, or percent decay read from a model
  if(R(0,1)){const h=R(-6,6),k=R(-20,10);if(!h||!k||h===k)return null;const b=-2*h,c=h*h+k;
   const q=`The function ${V('f')} is defined by ${V('f')}(${X}) = ${expr([[1,X2],[b,X],[c,'']])}. What is the minimum value of ${V('f')}(${X})?`;
   return spr(q,k,`Complete the square: ${V('f')}(${X}) = (${expr([[1,X],[-h,'']])})² ${k<0?'−':'+'} ${Math.abs(k)}. A square is never negative, so the minimum is <b>${mn(k)}</b>, when ${X} = ${mn(h)}.${watch(`giving the x-value ${mn(h)} instead of the minimum value.`)}`,{chk:{t:'minval',p:{b,c},a:k}})}
  const r=pick([4,6,8,12,15,20,25,35]),A=pick([800,1500,2400]);const b=round(1-r/100,2);
  const q=`The function ${V('f')}(${V('t')}) = ${fmt(A)}(${b})<sup>${V('t')}</sup> models the amount of a medicine, in milligrams, left in a patient's body ${V('t')} hours after a dose. By what percent does the amount decrease each hour?`;
  return mc(q,`${r}%`,[`${Math.round(b*100)}%`,`${round(r/100,2)}%`,`${100-r+5}%`,`${r*2}%`],`Each hour the amount is multiplied by ${b}, so ${Math.round(b*100)}% remains and ${r}% is lost.${watch(`${Math.round(b*100)}% is the part that remains, not the decrease.`)}`,{chk:{t:'decayPct',p:{b},a:r}})}});

skill('psda_ratio',{t:'Ratios, rates, proportions and units',dom:'psda',course:0,phase:1,
 lesson:lesson('Set up a proportion, or find the rate for one unit, then scale. For unit conversions, multiply by fractions equal to 1 so the units cancel.',
  ['Write the units next to every number. The units tell you what to multiply or divide.','Converting: 1 hour = 60 minutes, so multiply by (60 min / 1 h) or (1 h / 60 min), whichever cancels the unit you do not want.','For rates in a chain, such as miles per gallon and dollars per gallon, line up the fractions so units cancel.'],
  ['Multiplying by the conversion factor when you should divide.','Converting only one of the two units in a rate such as feet per second.']),
 gen(d){
  if(d===1){const n=pick([3,4,5,6,8]),c=pick([6,7.5,9,10,12,15]),k=pick([10,12,15,20,24]);if(k===n)return null;const tot=n*c;const ans=round(c*k,2);
   const q=`If ${n} notebooks cost ${money(tot)}, how many dollars do ${k} notebooks cost at the same price per notebook?`;
   return spr(q,ans,`One notebook costs ${money(tot)} ÷ ${n} = ${money(c)}. So ${k} notebooks cost ${k} × ${money(c)} = <b>${money(ans)}</b>, which is entered as ${ans}.`,{chk:{t:'unitcost',p:{n,tot,k},a:ans}})}
  if(d===2){const v=pick([18,36,54,72,90,108]);const ans=v*1000/3600;
   const q=`A train travels at a constant speed of ${v} kilometers per hour. What is its speed in meters per second? (1 kilometer = 1,000 meters)`;
   return spr(q,ans,`${v} km/h × 1,000 m/km ÷ 3,600 s/h = ${round(ans,4)} meters per second.${watch('forgetting that an hour is 3,600 seconds, not 60.')}`,{chk:{t:'kmh',p:{v},a:ans}})}
  const mpg=pick([24,25,30,32,36,40]),price=pick([3.2,3.5,3.6,4,4.5]),miles=pick([180,240,300,360,480]);const ans=round(miles/mpg*price,10);if(Math.abs(ans*100-Math.round(ans*100))>1e-6)return null;
  const q=`A car travels ${mpg} miles per gallon of gas, and gas costs $${price.toFixed(2)} per gallon. What is the cost, in dollars, of the gas needed to travel ${miles} miles?`;
  return spr(q,ans,`Gallons needed: ${miles} ÷ ${mpg} = ${fv(miles,mpg)}. Cost: ${fv(miles,mpg)} × ${money(price)} = <b>${money(ans)}</b>, which is entered as ${round(ans,2)}.`,{chk:{t:'gas',p:{mpg,price,miles},a:ans}})}});

skill('psda_pct',{t:'Percentages',dom:'psda',course:0,phase:1,
 lesson:lesson('"Percent" means "out of 100." Turn a percent into a decimal and multiply.',
  ['<i>p</i>% of <i>N</i> is (<i>p</i>/100) × <i>N</i>.','Percent change = (new − old) ÷ old × 100.','An increase of <i>p</i>% multiplies by (1 + <i>p</i>/100); a decrease multiplies by (1 − <i>p</i>/100). Changes in a row multiply; they do not add.','To find the original price, divide the new amount by the multiplier.'],
  ['Adding successive percent changes: +20% then −20% is a net 4% decrease, not 0%.','Finding a percent of the new amount when the question gives the original.']),
 gen(d){
  if(d===1){const p=pick([5,12,15,20,25,35,40,60,75]),N=pick([40,60,80,120,160,240,300,480]);const ans=p*N/100;
   return spr(`What is ${p}% of ${N}?`,ans,`${p}% of ${N} = ${p/100} × ${N} = <b>${ans}</b>.`,{chk:{t:'pctof',p:{p,N},a:ans}})}
  if(d===2){const p=pick([10,15,20,25,30,40]),orig=pick([40,60,80,120,150,200,240]);const sale=orig*(100-p)/100;
   const q=`After a ${p}% discount, the price of a jacket is ${money(sale)}. What was the original price, in dollars?`;
   return spr(q,orig,`The sale price is ${100-p}% of the original: ${(100-p)/100} × ${V('x')} = ${sale}, so ${V('x')} = ${sale} ÷ ${(100-p)/100} = <b>${orig}</b>.${watch(`adding ${p}% of ${money(sale)} back, which gives ${money(sale*(1+p/100))}.`)}`,{chk:{t:'orig',p:{p,sale},a:orig}})}
  const a=pick([10,20,25,30,40,50]),b=pick([10,20,25,30,40,50]);const net=round(((1+a/100)*(1-b/100)-1)*100,4);
  const q=`The price of a stock increased by ${a}% on Monday and then decreased by ${b}% on Tuesday. What was the net percent change in the price over the two days? (If the price decreased, enter a negative number.)`;
  return spr(q,net,`Multiply the factors: ${1+a/100} × ${1-b/100} = ${round((1+a/100)*(1-b/100),4)}. That is a change of ${mn(net)}%.${watch(`adding the percents gives ${mn(a-b)}%, which ignores that the second change applies to the new price.`)}`,{chk:{t:'net',p:{a,b},a:net}})}});

skill('psda_stat1',{t:'One-variable data: center and spread',dom:'psda',course:1,phase:1,
 lesson:lesson('The mean is the total divided by the count; the median is the middle value in order. Spread measures how far values are from the center.',
  ['Mean × count = total. Use it to find a missing value or the effect of adding one.','An outlier pulls the mean toward it but barely moves the median.','Range = largest value − smallest value. Standard deviation measures spread: data bunched near the mean has a smaller standard deviation. You never need to calculate it on the SAT, only compare.','In a frequency table, dot plot, or histogram, the median is the middle of all <i>n</i> values: count up through the frequencies until you reach position (<i>n</i> + 1)/2.','If the mean is well above the median, a few large values are pulling it up (the data is skewed right); well below, a few small values are pulling it down.'],
  ['Forgetting to put values in order before finding the median.','Thinking a larger mean means a larger standard deviation.','Reading the median of a frequency table from the middle row instead of the middle value.']),
 gen(d){
  if(d===1){const n=pick([5,6,7]),vals=Array.from({length:n},()=>R(3,20));const s=vals.reduce((a,b)=>a+b,0);if(s%n)return null;const m=s/n;
   return spr(`What is the mean of the data set ${vals.join(', ')}?`,m,`Total: ${vals.join(' + ')} = ${s}. Mean: ${s} ÷ ${n} = <b>${m}</b>.`,{chk:{t:'mean',p:{vals},a:m}})}
  if(d===2){if(R(0,1)){const n=pick([4,5]),M=R(70,90);const vals=Array.from({length:n},()=>R(M-12,M+12));const need=(n+1)*M-vals.reduce((a,b)=>a+b,0);if(need<50||need>100||need===M)return null;
    const q=`A student's first ${n} test scores are ${vals.join(', ')}. What score does the student need on the next test for the mean of all ${n+1} scores to be ${M}?`;
    return spr(q,need,`The ${n+1} scores must total ${n+1} × ${M} = ${(n+1)*M}. The first ${n} total ${vals.reduce((a,b)=>a+b,0)}. Needed: <b>${need}</b>.${watch(`answering ${M}, the target mean, not the needed score.`)}`,{chk:{t:'needMean',p:{vals,M},a:need}})}
   const hi=R(0,1)===1;const base=Array.from({length:6},()=>R(40,60)).sort((a,b)=>a-b),out=hi?R(95,130):R(1,8);const all=[...base,out].sort((a,b)=>a-b);
   const med=v=>{const s=v.slice().sort((a,b)=>a-b),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2};const mean=v=>v.reduce((a,b)=>a+b,0)/v.length;
   const dMed=Math.abs(med(all)-med(base)),dMean=Math.abs(mean(all)-mean(base));if(dMean<=dMed+1)return null;const dir=hi?'decreases':'increases';
   const q=`A data set contains the values ${all.join(', ')}. If the value ${out} is removed, which statement is true?`;
   return mc(q,`The mean ${dir} more than the median does.`,[`The median ${dir} more than the mean does.`,`The mean and median ${dir} by the same amount.`,`Neither the mean nor the median changes.`],`${out} is far ${hi?'above':'below'} the other values, so it pulls the mean ${hi?'up':'down'}. Removing it changes the mean by about ${round(dMean,2)}, while the median ${dMed?`changes by only ${round(dMed,2)}`:'does not change at all'}.`,{form:1,chk:{t:'outlier',p:{base,out},a:'mean'}})}
  const m=R(20,40),w1=pick([1,2]),w2=pick([6,8,10]);const tight=[m-w1,m,m,m,m+w1],wide=[m-w2,m-w2/2,m,m+w2/2,m+w2];const bWide=R(0,1)===1;const A=bWide?tight:wide,B=bWide?wide:tight;const big=bWide?'B':'A',small=bWide?'A':'B';
  const q=`Data set A: ${A.join(', ')}<br>Data set B: ${B.join(', ')}<br>Which statement correctly compares the standard deviations of the two data sets?`;
  return mc(q,`The standard deviation of ${big} is greater.`,[`The standard deviation of ${small} is greater.`,'The standard deviations are equal.','There is not enough information to compare them.'],`Both sets have mean ${m}, but ${big}'s values are spread much farther from ${m}. More spread means a greater standard deviation.${watch('equal means do not mean equal spread.')}`,{form:1,order:['The standard deviation of A is greater.','The standard deviation of B is greater.','The standard deviations are equal.','There is not enough information to compare them.'],chk:{t:'sd',p:{A,B},a:big}})}});

skill('psda_stat2',{t:'Two-variable data: scatterplots and models',dom:'psda',course:1,phase:1,
 lesson:lesson('A line of best fit summarizes a scatterplot. Its slope is the predicted change in <i>y</i> for each 1-unit increase in <i>x</i>.',
  ['To predict, substitute into the equation of the line of best fit.','Interpret slope in context: "for each additional ___, the predicted ___ increases by ___."','Linear models add the same amount each step; exponential models multiply by the same factor.'],
  ['Treating a prediction as an exact value for a real data point.','Choosing a linear model when the amount grows by a fixed percent.'],
  'Put the data in a table and type y₁ ~ mx₁ + b for a linear fit, or y₁ ~ a·b^x₁ for an exponential fit.'),
 gen(d){

   const fig=plane({x:[0,22],y:[0,Math.ceil((m*22+b+6)/10)*10],sx:2,sy:10,lx:4,ly:10,pts,fns:[{f:t=>m*t+b,color:'var(--bar2)'}],alt:`Scatterplot with a line of best fit, y = ${m}x + ${b}`});
   const q=`The scatterplot shows data with a line of best fit whose equation is ${Y} = ${m}${X} + ${b}. What ${Y}-value does the line predict when ${X} = ${x}?${fig}`;
   return spr(q,m*x+b,`Substitute: ${m}(${x}) + ${b} = <b>${m*x+b}</b>.`,{chk:{t:'predict',p:{m,b,x},a:m*x+b}})}
  if(d===2){const m=pick([1.2,2.5,3.4,0.8]),b=pick([12,20,35]);
   const C=pick([{x:'the number of hours studied',xs:'the number of hours studied',y:'the test score, in points',each:'hour studied',name:'test score',u:' points',zero:'no hours are studied'},
    {x:'the temperature, in degrees Fahrenheit',xs:'the temperature',y:'the number of ice creams sold',each:'degree Fahrenheit',name:'number of ice creams sold',u:'',zero:'the temperature is 0 degrees Fahrenheit'},

   const q=`A line of best fit for a set of data is ${Y} = ${m}${X} + ${b}, where ${X} is ${C.x}${C.x.includes(',')?',':''} and ${Y} is ${C.y}. What is the best interpretation of ${num} in this context?`;
   const S=v=>`For each additional ${C.each}, the predicted ${C.name} increases by ${v}${C.u}.`,I=v=>`The predicted ${C.name} is ${v}${C.u} when ${C.zero}.`;
   return mc(q,slopeAsk?S(m):I(b),slopeAsk?[I(m),`For each increase of 1 in the predicted ${C.name}, ${C.xs} increases by ${m}.`,`The predicted ${C.name} is ${m} times ${C.xs}.`]:[S(b),I(m),`${cap(C.xs)} is ${b} when the predicted ${C.name} is 0.`],
    `In ${Y} = ${m}${X} + ${b}, the slope ${m} is the predicted change in ${Y} for each increase of 1 in ${X}, and ${b} is the predicted ${Y} when ${X} = 0.`,{form:1,chk:{t:'slopeInterp',p:{},a:slopeAsk?'slope':'intercept'}})}
  const lin=R(0,1)===1;const start=pick([100,200,500]),step=lin?pick([20,30,50]):pick([10,20,50]);
