  const q=`The table shows values of a quantity ${V('Q')} over time ${V('t')}, in years.${table([V('t'),V('Q')],rows.map(r=>[r[0],fmt(r[1])]))}Which type of model best fits the data?`;
  return mc(q,lin?`Linear: ${V('Q')} increases by ${step} each year`:`Exponential: ${V('Q')} increases by ${step}% each year`,lin?[`Exponential: ${V('Q')} increases by ${round(step/start*100,2)}% each year`,`Linear: ${V('Q')} increases by ${step*2} each year`,`Linear: ${V('Q')} decreases by ${step} each year`]:[`Linear: ${V('Q')} increases by ${round(rows[1][1]-rows[0][1],2)} each year`,`Exponential: ${V('Q')} increases by ${step*2}% each year`,`Exponential: ${V('Q')} decreases by ${step}% each year`],
   lin?`The differences are all ${step}: the same amount added each year, which is linear.`:`The differences grow (${fmt(round(rows[1][1]-rows[0][1],2))}, ${fmt(round(rows[2][1]-rows[1][1],2))}, …) but each value is ${1+step/100} times the one before: exponential growth of ${step}%.`,{form:1,chk:{t:'model',p:{rows},a:lin?'lin':'exp'}})}});

skill('psda_prob',{t:'Probability and two-way tables',dom:'psda',course:0,phase:1,
 lesson:lesson('Probability = favorable outcomes ÷ total outcomes. With a two-way table, the key is choosing the right total.',
  ['"Given that" or "of those who…" restricts the total to one row or column.','Fill in a table\'s missing cells from the totals before answering.','P(not A) = 1 − P(A). When a table gives percents of each row, that row is the total for those percents.'],
  ['Dividing by the grand total when the question restricts the group.']),
 gen(d){
  if(d===1){const r=R(3,9),b=R(3,9),g=R(2,8);const q=`A bag has ${r} red, ${b} blue, and ${g} green marbles. If one marble is picked at random, what is the probability that it is blue?`;
   return spr(q,b/(r+b+g),`${b} blue out of ${r+b+g} marbles: ${fv(b,r+b+g)}.`,{chk:{t:'prob',p:{fav:b,tot:r+b+g},a:b/(r+b+g)}})}
  const a=R(12,40),b=R(12,40),c=R(12,40),e=R(12,40);const rows=[['Played a sport',a,b,a+b],['Did not play a sport',c,e,c+e],['Total',a+c,b+e,a+b+c+e]];
  const tb=table(['','Grade 9','Grade 10','Total'],rows);
  if(d===2){const q=`The table summarizes a survey of students.${tb}If a student is selected at random from those in grade 10, what is the probability that the student played a sport?`;
   return spr(q,b/(b+e),`Only grade 10 counts: ${b} of the ${b+e} grade 10 students played a sport, so the probability is ${fv(b,b+e)}.${watch(`dividing by the whole survey (${a+b+c+e}).`)}`,{chk:{t:'cond',p:{fav:b,tot:b+e},a:b/(b+e)}})}
  const q=`The table summarizes a survey of students.${tb}If a student who did not play a sport is selected at random, what is the probability that the student is in grade 9?`;
  return spr(q,c/(c+e),`Restrict to students who did not play a sport: ${c+e}. Of those, ${c} are in grade 9. Probability: ${fv(c,c+e)}.`,{chk:{t:'cond',p:{fav:c,tot:c+e},a:c/(c+e)}})}});

skill('psda_infer',{t:'Sampling, margin of error and valid conclusions',dom:'psda',course:1,phase:2,
 lesson:lesson('A random sample lets you estimate a value for the population it was drawn from, within a margin of error.',
  ['An estimate of 42% with a margin of error of 3 percentage points means the true value is plausibly between 39% and 45%.','Results generalize only to the population that was sampled at random.','Only a randomized experiment (random assignment) can show cause and effect.','A larger sample gives a smaller margin of error.'],
  ['Claiming cause and effect from an observational study.','Applying a sample from one school to the whole country.'],
  null,
  ex('Volunteers were randomly assigned to drink a new sports drink or water during a workout; the drink group ran farther. What can be concluded?','Random <i>assignment</i> supports cause: the drink likely improved distance, for people like the volunteers. But the volunteers were not randomly <i>selected</i> from any larger group, so the result cannot be generalized to all athletes.')),
 gen(d){
  if(d===2){const p=R(30,70),e=pick([2,3,4,5]);const q=`A random sample of voters in a city found that ${p}% support a new park, with a margin of error of ${e} percentage points. Which is the most plausible conclusion?`;
   return mc(q,`The percent of all voters in the city who support the park is likely between ${p-e}% and ${p+e}%.`,[`Exactly ${p}% of all voters in the city support the park.`,`The percent of all voters in the state who support the park is between ${p-e}% and ${p+e}%.`,`Between ${p-e}% and ${p+e}% of the sample supports the park.`],`A margin of error gives a plausible range for the whole population that was sampled: ${p-e}% to ${p+e}% of the city's voters. It does not make ${p}% exact, and it does not extend to the whole state.`,{form:1,chk:{t:'moe',p:{p,e},a:[p-e,p+e]}})}
  if(d===1&&R(0,1)){const S=pick([['400 randomly selected students at Lincoln High School','all students at Lincoln High School','all high school students in the state','only the 400 students who were surveyed','all teachers at Lincoln High School'],
    ['250 randomly selected customers of one grocery store','all customers of that grocery store','all grocery shoppers in the country','only the 250 customers who were surveyed','all employees of that grocery store']]);
   const q=`A survey of ${S[0]} asked how they usually travel to ${S[0].includes('students')?'school':'the store'}. To which group can the results of the survey most appropriately be generalized?`;
   return mc(q,cap1(S[1]),[cap1(S[2]),cap1(S[3]),cap1(S[4])],`The sample was chosen at random from ${S[1]}, so the results can be generalized to that group, and to no larger group.${watch('stretching the results to a population that was never sampled.')}`,{form:1,chk:{t:'generalize',p:{},a:'pop'}})}
  if(d===3&&R(0,1)){const T=pick([['a new vitamin','sleep quality'],['a new study app','quiz scores'],['a new stretching routine','flexibility']]);
   const q=`Researchers recruited 200 volunteers and randomly assigned half to use ${T[0]} and half not to. After eight weeks, the group using ${T[0]} showed significantly greater improvement in ${T[1]}. Which conclusion is best supported?`;
   return mc(q,`Using ${T[0]} likely causes improvement in ${T[1]} for people similar to the volunteers.`,[`Using ${T[0]} likely causes improvement in ${T[1]} for all adults in the country.`,`There is an association between ${T[0]} and ${T[1]}, but no conclusion about cause is possible.`,`No conclusion is possible, because the volunteers were not selected at random.`],`Random assignment to groups supports a cause-and-effect conclusion. Because the volunteers were not a random sample of a larger population, the conclusion applies only to people like the volunteers.${watch('confusing random assignment (which supports cause) with random selection (which supports generalizing).')}`,{form:1,chk:{t:'experiment',p:{},a:'cause'}})}
  const ctx=pick([
   {study:'researchers surveyed 500 randomly selected adults in one town. Adults who drank tea daily were more likely to report sleeping well.',pop:'adults in that town',assoc:'drinking tea daily and reporting sleeping well',cause:'Drinking tea daily causes adults in that town to sleep well.',wide:'Adults everywhere who drink tea daily are more likely to sleep well.'},
   {study:'researchers collected data on 300 randomly chosen students at one school. Students who played an instrument tended to have higher math grades.',pop:'students at that school',assoc:'playing an instrument and having higher math grades',cause:'Playing an instrument causes students at that school to earn higher math grades.',wide:'Students at every school who play an instrument earn higher math grades.'}]);
  const q=`In a study, ${ctx.study} No one was assigned to a group. Which conclusion is best supported by the study?`;
  return mc(q,`Among ${ctx.pop}, there is an association between ${ctx.assoc}.`,[ctx.cause,ctx.wide,`Among ${ctx.pop}, there is no relationship between ${ctx.assoc}.`],`The participants were randomly selected but not randomly assigned, so the study shows an association, not cause and effect. It applies to the population that was sampled.${watch('reading an association as a cause.')}`,{form:1,chk:{t:'assoc',p:{},a:'assoc'}})}});

skill('geo_area',{t:'Area and volume',dom:'geo',course:0,phase:1,
 lesson:lesson('The reference sheet gives area and volume formulas. The work is choosing the right one and handling units and scale.',
  ['Circle: <i>A</i> = π<i>r</i>², <i>C</i> = 2π<i>r</i>. Cylinder: <i>V</i> = π<i>r</i>²<i>h</i>. Cone: <i>V</i> = ⅓π<i>r</i>²<i>h</i>.','If every length is multiplied by <i>k</i>, area is multiplied by <i>k</i>² and volume by <i>k</i>³.','Surface area of a cube with edge <i>s</i> is 6<i>s</i>²; its volume is <i>s</i>³.'],
  ['Using the diameter as the radius.','Multiplying volume by <i>k</i> instead of <i>k</i>³ when lengths scale.']),
 gen(d){
  if(d===1){const r=R(3,12);const q=`A circle has a radius of ${r} centimeters. What is the area of the circle, in square centimeters?`;
   return mc(q,`${r*r}π`,[`${2*r}π`,`${r}π`,`${4*r*r}π`,`${r*r*2}π`],`${V('A')} = π${V('r')}² = π(${r})² = ${r*r}π.${watch(`${2*r}π is the circumference.`)}`,{chk:{t:'circArea',p:{r},a:r*r}})}
  if(d===2){const r=pick([2,3,4,5,6]),h=pick([3,5,6,9,10]);const q=`A right circular cylinder has a radius of ${r} inches and a height of ${h} inches. Its volume is ${V('k')}π cubic inches. What is the value of ${V('k')}?`;
   return spr(q,r*r*h,`${V('V')} = π${V('r')}²${V('h')} = π(${r})²(${h}) = ${r*r*h}π, so ${V('k')} = <b>${r*r*h}</b>.`,{chk:{t:'cyl',p:{r,h},a:r*r*h}})}
  if(R(0,1)){const s=pick([2,3,4,5,6,7,8]);const SA=6*s*s;const q=`A cube has a surface area of ${SA} square meters. What is the volume of the cube, in cubic meters?`;
   return spr(q,s*s*s,`Each of the 6 faces has area ${SA} ÷ 6 = ${s*s}, so the edge is ${s}. Volume = ${s}³ = <b>${s*s*s}</b>.`,{chk:{t:'cube',p:{SA},a:s*s*s}})}
  const k=pick([2,3,4]),V0=pick([5,8,10,12]);const q=`Two similar rectangular prisms have corresponding edge lengths in the ratio 1 to ${k}. If the smaller prism has a volume of ${V0} cubic feet, what is the volume of the larger prism, in cubic feet?`;
  return spr(q,V0*k*k*k,`Volumes of similar solids scale by the cube of the length ratio: ${V0} × ${k}³ = <b>${V0*k*k*k}</b>.${watch(`multiplying by ${k} or ${k*k} instead of ${k*k*k}.`)}`,{chk:{t:'simVol',p:{k,V0},a:V0*k*k*k}})}});

skill('geo_lines',{t:'Lines, angles and triangles',dom:'geo',course:2,phase:1,
 lesson:lesson('Angle facts do most of the work: straight angles are 180°, angles in a triangle add to 180°, and parallel lines make equal angles.',
  ['Parallel lines cut by a transversal: corresponding and alternate interior angles are equal; same-side interior angles add to 180°.','An exterior angle of a triangle equals the sum of the two far interior angles.','Vertical angles (across an X) are equal. In an isosceles triangle, the angles opposite the equal sides are equal.','The angles of any polygon with <i>n</i> sides add to (<i>n</i> − 2) × 180°: a pentagon\'s add to 540°.','Similar triangles have proportional sides: set up small/large = small/large.'],
  ['Matching the wrong sides in similar triangles.','Assuming a figure is drawn to scale.']),
 gen(d){
  if(d===1){const a=R(35,145);if(a===90)return null;
   // Lines m (y = 60) and n (y = 140); the transversal makes the angle a with m, measured below m and to its right.
   const t=a*Math.PI/180,dx=80/Math.tan(t),x1=150-dx/2,x2=150+dx/2,ux=dx/80,f=v=>v.toFixed(1);
   const bis=(ang1,ang2,r)=>{const m=(ang1+ang2)/2;return [Math.cos(m)*r,Math.sin(m)*r]};
   const [ax,ay]=bis(0,t,30),[bx,by]=bis(0,-(Math.PI-t),30);
   const arc=(cx,cy,from,to,sw)=>`<path d="M${f(cx+14*Math.cos(from))},${f(cy+14*Math.sin(from))} A14,14 0 0 ${sw} ${f(cx+14*Math.cos(to))},${f(cy+14*Math.sin(to))}" fill="none" stroke="var(--ink)" stroke-width="1.3"/>`;
   const fig=SVG(300,190,`<line x1="20" y1="60" x2="285" y2="60" stroke="var(--ink)" stroke-width="2"/><line x1="20" y1="140" x2="285" y2="140" stroke="var(--ink)" stroke-width="2"/><line x1="${f(x1-35*ux)}" y1="25" x2="${f(x2+35*ux)}" y2="175" stroke="var(--ink)" stroke-width="2"/>
    ${arc(x1,60,0,t,1)}${arc(x2,140,0,-(Math.PI-t),0)}<text x="276" y="52" class="ft small" font-style="italic">m</text><text x="276" y="132" class="ft small" font-style="italic">n</text>
    <text x="${f(x1+ax)}" y="${f(60+ay+4)}" text-anchor="middle" class="ft small">${a}°</text><text x="${f(x2+bx)}" y="${f(140+by+4)}" text-anchor="middle" class="ft small"><tspan font-style="italic">x</tspan>°</text>`,`Two parallel lines m and n cut by a transversal. The angle below line m to the right of the transversal is ${a} degrees; the angle above line n to the right of the transversal is x degrees.`);
   const q=`In the figure, line ${V('m')} is parallel to line ${V('n')}. What is the value of ${V('x')}?${fig}`;
   return spr(q,180-a,`The two marked angles are between the parallel lines on the same side of the transversal (same-side interior angles), so they add to 180°: ${V('x')} = 180 − ${a} = <b>${180-a}</b>.${watch(`answering ${a}, which assumes the angles are equal.`)}`,{chk:{t:'ssi',p:{a},a:180-a}})}
  if(d===2){const A=R(30,80),B=R(30,80);if(A+B>=160)return null;const ext=A+B;const q=`In triangle ${V('PQR')}, the measure of angle ${V('P')} is ${A}° and the measure of angle ${V('Q')} is ${B}°. Side ${V('QR')} is extended past ${V('R')}. What is the measure, in degrees, of the exterior angle at ${V('R')}?`;
   return spr(q,ext,`The exterior angle equals the sum of the two far interior angles: ${A} + ${B} = <b>${ext}</b>. (Or: angle ${V('R')} = ${180-ext}, and 180 − ${180-ext} = ${ext}.)`,{chk:{t:'extAng',p:{A,B},a:ext}})}
  const AD=R(2,8),DB=R(2,8),DE=R(3,12);const BC=DE*(AD+DB)/AD;
  const q=`In triangle ${V('ABC')}, point ${V('D')} is on side ${V('AB')} and point ${V('E')} is on side ${V('AC')}, with ${V('DE')} parallel to ${V('BC')}. If ${V('AD')} = ${AD}, ${V('DB')} = ${DB}, and ${V('DE')} = ${DE}, what is the length of ${V('BC')}?`;
  return spr(q,BC,`Triangles ${V('ADE')} and ${V('ABC')} are similar, and ${V('AB')} = ${AD} + ${DB} = ${AD+DB}. So ${V('BC')}/${DE} = ${AD+DB}/${AD}, and ${V('BC')} = ${fv(DE*(AD+DB),AD)}.${watch(`using ${V('DB')} instead of the whole side ${V('AB')}.`)}`,{chk:{t:'simTri',p:{AD,DB,DE},a:BC}})}});

skill('geo_trig',{t:'Right triangles and trigonometry',dom:'geo',course:2,phase:2,
 lesson:lesson('In a right triangle, <i>a</i>² + <i>b</i>² = <i>c</i>², and the trigonometric ratios compare sides: SOH-CAH-TOA.',
  ['sin = opposite / hypotenuse, cos = adjacent / hypotenuse, tan = opposite / adjacent.','Special right triangles (on the reference sheet): 45-45-90 has sides <i>s</i>, <i>s</i>, <i>s</i>√2; 30-60-90 has sides <i>s</i>, <i>s</i>√3, 2<i>s</i>.','For complementary angles, sin <i>x</i>° = cos(90 − <i>x</i>)°.'],
  ['Using the hypotenuse as the adjacent side.','Mixing up which leg is opposite an angle.'],
  'Desmos starts in radians. For a question in degrees, open the wrench menu and switch to degrees before typing sin(35).'),
 gen(d){
  const trip=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10],[9,12,15]]);
  if(d===1){const [a,b,c]=trip;const q=`A right triangle has legs of length ${a} and ${b}. What is the length of the hypotenuse?`;
   return spr(q,c,`${a}² + ${b}² = ${a*a+b*b} = ${c}², so the hypotenuse is <b>${c}</b>.`,{chk:{t:'hyp',p:{a,b},a:c}})}
  if(d===2){const [a,b,c]=trip;const fn=pick(['sin','cos','tan']);const val=fn==='sin'?[a,c]:fn==='cos'?[b,c]:[a,b];
   const q=`In right triangle ${V('ABC')}, angle ${V('C')} is the right angle, ${V('BC')} = ${a}, ${V('AC')} = ${b}, and ${V('AB')} = ${c}. What is ${fn} ${V('A')}?${rightTri({a,b,c})}`;
   const all={sin:fv(a,c),cos:fv(b,c),tan:fv(a,b)};
   return mc(q,all[fn],[...Object.entries(all).filter(([k])=>k!==fn).map(e=>e[1]),fv(val[1],val[0])],`For angle ${V('A')}, the opposite side is ${V('BC')} = ${a}, the adjacent side is ${V('AC')} = ${b}, and the hypotenuse is ${c}. ${fn} ${V('A')} = ${fn==='sin'?'opposite/hypotenuse':fn==='cos'?'adjacent/hypotenuse':'opposite/adjacent'} = ${all[fn]}.`,{chk:{t:'trigRatio',p:{a,b,c,fn},a:val[0]/val[1]}})}
  if(R(0,1)){const x=R(12,78);const q=`In a right triangle, one acute angle measures ${V('x')}°. If sin(${V('x')}°) = cos(${V('k')}°), where 0 < ${V('k')} < 90, and ${V('x')} = ${x}, what is the value of ${V('k')}?`;
   return spr(q,90-x,`sin ${V('x')}° = cos(90 − ${V('x')})°, so ${V('k')} = 90 − ${x} = <b>${90-x}</b>.`,{chk:{t:'cofn',p:{x},a:90-x}})}
  const gg=gcd(trip[0],gcd(trip[1],trip[2]));const [a,b,c]=trip.map(v=>v/gg);const q=`In right triangle ${V('ABC')}, angle ${V('C')} is a right angle and sin ${V('A')} = ${fv(a,c)}. What is tan ${V('A')}?`;
  return mc(q,fv(a,b),[fv(b,a),fv(b,c),fv(c,a)],`Let the side opposite ${V('A')} be ${a} and the hypotenuse ${c}. The other leg is √(${c}² − ${a}²) = ${b}. tan ${V('A')} = opposite/adjacent = ${fv(a,b)}.`,{chk:{t:'sinToTan',p:{a,c},a:a/b}})}});

skill('geo_circle',{t:'Circles, arcs and radians',dom:'geo',course:2,phase:2,
 lesson:lesson('Arcs and sectors are fractions of the whole circle: the central angle over 360° (or over 2π radians).',
  ['Arc length = (angle/360) × 2π<i>r</i>. Sector area = (angle/360) × π<i>r</i>².','Radians: 180° = π radians.','Circle equation: (<i>x</i> − <i>h</i>)² + (<i>y</i> − <i>k</i>)² = <i>r</i>², center (<i>h</i>, <i>k</i>), radius <i>r</i>. Complete the square if it is not in this form.','A tangent line is perpendicular to the radius at the point where it touches the circle, which often creates a right triangle.'],
  ['Giving <i>r</i>² as the radius.','Reversing the signs of the center coordinates.'],
  'Graph the circle equation exactly as given to check your work; Desmos draws it but labels nothing, so get the exact center and radius by completing the square.'),
 gen(d){
  if(d===1){const deg=pick([30,45,60,90,120,135,150,180,210,270]);
   const pif=(a,b)=>{[a,b]=simp(a,b);return (a===1?'':a)+'π'+(b===1?'':'/'+b)};
   const q=`What is the measure of an angle of ${deg}° in radians?`;
   return mc(q,pif(deg,180),[pif(180,deg),`${deg}π`,pif(deg,360),pif(2*deg,180),pif(deg,90)],`Multiply by π/180: ${deg} × π/180 = ${pif(deg,180)}.`,{form:1,chk:{t:'rad',p:{deg},a:deg/180}})}
  if(d===2){const r=pick([3,4,6,8,9,10,12]),deg=pick([30,40,60,90,120]);const k=round(2*r*deg/360,6);if(!Number.isInteger(k*6))return null;
   const q=`A circle has a radius of ${r}. What is the length of an arc of the circle intercepted by a central angle of ${deg}°? (Express your answer as ${V('k')}π and enter the value of ${V('k')}.)`;
   const [kn,kd]=simp(2*r*deg,360);const kpi=kd===1?(kn===1?'π':`${kn}π`):`${frac(kn,kd)}π`;
   return spr(q,2*r*deg/360,`Arc length = (${deg}/360) × 2π(${r}) = ${kpi}, so ${V('k')} = ${fv(kn,kd)}.`,{chk:{t:'arc',p:{r,deg},a:2*r*deg/360}})}
  const h=R(-6,6),k=R(-6,6),r=R(2,9);const D=-2*h,E=-2*k,F=h*h+k*k-r*r;
  const q=`The equation ${expr([[1,X2],[1,`${V('y')}<sup>2</sup>`],[D,X],[E,Y],[F,'']])} = 0 defines a circle in the ${X}${Y}-plane. What is the radius of the circle?`;
  return spr(q,r,`Complete the square for ${X} and ${Y}: (${expr([[1,X],[-h,'']])})² + (${expr([[1,Y],[-k,'']])})² = ${h*h+k*k-F} = ${r}². The radius is <b>${r}</b>.${watch(`giving ${r*r}, which is r², not r.`)}`,{chk:{t:'circEq',p:{D,E,F},a:r}})}});

// ================= READING AND WRITING =================
// Every question has its own short text, as on the digital SAT. Items live in a bank.
const RW=[];
const item=o=>RW.push(o);
const STEM={
 wic:'Which choice completes the text with the most logical and precise word or phrase?',
 struct:'Which choice best describes the function of the underlined sentence in the text as a whole?',
 central:'Which choice best states the main idea of the text?',
 infer:'Which choice most logically completes the text?',
 conv:'Which choice completes the text so that it conforms to the conventions of Standard English?',
 trans:'Which choice completes the text with the most logical transition?'};
const BLANK='<span class="blank">______</span>';
// Serve an item: the least-seen at the asked difficulty first, choices shuffled.
function bankQ(id,d,avoid){let pool=RW.filter(x=>x.sk===id&&x.d===d&&!(avoid&&avoid.has(x.id)));if(!pool.length)pool=RW.filter(x=>x.sk===id&&!(avoid&&avoid.has(x.id))).sort((a,b)=>Math.abs(a.d-d)-Math.abs(b.d-d)).filter((x,_,a)=>Math.abs(x.d-d)===Math.abs(a[0].d-d));
 if(!pool.length&&!avoid)pool=RW.filter(x=>x.sk===id);if(!pool.length)return null;
 const seen=x=>S.seenItem[x.id]||0;const low=Math.min(...pool.map(seen));const it=pick(pool.filter(x=>seen(x)===low));return serveItem(it)}
const itemById=id=>RW.find(x=>x.id===id);
function serveItem(it){S.seenItem[it.id]=(S.seenItem[it.id]||0)+1;
 const order=shuf([0,1,2,3]);const ch=order.map(i=>it.ch[i]);
 const pas=(it.t2?`<div class="t2"><div class="tlab">Text 1</div>${it.p}</div><div class="t2"><div class="tlab">Text 2</div>${it.t2}</div>`:`<div class="ptx">${it.p}</div>`)+(it.fig||'');
 return {type:'mc',q:it.q||STEM[it.stem||'']||'',pas,ch,a:order.indexOf(it.a||0),exp:it.e,rid:it.id,diff:it.d}}

skill('rw_wic',{t:'Words in context',dom:'cs',phase:1,
 lesson:lesson('The blank needs the word that fits the meaning of the whole text, precisely. Do not pick or avoid a word because it looks hard: on hard questions the answer is often the least familiar word, and it is always the one whose exact meaning matches the clues.',
  ['Cover the choices. Read the text and say your own word for the blank.','Find the clue: a contrast ("however," "although"), a restatement after a colon, or a cause ("because").','Check the tone: does the text praise, criticize, or stay neutral?','Test each choice in the sentence. Wrong answers often fit the general topic but not the precise meaning.'],
  ['Choosing a word that is related to the topic but not to the logic of the sentence.','Choosing the opposite because you missed a contrast word.'])});
skill('rw_struct',{t:'Text structure and purpose',dom:'cs',phase:2,
 lesson:lesson('These questions ask what a sentence does in the text, or how the whole text is built. They are about function, not content.',
  ['Name the job in your own words first: introduces a claim, gives an example, raises an objection, answers it, draws a conclusion.','For the whole text: describe it in two steps ("presents a view, then challenges it").','Check every word of a choice. One wrong verb ("proves," "rejects") makes it wrong.'],
  ['Choosing a choice that accurately restates the content but names the wrong function.','Picking extreme words such as "disproves" when the text only questions.'])});
skill('rw_cross',{t:'Cross-text connections',dom:'cs',phase:2,
 lesson:lesson('Two short texts discuss the same topic. You decide how one author would respond to the other.',
  ['Summarize each text in one sentence, including its attitude.','Find the exact point where they meet: does Text 2 agree, add a condition, or disagree?','The right answer is usually measured: "would argue that the finding applies only in some cases."'],
  ['Answering from Text 1\'s point of view when the question asks about Text 2.','Assuming total disagreement when the second author only adds a qualification.'])});
skill('rw_central',{t:'Central ideas and details',dom:'ii',phase:1,
 lesson:lesson('The main idea is what the whole text is about, not one detail. Detail questions ask what the text actually says.',
  ['After reading, say the point in one sentence before you look at the choices.','Too narrow (one detail) and too broad (more than the text shows) are the usual traps.','For a detail question ("According to the text…"), find the sentence that states the answer. Reject a choice the text never says, even if it is true in real life.'],
  ['Choosing a true detail that is not the main idea.','Choosing something that sounds reasonable but the text never says.'])});
skill('rw_evidT',{t:'Command of evidence: textual',dom:'ii',phase:2,
 lesson:lesson('You pick the finding or quotation that best supports (or weakens) a claim.',
  ['Restate the claim in your own words. What exactly must the evidence show?','A strong choice matches both parts of the claim, not just the topic.','For "weaken" questions, the finding must cut against the specific claim.'],
  ['Choosing evidence about the right topic that does not bear on the specific claim.','Choosing a quotation that mentions the same words as the claim but a different idea.'])});
skill('rw_evidQ',{t:'Command of evidence: quantitative',dom:'ii',phase:1,
 lesson:lesson('A table or graph goes with the text. The right answer uses the data accurately and completes the text\'s specific point.',
  ['Read the text\'s claim first, then find the part of the table or graph that tests it.','Check units, labels, and which group each number belongs to.','A choice can be true about the data and still not support the claim.'],
  ['Reading the wrong row, column, or year.','Picking a true statement about the data that does not complete the sentence\'s logic.'])});
skill('rw_infer',{t:'Inferences',dom:'ii',phase:2,
 lesson:lesson('The text stops before its conclusion. Choose the ending that follows logically from what is stated, and nothing more.',
  ['Map the reasoning: what is known, what is ruled out, what is left.','The answer must be supported, not merely possible.','Watch for choices that go further than the evidence ("proves," "all").'],
  ['Picking something true in real life that the text does not support.','Choosing an extreme conclusion when the text supports a modest one.'])});
skill('rw_bound',{t:'Boundaries: punctuation between clauses',dom:'sec',phase:1,
 lesson:lesson('These questions test how sentences and clauses are joined or separated.',
  ['Two complete sentences (independent clauses) can be joined by a period, a semicolon, or a comma plus <i>and, but, or, so, for, nor, yet</i>. A comma alone is a comma splice.','A colon follows a complete sentence and introduces an explanation, list, or example.','Do not put a comma between a subject and its verb, or between a verb and its object.','Dashes and commas that set off extra information must come in matching pairs.','"However," "therefore," and "for example" are not conjunctions. "…had rusted, however, engineers…" is still a comma splice; put a semicolon or a period before them.','A word such as <i>because, although, while,</i> or <i>when</i> makes a clause dependent. Attach it with a comma or nothing, never a semicolon.'],
  ['Choosing a comma between two complete sentences.','Using a semicolon before a phrase that is not a complete sentence.'],null,
  ex('The cables had rusted, engineers recommended replacing them.','Both halves are complete sentences, so a comma alone is a comma splice. Fix it with a semicolon ("rusted; engineers"), a period, or a comma plus <i>so</i> ("rusted, so engineers").'))});
skill('rw_form',{t:'Form, structure and sense',dom:'sec',phase:1,
 lesson:lesson('These questions test agreement, verb forms, pronouns, possessives, and modifiers.',
  ['Find the true subject; ignore phrases between the subject and verb ("The <u>list</u> of names <u>is</u>").','Pronouns must agree with their nouns: a company is "it," the members are "they."','Possessive: the dog\'s bowl (one dog), the dogs\' bowls (several). "Its" is possessive; "it\'s" means "it is."','A modifier at the start of a sentence describes the noun right after the comma.','Keep verb tense consistent with the time the text describes.','Every sentence needs a main verb. "The study, conducted in 2019, showing that…" has none: choices ending in <i>-ing</i> or starting with <i>to</i> often leave a fragment.','Use <i>who</i> for people and <i>which</i> or <i>that</i> for things. Items in a list should share the same form: "reading, writing, and speaking," not "reading, writing, and to speak."'],
  ['Matching the verb to the nearest noun instead of the subject.','Using "their" for a single group noun such as "the team."'])});
skill('rw_trans',{t:'Transitions',dom:'ei',phase:1,
 lesson:lesson('Choose the transition that states the real relationship between the ideas.',
  ['Read the sentence before the blank and the one containing it. Name the relationship: contrast, continuation, example, cause and effect, or sequence.','Contrast: however, nevertheless, by contrast. Addition: moreover, furthermore, in addition. Comparison: similarly, likewise. Result: therefore, consequently, thus. Example: for instance. Sequence: then, subsequently, finally.','Two choices with the same meaning cannot both be right, so both are wrong.'],
  ['Picking a transition by feel. Name the relationship first.','Choosing "for example" when the sentence restates rather than illustrates.'])});
skill('rw_synth',{t:'Rhetorical synthesis',dom:'ei',phase:2,
 lesson:lesson('You get a student\'s bulleted notes and a goal. The answer is the sentence that accomplishes that exact goal using the notes.',
  ['Read the goal first and underline its key words ("emphasize a difference," "introduce to an audience unfamiliar with…").','Every choice may be accurate. Pick the one that does what the goal asks.','For "unfamiliar audience" goals, the right choice explains or identifies, not just names.'],
  ['Choosing the sentence with the most information rather than the one that meets the goal.','Emphasizing a similarity when the goal asks for a difference.'])});

// ===== READING AND WRITING ITEMS, PART 1 =====
// The first choice listed is always the key; choices are shuffled when served.
// ---- Words in context ----
[
{id:'wic01',d:1,p:`Marine biologist Sylvia Earle has spent more than 7,000 hours underwater. Her ${BLANK} to exploring and protecting the ocean has earned her the nickname "Her Deepness."`,ch:['devotion','indifference','resistance','proximity'],e:'The text describes more than 7,000 hours underwater and a nickname that honors her work, so the blank must mean deep commitment: "devotion." "Indifference" and "resistance" say the opposite.'},
{id:'wic02',d:1,p:`Because the old bridge had become ${BLANK}, engineers closed it to traffic until repairs could make it safe again.`,ch:[`unstable`,`obsolete`,`congested`,`ornate`],e:`The bridge was closed until repairs could make it "safe again," so it had become unsafe: "unstable." A bridge that was outdated, crowded, or highly decorated would not need repairs to be safe.`},
{id:'wic03',d:1,p:`The festival's organizers were ${BLANK} about attendance: they printed twice as many programs as the year before, confident that the crowds would be larger.`,ch:['optimistic','uncertain','secretive','careless'],e:'The colon explains the blank: they were "confident" crowds would grow and printed extra programs. That is "optimistic."'},
{id:'wic04',d:2,p:`Although the novelist's early books received harsh reviews, her later work was so widely praised that several critics began to ${BLANK} their first judgments, admitting that they had misread her ambitions.`,ch:['revise','confirm','publish','overlook'],e:'Critics admitted they "had misread her ambitions," so they changed their earlier judgments: "revise." "Confirm" is the opposite.'},
{id:'wic05',d:2,p:`The readings from the weather station were ${BLANK}: some sensors showed a sharp rise in temperature while others, recording at the same moment, showed a drop, so the team could draw no firm conclusion.`,ch:['contradictory','comprehensive','predictable','conclusive'],e:'Readings that disagree, leaving "no firm conclusion," are "contradictory." "Conclusive" is the opposite.'},
{id:'wic06',d:2,p:`Historians once assumed that the ancient trade network was small and local, but newly discovered records ${BLANK} that view, showing goods moving across hundreds of miles.`,ch:['challenge','echo','illustrate','anticipate'],e:'The word "but" signals a contrast: records showing long-distance trade go against the old view, so they "challenge" it.'},
{id:'wic07',d:2,p:`Octopuses can change both the color and the texture of their skin in a fraction of a second, a capacity so ${BLANK} that engineers are studying it to design new camouflage materials.`,ch:['remarkable','ordinary','gradual','harmful'],e:'Something engineers want to copy, which happens "in a fraction of a second," is exceptional: "remarkable." "Gradual" contradicts the speed.'},
{id:'wic08',d:3,p:`Rather than dismissing traditional remedies outright, the pharmacologist treated them as leads worth testing, an approach that was ${BLANK} without being gullible: open to the possibility that a remedy worked, yet unwilling to accept any claim without evidence.`,ch:[`receptive`,`dismissive`,`rigid`,`credulous`],e:'The colon defines the blank as "open to the possibility," while "without being gullible" adds the limit. "Receptive" means open to ideas. "Dismissive" contradicts "rather than dismissing," and "credulous" means too ready to believe, the gullibility the text rules out.'},
{id:'wic09',d:2,p:`The committee's report was notably ${BLANK}: it described each of the options available to the city but declined to recommend any of them.`,ch:['noncommittal','decisive','persuasive','inaccurate'],e:'A report that lays out options but "declined to recommend any of them" avoids taking a position: "noncommittal." "Decisive" is the opposite.'},
{id:'wic10',d:3,p:`In her study of nineteenth-century letters, the historian argues that everyday correspondence, long dismissed as too ${BLANK} to reveal much about political life, in fact records how ordinary people discussed the great debates of their time.`,ch:['mundane','controversial','fragile','eloquent'],e:'Letters "long dismissed" as revealing little about politics were thought too ordinary: "mundane." The contrast "in fact records" shows they turned out to matter.'},
{id:'wic11',d:1,p:`The new library's tall windows let in so much sunlight that the reading rooms rarely need ${BLANK} lighting during the day.`,ch:[`additional`,`decorative`,`permanent`,`portable`],e:`Plenty of sunlight means little need for extra lamps: "additional" lighting. Nothing in the text is about how the lighting looks, whether it is fixed in place, or whether it can be moved.`},
{id:'wic12',d:2,p:`The chef's recipes look simple on the page, but each is the product of ${BLANK} testing; she may prepare a single dish dozens of times before she is satisfied.`,ch:['meticulous','hasty','occasional','reluctant'],e:'Making a dish "dozens of times" until satisfied shows extremely careful work: "meticulous." "Hasty" is the opposite.'},
].forEach(x=>item(Object.assign({sk:'rw_wic',stem:'wic'},x)));

// ---- Central ideas and details ----
[
{id:'cen01',d:1,p:'Naked mole-rats live in large underground colonies in East Africa. Most rodents live only a few years, but naked mole-rats can live for more than thirty, and they rarely develop cancer. Scientists study them in the hope of learning how these animals resist many of the diseases of aging.',ch:[`Naked mole-rats have unusual traits that make them valuable subjects for research on aging.`,`Naked mole-rats live in large underground colonies in East Africa, where they are protected from predators.`,`Most rodents develop cancer as they grow older, which is why they live for only a few years.`,`Scientists have already learned how to prevent the diseases of aging by studying naked mole-rats.`],e:'The text moves from the mole-rats\' long lives and cancer resistance to why scientists study them. The colony detail is too narrow, and the last choice claims far more than the text says.'},
{id:'cen02',d:1,p:'In the 1920s and 1930s, the writer and anthropologist Zora Neale Hurston traveled through the American South and the Caribbean recording folktales, songs, and sayings. Many of these stories had been passed down by word of mouth for generations and had never been written down. Her collections, including <i>Mules and Men</i> (1935), preserved a rich oral tradition that might otherwise have been lost.',ch:['Hurston\'s recordings preserved stories that had existed only in spoken form.','Hurston wrote novels set in the American South.','Folktales in the Caribbean were more varied than those in the South.','Oral traditions usually disappear within a single generation.'],e:'The text centers on Hurston writing down stories that had been passed along only by word of mouth. It never discusses her novels or compares regions.'},
{id:'cen03',d:2,p:'The following text is from a short story.<br>For weeks, Tomas had rehearsed what he would say to the orchestra director. He practiced in front of the mirror, recited it on the bus, and even whispered it to the cat. Yet when the director finally turned to him after rehearsal and asked what he needed, Tomas heard himself say only, "Nothing, thank you," and watched her walk away.',ch:[`Despite long preparation, Tomas fails to say what he intended when the moment comes.`,`Tomas decides that he no longer needs anything from the director after weeks of practicing his speech.`,`The director is unwilling to listen to Tomas's request and walks away before he can speak.`,`Tomas practices his speech in several unusual places, including on the bus and in front of the cat.`],e:'The story builds up his rehearsals and then shows him freezing ("heard himself say only"). Nothing suggests he changed his mind or that the director refused to listen. The places he practiced are a detail.'},
{id:'cen04',d:2,p:'Cities are often several degrees warmer than the surrounding countryside, a pattern known as the urban heat island effect. Pavement and rooftops absorb sunlight during the day and release the stored heat at night, and the lack of trees means less shade and less cooling from evaporation. Some cities have responded by planting trees and installing roofs that reflect sunlight.',ch:[`Cities tend to be warmer than nearby areas because of how they are built, and some are acting to reduce the effect.`,`Pavement absorbs more sunlight than any other material, which is why many cities have stopped building new roads.`,`Planting trees is the only way to cool a city, so cities that plant trees no longer have a heat problem.`,`The countryside around cities is slowly becoming warmer because heat escapes from nearby urban areas.`],e:'The text defines the effect, explains its causes (pavement, roofs, few trees), and notes responses. The other choices are unsupported or too extreme.'},
{id:'cen05',d:2,p:'In a series of experiments, psychologists Daniel Kahneman and Amos Tversky found that people often react more strongly to losses than to gains of the same size: losing $50 tends to feel worse than winning $50 feels good. This tendency, known as loss aversion, helps explain why people sometimes turn down bets that would, on average, leave them better off.',ch:[`People tend to weigh losses more heavily than equal gains, which can lead them to reject favorable bets.`,`People are generally unable to judge whether a bet is fair, so they turn down most of the bets they are offered.`,`Winning money makes people less willing to take risks later, because they want to protect what they have won.`,`Kahneman and Tversky studied how people spend money they win, finding that most of it is spent within days.`],e:'The text defines loss aversion and uses it to explain why people refuse favorable bets. It does not say people cannot judge bets.'},
{id:'cen06',d:3,p:'Göbekli Tepe, a site in southeastern Turkey, contains massive carved stone pillars that were raised roughly 11,000 years ago, before the invention of writing or pottery and apparently before farming took hold in the region. Many scholars had assumed that large monuments could be built only by settled farming societies with surplus food. The site suggests that the drive to gather and build may have come before agriculture rather than after it.',ch:[`Göbekli Tepe challenges the assumption that monument building followed the development of farming.`,`Göbekli Tepe was built by the first farmers in the region, who used their surplus food to pay the builders.`,`Writing and pottery were invented at Göbekli Tepe so that its builders could record their plans and store supplies.`,`Large monuments were common throughout the ancient world long before anyone settled in southeastern Turkey.`],e:'The text contrasts an old assumption (monuments came after farming) with what the site suggests (building may have come first). The second choice contradicts the text.'},
{id:'cen07',d:3,p:'The following text is from an essay about walking in a city.<br>I used to walk the same route to work every morning, head down, counting the minutes. Only when a road closure forced me onto an unfamiliar street did I notice the bakery with its hand-painted sign, the mural of a heron on a laundromat wall, the old man who greeted every passerby by name. The detour added four minutes to my commute. I have taken it ever since.',ch:[`An unplanned change of route led the narrator to value the details of the city more than saving time.`,`The narrator is frustrated that a road closure made the commute longer and hopes the usual route reopens soon.`,`The narrator prefers walking to work over other ways of commuting because walking is healthier and cheaper.`,`The narrator decides to open a bakery on the new street after admiring the one with the hand-painted sign.`],e:'The narrator notices things only on the detour and keeps taking it even though it is four minutes longer, which shows the details now matter more than speed.'},
{id:'cen08',d:1,p:'The International Space Station orbits Earth about once every 90 minutes, so the astronauts aboard see roughly sixteen sunrises and sunsets each day. To keep their bodies on a regular schedule, crews follow a fixed timetable for sleeping, eating, and working, and the station uses lights that can change color over the course of a day.',ch:[`Astronauts rely on fixed schedules and adjustable lighting to keep a steady daily rhythm despite the station's rapid orbit.`,`The International Space Station orbits Earth once each day, so astronauts see a single sunrise and sunset, as people on the ground do.`,`Astronauts see more sunrises in a single day than most people on Earth see in a week, and they find this exciting.`,`Astronauts on the station have found that they no longer need regular sleep while they are in orbit.`],e:'The fast orbit creates many sunrises, and the text explains how crews keep a steady routine. The third choice contradicts "every 90 minutes."'},
{id:'cen09',d:2,p:'Each fall, millions of monarch butterflies travel from Canada and the United States to forests in central Mexico, a journey of up to about 3,000 miles. Remarkably, the butterflies that fly south have never been to Mexico: they are several generations removed from the monarchs that left Mexico the spring before. Researchers believe the butterflies find their way using the position of the sun together with an internal clock.',ch:[`Monarchs migrate to a place they have never been, apparently guided by the sun and an internal clock.`,`Monarch butterflies live for several generations, and each generation makes the full trip between Canada and Mexico.`,`Monarch butterflies spend the summer in the forests of central Mexico and travel north to Canada each fall.`,`Researchers have tracked individual monarchs on the entire journey from Canada to Mexico and back again.`],e:'The key idea is a long trip to an unvisited destination and how monarchs navigate. The other choices misstate or go beyond the text.'},
{id:'cen10',d:3,p:'Working at the Harvard College Observatory in the early 1900s, Henrietta Swan Leavitt studied thousands of stars whose brightness rises and falls in a regular cycle. She noticed that the brighter stars of this type took longer to complete a cycle. Because the length of the cycle revealed how bright such a star truly is, astronomers could compare that true brightness with how bright the star appears from Earth and work out its distance.',ch:[`Leavitt's discovery of a link between a star's brightness and its cycle gave astronomers a way to measure distances in space.`,`Leavitt was the first person to observe stars whose brightness rises and falls, and she gave this type of star its name.`,`Stars that appear bright from Earth are always close to Earth, while stars that appear faint are always far away.`,`The Harvard College Observatory studied only stars that change in brightness, and it hired Leavitt to count them.`],e:'The text builds to the use of Leavitt\'s finding: measuring distance. It never says she was first to see variable stars, and the third choice contradicts the logic of the text.'},
{id:'cen11',d:1,q:'According to the text, what did the ecologists find about cavity nests?',p:'In one study, ecologists placed small temperature sensors in 40 bird nests built inside tree cavities and 40 built in the open. Over a single summer, the cavity nests stayed on average 4°C cooler during the hottest hours of the day, and chicks in those nests gained weight faster. The researchers suggest that as summers grow hotter, species that nest in cavities may have an advantage over species that build open nests.',ch:[`They stayed cooler than open nests during the hottest part of the day.`,`They were built by more species than open nests were.`,`They were more likely to be abandoned during hot weather.`,`They held more chicks on average than open nests did.`],e:'The text states that cavity nests "stayed on average 4°C cooler during the hottest hours of the day." The other choices are never stated: the text says nothing about how many species, about abandonment, or about the number of chicks.'},
{id:'cen12',d:2,q:'According to the text, what was one effect of the Erie Canal?',p:'When the Erie Canal opened in 1825, it linked the Hudson River to Lake Erie, giving farmers in the Midwest a water route to New York City. Before the canal, moving a ton of grain overland from Buffalo to New York cost about $100 and took weeks; by canal it cost under $10. Within a decade New York had become the busiest port in the United States, and towns along the canal\'s route grew rapidly.',ch:[`Shipping grain from Buffalo to New York became far cheaper.`,`Farmers in the Midwest began growing grain for the first time.`,`The Hudson River became navigable for the first time.`,`New York City\'s population declined as towns along the canal grew.`],e:'The text gives the cost of moving a ton of grain falling from about $100 to under $10. Nothing says farmers started growing grain, that the Hudson became navigable, or that New York\'s population fell; the text says the city became the busiest port.'},
{id:'cen13',d:2,q:'According to the text, why does Priya keep the letter?',p:'The following text is from a short story.<br>Priya had read the letter so many times that she no longer needed to look at it. Still, she kept it folded in the front pocket of her bag, not because she expected to read it again but because throwing it away felt like agreeing with what it said. As long as it stayed with her, she told herself, the decision was not final.',ch:[`Discarding it would feel like accepting its message.`,`She plans to read it again when she has more time.`,`She intends to answer it once she decides what to say.`,`It contains details she has not yet memorized.`],e:'"Throwing it away felt like agreeing with what it said," so she keeps it to avoid that. The text says she does not expect to read it again and already knows it by heart, and it says nothing about answering it.'},
{id:'cen14',d:3,q:'Based on the text, what is true of carbon dioxide concentrations over the past 800,000 years?',p:'Ice cores drilled from the Antarctic ice sheet contain tiny bubbles of air trapped when each layer of snow fell. By measuring the carbon dioxide in bubbles from different depths, scientists have reconstructed the gas\'s concentration in the atmosphere over the past 800,000 years. The record shows that concentrations rose and fell with the ice ages but never exceeded about 300 parts per million until the industrial era. Today\'s level is above 400.',ch:[`Until the industrial era they never rose above roughly 300 parts per million.`,`They stayed nearly constant until the industrial era.`,`They were highest during the ice ages.`,`They can be measured only in the most recently formed layers of ice.`],e:'The text says concentrations "never exceeded about 300 parts per million until the industrial era." They "rose and fell," so they were not constant; the text does not say they peaked during ice ages; and the record comes from "different depths," not only recent layers.'},
].forEach(x=>item(Object.assign({sk:'rw_central',stem:'central'},x)));

// ---- Command of evidence: quantitative ----
[
{id:'evq01',d:1,p:`A student surveyed students at one school about their average daily screen time. Looking at the results, the student noted that average screen time ${BLANK}`,fig:table(['Grade','Average daily screen time (hours)'],[['6','3.1'],['8','3.9'],['10','4.6'],['12','5.2']]),q:'Which choice most effectively uses data from the table to complete the statement?',ch:[`increased with each higher grade shown in the table.`,`was highest for students in grade 8 and lowest for students in grade 12.`,`was about the same for students in every grade included in the survey.`,`decreased steadily for students in the grades after grade 10.`],e:'The values rise from 3.1 to 3.9 to 4.6 to 5.2 hours: an increase at each grade shown. Grade 12, not grade 8, is highest.'},
{id:'evq02',d:1,p:`A Martian day, called a sol, is only slightly longer than a day on Earth. As the table shows, a sol lasts about ${BLANK}`,fig:table(['Planet','Length of one day (hours)'],[['Venus','2,802'],['Earth','24.0'],['Mars','24.7'],['Jupiter','9.9']]),q:'Which choice most effectively uses data from the table to complete the statement?',ch:[`24.7 hours.`,`24.0 hours.`,`9.9 hours.`,`2,802 hours.`],e:`The row for Mars gives 24.7 hours, slightly longer than Earth's 24.0.`},
{id:'evq03',d:2,p:'An ecologist hypothesized that bees more often visit flowers that hold more nectar. She measured the average nectar in four flower types and counted bee visits.',fig:table(['Flower type','Average nectar (microliters)','Bee visits per hour'],[['A','1.2','14'],['B','3.5','31'],['C','0.8','9'],['D','2.6','24']]),q:'Which choice most effectively uses data from the table to support the ecologist\'s hypothesis?',ch:[`Flower B had the most nectar and the most visits, and flower C had the least nectar and the fewest visits.`,`Flower D received 24 bee visits per hour, which was fewer than flower B received but more than flower A.`,`Flower A held more nectar than flower C did, and it held less nectar than flowers B and D did.`,`Flower B held about three times as much nectar as flower A, the flower with the second-lowest amount.`],e:'The hypothesis links nectar to visits, so the evidence must mention both. Only the first choice shows that more nectar goes with more visits at both ends of the range.'},
{id:'evq04',d:2,p:'A city planner claims that, for trips into downtown, cycling can be just as quick as driving.',fig:barChart(['Car','Bicycle','Bus','Walking'],[24,22,35,48],'Average trip time into downtown','Minutes',{values:true}),q:'Which choice most effectively uses data from the graph to support the planner\'s claim?',ch:[`The average bicycle trip took 22 minutes, compared with 24 minutes for the average car trip.`,`The average bus trip into downtown took 35 minutes, longer than the average trip by car or by bicycle.`,`Walking took longer on average than any other way of traveling into downtown that the graph shows.`,`The average car trip into downtown took less time than the average bus trip into downtown.`],e:'The claim compares cycling with driving. Only the first choice gives both of those values, and it shows cycling was slightly faster.'},
{id:'evq05',d:3,p:'A researcher claims that the more sleep students get, the higher they tend to score on tests.',fig:table(['Average nightly sleep','Average test score'],[['Less than 6 hours','71'],['6 to 7 hours','78'],['7 to 8 hours','84'],['More than 8 hours','79']]),q:'Which choice best describes data from the table that weaken the researcher\'s claim?',ch:[`Students who slept more than 8 hours scored lower on average than those who slept 7 to 8 hours.`,`Students who slept less than 6 hours had the lowest average score of any group in the table.`,`Students who slept 7 to 8 hours scored higher on average than those who slept 6 to 7 hours.`,`The average score for every group in the table was above 70, even for the group that slept least.`],e:`The claim says that scores rise as sleep increases. The only data that cut against it: the group sleeping the most (more than 8 hours) scored lower than the 7-to-8-hour group. The other choices fit the claim or do not bear on it.`},
{id:'evq06',d:2,p:`A gardener tested how much of a fertilizer to use on tomato plants. She concluded that adding fertilizer increased plant height only up to a point: ${BLANK}`,fig:table(['Fertilizer per plant (grams)','Average height after 8 weeks (cm)'],[['0','62'],['10','75'],['20','86'],['30','85'],['40','84']]),q:'Which choice most effectively uses data from the table to complete the statement?',ch:[`plants given 20 grams grew to 86 cm on average, while plants given 30 or 40 grams did not grow any taller.`,`plants given no fertilizer grew to an average height of 62 cm, the shortest average height in the table.`,`plants given 10 grams of fertilizer grew taller on average than plants that were given no fertilizer at all.`,`every group of plants that received any fertilizer grew to an average height of at least 75 cm.`],e:'"Only up to a point" means height rose and then stopped rising. The first choice shows the rise to 86 cm at 20 grams and no gain after. The others show only the increase.'},
{id:'evq07',d:3,p:'Biologists compared how quickly the eggs of two frog species hatched at two water temperatures. They concluded that warmer water sped up hatching much more for species X than for species Y.',fig:table(['Species','Days to hatch at 20°C','Days to hatch at 26°C'],[['X','30','18'],['Y','24','20']]),q:'Which choice most effectively uses data from the table to support the biologists\' conclusion?',ch:[`Species X hatched 12 days sooner at 26°C than at 20°C, while species Y hatched only 4 days sooner.`,`Species Y hatched faster than species X at 20°C, taking 24 days compared with 30 days for species X.`,`Both species took fewer days to hatch at 26°C than they did at 20°C, the cooler of the two temperatures.`,`Species X took 18 days to hatch at 26°C, which was fewer days than species Y took at 20°C.`],e:'The conclusion compares the size of the change for each species. Only the first choice gives both changes (12 days vs. 4 days).'},
{id:'evq08',d:1,p:`Volunteers counted birds at a wetland every spring. The count shows that the number of herons ${BLANK}`,fig:table(['Year','Herons counted'],[['2021','48'],['2022','55'],['2023','61'],['2024','70']]),q:'Which choice most effectively uses data from the table to complete the statement?',ch:['rose each year from 2021 to 2024.','fell sharply after 2022.','stayed the same from 2022 to 2023.','was highest in 2021.'],e:'The counts go 48, 55, 61, 70: higher every year.'},
{id:'evq09',d:2,p:'A museum surveyed visitors about two kinds of exhibits. The museum\'s director argues that visitors enjoy hands-on exhibits more than exhibits they can only look at.',fig:table(['Exhibit type','Visitors rating it "excellent"','Average minutes spent'],[['Hands-on','68%','22'],['Display only','41%','12']]),q:'Which choice most effectively uses data from the table to support the director\'s argument?',ch:[`68% of visitors rated hands-on exhibits excellent, compared with 41% for display-only exhibits.`,`Visitors spent an average of 12 minutes at display-only exhibits, according to the museum's survey.`,`Some visitors rated the display-only exhibits excellent, although fewer than half of them did so.`,`The museum's survey asked visitors about two different kinds of exhibits and how long they stayed.`],e:'The argument is about enjoyment. The comparison of "excellent" ratings for both exhibit types supports it directly.'},
{id:'evq10',d:3,p:`An economist studied a town where a new rail line opened in 2020. She noted that ridership grew rapidly at first but then leveled off: ${BLANK}`,fig:table(['Year','Average weekday riders'],[['2020','1,200'],['2021','2,900'],['2022','3,600'],['2023','3,700'],['2024','3,650']]),q:'Which choice most effectively uses data from the table to complete the statement?',ch:[`ridership more than doubled from 2020 to 2021 but changed by no more than 100 riders a year from 2022 to 2024.`,`ridership reached 3,600 average weekday riders in 2022, which was more than in any earlier year.`,`ridership was lowest in 2020, the year the line opened, when it averaged 1,200 weekday riders.`,`ridership in 2024 was slightly lower than it was in 2023, falling by about 50 riders.`],e:`The statement has two parts: fast early growth and a later leveling off. Ridership rose from 1,200 to 2,900 (more than double) in the first year, then changed by only +100 and −50 in the last two years. Only the first choice supports both parts.`},
].forEach(x=>item(Object.assign({sk:'rw_evidQ'},x)));

// ---- Boundaries ----
[
{id:'bnd01',d:1,p:`The Great Barrier Reef is the largest coral reef system in the ${BLANK} stretches for more than 2,300 kilometers along the coast of Australia.`,ch:['world; it','world, it','world it','world, and, it'],e:'Both parts are complete sentences, so they need a semicolon (or a period). A comma alone is a comma splice, and no punctuation is a run-on.'},
{id:'bnd02',d:1,p:`Many desert plants store water in their thick stems and ${BLANK} adaptation helps them survive long dry seasons.`,ch:['leaves. This','leaves, this','leaves this','leaves; and this'],e:'"This adaptation helps them survive…" is a complete sentence, so a period is needed. A semicolon followed by "and" is not standard.'},
{id:'bnd03',d:2,p:`The traditional recipe calls for only three ${BLANK} flour, water, and salt.`,ch:['ingredients:','ingredients;','ingredients','ingredients; being'],e:'A colon after a complete sentence introduces a list. A semicolon cannot introduce a list.'},
{id:'bnd04',d:2,p:`The scientist who first described the ${BLANK} that it belonged to a previously unknown species.`,ch:['fossil argued','fossil, argued','fossil; argued','fossil: argued'],e:'The subject is "The scientist who first described the fossil," and the verb is "argued." No punctuation belongs between a subject and its verb.'},
{id:'bnd05',d:2,p:`Frida Kahlo, who was born in Mexico City in ${BLANK} often painted self-portraits filled with symbols drawn from Mexican culture.`,ch:['1907,','1907','1907;','1907—'],e:'The information "who was born in Mexico City in 1907" is set off by a pair of commas. The opening comma needs a matching comma, not a dash or semicolon.'},
{id:'bnd06',d:3,p:`In 1928, Alexander Fleming noticed that mold growing on a laboratory dish had killed the bacteria around ${BLANK} discovery eventually led to penicillin, one of the first antibiotics.`,ch:['it; this','it, this','it this','it, a'],e:`"a discovery eventually led to penicillin" is itself a complete sentence, so joining it to the first with only a comma is a comma splice, and with nothing is a run-on. A semicolon separates the two sentences correctly; "this discovery" then names what the second sentence is about.`},
{id:'bnd07',d:3,p:`Built in 1883 to carry horse-drawn wagons, the city's oldest bridge—repaired only twice in its ${BLANK} carries thousands of cars each day, a durability that engineers attribute to the unusually thick stone of its piers.`,ch:[`history—still`,`history, still`,`history; still`,`history still`],e:`The extra information "repaired only twice in its history" opened with a dash, so it must close with a dash. A comma, a semicolon, or nothing would leave the pair unmatched.`},
{id:'bnd08',d:1,p:`Sea otters wrap themselves in strands of kelp before they ${BLANK} anchor keeps them from drifting out to sea while they sleep.`,ch:[`sleep; the`,`sleep, the`,`sleep the`,`sleep, which the`],e:`Two complete sentences: a semicolon joins them. A comma alone makes a comma splice, nothing at all makes a run-on, and "which the anchor keeps" leaves the second part unfinished.`},
{id:'bnd09',d:2,p:`When the first snow of the season ${BLANK} children rushed outside with their sleds.`,ch:['arrived, the','arrived; the','arrived: the','arrived, and the'],e:'An introductory "when" clause is followed by a comma. A semicolon or colon would need a complete sentence before it, and "and" leaves the sentence without a main clause.'},
{id:'bnd10',d:3,p:`In a series of trials, the botanists raised seedlings under lamps of a single color, keeping water, soil, and temperature identical. The result was ${BLANK} seedlings grown under red light grew taller than those grown under blue light, though the blue-light seedlings had thicker stems.`,ch:['clear:','clear,','clear','clear; that'],e:`"The result was clear" is a complete sentence, and what follows explains the result, so a colon introduces it. A comma alone would join two complete sentences, and "clear; that" leaves a fragment after the semicolon.`},
{id:'bnd11',d:2,p:`The height of Mount Everest is usually given as 8,849 ${BLANK} figure based on a survey completed in 2020.`,ch:['meters, a','meters; a','meters. A','meters and a'],e:'"A figure based on a survey…" is a phrase that describes the number, not a complete sentence, so it follows a comma.'},
{id:'bnd12',d:1,p:`Wood frogs can survive being frozen solid through the ${BLANK} spring, they thaw out and hop away.`,ch:['winter. In','winter, in','winter in','winter: and in'],e:'"In spring, they thaw out and hop away" is a complete sentence, so a period separates it from the first.'},
].forEach(x=>item(Object.assign({sk:'rw_bound',stem:'conv'},x)));

// ---- Form, structure and sense ----
[
{id:'frm01',d:1,p:`The collection of rare books in the university's library ${BLANK} more than 5,000 volumes.`,ch:['includes','include','are including','have included'],e:'The subject is "collection," which is singular, so the verb is "includes." "Books" and "library" are inside phrases.'},
{id:'frm02',d:1,p:`The company announced that ${BLANK} new headquarters would open in March.`,ch:['its','it\'s','their','its\''],e:'"The company" is singular, and the headquarters belong to it, so the possessive "its" is correct. "It\'s" means "it is."'},
{id:'frm03',d:3,p:`In the painting's foreground, along the riverbank, ${BLANK} several old willow trees whose branches trail in the water.`,ch:['stand','stands','is standing','has stood'],e:`The subject comes after the verb: "several old willow trees." A plural subject takes the plural verb "stand," even though the singular noun "riverbank" comes just before the blank.`},
{id:'frm04',d:2,p:`When the orchestra finished ${BLANK} final piece, the audience rose to applaud.`,ch:['its','their','it\'s','they\'re'],e:'"Orchestra" is a single group, so the possessive is "its."'},
{id:'frm05',d:1,p:`In July 1969, the Apollo 11 lunar module ${BLANK} on the Moon, and Neil Armstrong became the first person to walk on its surface.`,ch:['landed','lands','has landed','will land'],e:'The event happened in 1969, and the sentence continues in the past ("became"), so the past tense "landed" is correct.'},
{id:'frm06',d:3,p:`Having studied the fossil for months, comparing its jaw and teeth with those of every known species in the museum's collection, ${BLANK}`,ch:['the paleontologist concluded that it belonged to a new species.','the fossil was identified by the paleontologist as a new species.','a new species was what the paleontologist concluded it was.','it was concluded by the paleontologist that the fossil was new.'],e:`The opening phrase describes someone who studied the fossil, so the noun right after the comma must be that person: "the paleontologist." The other choices make the fossil, a species, or "it" the one who did the studying.`},
{id:'frm07',d:2,p:`Both ${BLANK} projects won awards at the regional science fair.`,ch:['students\'','student\'s','students','students\'s'],e:'"Both" means two students, and the projects belong to them: the plural possessive "students\'."'},
{id:'frm08',d:3,p:`Each of the forty paintings in the museum's new exhibit of Dutch still lifes ${BLANK} a small card describing the pigments the artist used and where they were obtained.`,ch:['has','have','are having','were having'],e:`The subject is "each," which is singular; "paintings" and "still lifes" sit inside prepositional phrases. So the verb is "has."`},
{id:'frm09',d:2,p:`By the time the rescue team arrived at the campsite, the stranded hikers ${BLANK} for nearly two days.`,ch:['had waited','have waited','will have waited','wait'],e:'The waiting happened before another past event (the team arrived), so the past perfect "had waited" is correct.'},
{id:'frm10',d:3,p:`When the storm rolled in during the second half of the regional final, neither the coach nor the players ${BLANK} ready for the sudden change in the weather, and the game was delayed for nearly an hour.`,ch:['were','was','is','has been'],e:`With "neither … nor," the verb agrees with the nearer subject, "the players," which is plural, and the past tense matches "rolled in" and "was delayed": "were."`},
{id:'frm11',d:1,p:`Engineers found that there ${BLANK} several reasons the old bridge had to be closed.`,ch:['were','was','is','has been'],e:'The subject comes after the verb: "several reasons," which is plural. The sentence is in the past ("found," "had to be"), so "were."'},
{id:'frm12',d:2,p:`After months of interviews, the committee released ${BLANK} final report on Tuesday.`,ch:[`its`,`it's`,`their`,`its'`],e:`"Its" is the possessive. "It's" means "it is," "their" is plural but "committee" is singular, and "its'" is not a word.`},
].forEach(x=>item(Object.assign({sk:'rw_form',stem:'conv'},x)));

// ---- Transitions ----
[
{id:'trn01',d:1,p:`Most bats are active at night. ${BLANK} the Samoan flying fox often searches for fruit during the day.`,ch:['However,','Similarly,','For example,','Therefore,'],e:'A day-active bat contrasts with bats that are active at night: "However."'},
{id:'trn02',d:1,p:`Some animals use tools to get food. ${BLANK} sea otters use rocks to crack open the shells of clams and mussels.`,ch:['For example,','However,','In contrast,','Finally,'],e:'Sea otters using rocks is an example of animals using tools.'},
{id:'trn03',d:1,p:`Ice covered the roads early in the morning. ${BLANK} the school opened two hours late.`,ch:['As a result,','Nevertheless,','For instance,','Similarly,'],e:'The ice caused the late opening: cause and effect, "As a result."'},
{id:'trn04',d:2,p:`Solar panels can reduce a household's electricity bills. ${BLANK} they can raise the value of a home when it is sold.`,ch:['Moreover,','Instead,','Otherwise,','In other words,'],e:'The second sentence adds another benefit: "Moreover." "In other words" would signal a restatement, but raising home value is a new point.'},
{id:'trn05',d:2,p:`The chemist first dissolved the salt in water. ${BLANK} she heated the solution until crystals began to form.`,ch:['Next,','In contrast,','For example,','Likewise,'],e:'The steps happen in order: "Next."'},
{id:'trn06',d:2,p:`The first version of the app was slow and difficult to use. ${BLANK} it attracted thousands of users who saw promise in its central idea.`,ch:['Even so,','Consequently,','Similarly,','Specifically,'],e:'Attracting users despite being slow and difficult is a concession: "Even so." "Consequently" would say the problems caused the popularity.'},
{id:'trn07',d:3,p:`Under the museum's new policy, the admission fee is waived on the first Sunday of every month, a change the director hopes will draw families who have never visited. ${BLANK} on twelve days a year, anyone can see the entire collection at no cost.`,ch:['In other words,','Nonetheless,','By contrast,','Previously,'],e:`The second sentence restates the policy in plainer terms: "In other words."`},
{id:'trn08',d:3,p:`When the architect's glass-and-steel towers first rose in the 1950s, critics dismissed them as cold, impractical, and out of place among the city's brick facades. ${BLANK} the same towers are now protected as landmarks and appear on the covers of guidebooks.`,ch:['Over time, however,','Likewise,','For this reason,','In addition,'],e:`The towers went from dismissed to admired: a contrast over time, "Over time, however."`},
{id:'trn09',d:2,p:`Some cities have found ways to reuse industrial buildings that had stood empty for decades. ${BLANK} a former grain silo in Cape Town, South Africa, now houses a museum of contemporary African art.`,ch:[`For example,`,`In contrast,`,`As a result,`,`Nevertheless,`],e:`The silo is one specific case of the general statement before it: "For example."`},
{id:'trn10',d:1,p:`In winter, hedgehogs slow their heartbeat and lower their body temperature so that they can live on stored fat. ${BLANK} some bats spend the cold months in a deep sleep inside caves.`,ch:[`Similarly,`,`However,`,`Therefore,`,`For instance,`],e:`Bats sleeping through winter, like hedgehogs, is a second case of the same behavior: a comparison, "Similarly."`},
{id:'trn11',d:3,p:`In her final novel, the author declined to give any of her characters names, a choice some reviewers found cold. ${BLANK} she identified them only by their work, the baker, the ferryman, the clockmaker, so that readers would see them first as parts of a village.`,ch:[`Instead,`,`Similarly,`,`Nevertheless,`,`Meanwhile,`],e:`Identifying characters by their work takes the place of giving them names: "Instead."`},
{id:'trn12',d:1,p:`To make paper by hand, workers first soak plant fibers in water. Next, they press the soft pulp into thin sheets. ${BLANK} they hang the sheets to dry.`,ch:['Finally,','However,','For example,','In contrast,'],e:'This is the last step of the process: "Finally."'},
].forEach(x=>item(Object.assign({sk:'rw_trans',stem:'trans'},x)));

// ===== READING AND WRITING ITEMS, PART 2 (phase 2 skills) =====
// The first choice listed is always the key; choices are shuffled when served.
const Q_WHOLE='Which choice best describes the overall structure of the text?';
const Q_PURPOSE='Which choice best states the main purpose of the text?';
const Q_SUPPORT=who=>`Which finding, if true, would most directly support ${who}?`;
const Q_WEAKEN=who=>`Which finding, if true, would most directly weaken ${who}?`;
const Q_QUOTE='Which quotation from the poem most effectively illustrates the claim?';
const NOTES=a=>`<div class="noteh">While researching a topic, a student has taken the following notes:</div><ul class="notes">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const SYN=g=>`The student wants to ${g}. Which choice most effectively uses relevant information from the notes to accomplish this goal?`;

// ---- Text structure and purpose ----
[
{id:'str01',d:1,p:`Many people assume that deserts are nearly empty of life. <u>In fact, the Sonoran Desert of the southwestern United States and northwestern Mexico is home to more than 2,000 species of plants.</u> Cacti, shrubs, and wildflowers there have adapted to survive long periods with little rain.`,
 ch:[`It presents evidence that challenges the assumption described in the first sentence.`,`It introduces an assumption about deserts that the rest of the text goes on to support with examples.`,`It explains why deserts receive so little rain compared with other regions of North America.`,`It describes how one kind of cactus in the Sonoran Desert stores water for long dry periods.`],
 e:`The first sentence gives a common belief (deserts are empty). The underlined sentence answers it with a fact that shows the opposite, so it challenges the assumption.`},
{id:'str02',d:1,p:`For years, the town council debated whether to build a new library. Supporters said it would give students a quiet place to study; opponents worried about the cost. <u>Finally, a local family offered to pay half the construction bill, and the council approved the plan the same month.</u>`,
 ch:[`It describes the event that settled the debate presented earlier in the text.`,`It gives an opponent's main reason for rejecting the plan to build the new library.`,`It explains why students needed a quiet place to study.`,`It questions whether the library was worth its cost.`],
 e:`The text sets up a debate over cost. The underlined sentence tells how it ended: a gift covered half the cost and the plan was approved.`},
{id:'str03',d:1,q:Q_PURPOSE,p:`Lighthouses once depended on keepers who lived on site to light the lamp each evening, trim the wick, and keep the lens clean. Beginning in the twentieth century, electric lamps and automatic timers took over these tasks one by one. By the 1990s, nearly every lighthouse in the United States operated without a resident keeper.`,
 ch:[`To describe how technology gradually replaced the work of lighthouse keepers`,`To argue that lighthouses are no longer needed for navigation`,`To explain how a lighthouse lens focuses its beam`,`To compare lighthouses in the United States with those in other countries`],
 e:`Every sentence traces the shift from keepers' duties to machines. The text makes no argument about whether lighthouses are needed, does not explain the lens, and mentions no other country.`},
{id:'str04',d:2,p:`Some critics dismissed the photographer's early work as mere snapshots of ordinary streets. <u>Yet those same pictures, taken in the 1950s, are now valued as detailed records of how city neighborhoods looked before highways were built through them.</u> Museums that once ignored her now compete to display the collection.`,
 ch:[`It contrasts the early criticism of the photographs with the way they are regarded today.`,`It explains why critics first dismissed the photographs as snapshots of ordinary city streets.`,`It describes the camera and the technique the photographer used to take the pictures in the 1950s.`,`It argues that the highways built through city neighborhoods improved them in the long run.`],
 e:`"Yet" signals a contrast: first critics dismissed the pictures, then the underlined sentence says they are now valued. That is a contrast between past criticism and present regard.`},
{id:'str05',d:2,q:Q_WHOLE,p:`For centuries, the giant squid was known almost entirely from dead specimens that washed ashore or were caught in fishing nets. Attempts to observe a living one in the deep sea repeatedly failed. In 2004, however, Japanese researchers photographed a living giant squid in its natural habitat for the first time, and in 2012 a team recorded video of one at a depth of about 600 meters.`,
 ch:[`It describes a long-standing difficulty and then reports how researchers overcame it.`,`It presents a theory about giant squid and then explains why the theory was abandoned.`,`It compares two methods of studying giant squid and recommends one of them.`,`It describes the giant squid's habitat and then explains how the animal hunts.`],
 e:`The first two sentences describe a problem (no living squid could be observed). "However" turns to the solution: the 2004 photographs and the 2012 video.`},
{id:'str06',d:3,p:`Economists describe a "network effect": a product becomes more valuable as more people use it. A telephone is useless if no one else has one but extremely useful when nearly everyone does. <u>The effect has limits, however: a crowded social platform can become less appealing if users feel overwhelmed by strangers.</u> Designers therefore try to grow a user base while keeping each person's experience manageable.`,
 ch:[`It qualifies the principle described earlier by noting a situation in which it may not hold.`,`It gives a second example that illustrates the principle introduced in the first sentence.`,`It rejects the principle as having no practical value.`,`It explains why the telephone became widely used.`],
 e:`The underlined sentence says the effect "has limits" and gives a case where more users make a product less appealing. That qualifies the principle; it does not illustrate it (the telephone did that) and does not reject it outright.`},
{id:'str07',d:3,p:`The poet's early collections are filled with close descriptions of her childhood farm: the rusted gate, the smell of cut hay, the sound of the creek after rain. <u>Her later poems, written after she moved to the city, rarely mention a specific place at all.</u> Instead, they dwell on memory itself, on how the mind reshapes what it once saw clearly.`,
 ch:[`It introduces a change in the poet's work that the final sentence goes on to describe.`,`It gives an example of the close descriptions mentioned in the first sentence.`,`It suggests that the poet's later work was less successful than her early work.`,`It explains why the poet decided to move to the city.`],
 e:`The first sentence describes the early poems; the underlined sentence says the later ones are different; "Instead" then explains what the later poems focus on. The sentence marks the shift.`},
{id:'str08',d:2,p:`In 1799, French soldiers in Egypt found a stone slab inscribed with the same decree in three scripts: Egyptian hieroglyphs, Demotic, and ancient Greek. <u>Because scholars could already read ancient Greek, the slab offered a way to work out what the hieroglyphs meant.</u> Using it, Jean-François Champollion announced in 1822 that he had deciphered the hieroglyphic system.`,
 ch:[`It explains why the discovery described in the first sentence mattered for understanding hieroglyphs.`,`It describes what the decree on the slab said and explains why it was written in three scripts.`,`It argues that ancient Greek was a more important language in ancient Egypt than Egyptian was.`,`It questions whether Champollion's announcement that he had deciphered the hieroglyphs was accurate.`],
 e:`The underlined sentence connects the find to its importance: the Greek text, which scholars could read, unlocked the hieroglyphs.`},
{id:'str09',d:2,q:Q_WHOLE,p:`The following text is from a short story.<br>The hallway was louder than any place Nadia had known, a river of backpacks and shouted names. She held her new schedule so tightly that the paper creased. Then a girl with paint on her sleeves stopped, glanced at the schedule, and said, "Room 214? I'm going there too. Follow me."`,
 ch:[`It describes a character's anxiety in an unfamiliar place and then presents an unexpected moment of help.`,`It describes a character's memories of a former school and then compares them with a new one.`,`It presents a conflict between two characters and then shows how they resolve it.`,`It describes a school building in detail and then explains its history.`],
 e:`Nadia is overwhelmed (the loud hallway, the creased schedule); then "Then" introduces a stranger who offers to help. There is no conflict between the girls and no memory of another school.`},
{id:'str10',d:3,p:`Museums have long displayed ancient Greek statues as gleaming white marble, and for centuries artists imitated that pure white look. <u>Close study of the statues' surfaces, however, has revealed traces of pigment, showing that many were originally painted in bright colors.</u> The white statues admired for so long, in other words, are not what their makers intended viewers to see.`,
 ch:[`It presents evidence that complicates a long-held view of how the statues looked.`,`It describes the tools ancient Greek sculptors used to carve marble.`,`It explains why later artists preferred to imitate white statues.`,`It offers an example that confirms the traditional view described in the first sentence.`],
